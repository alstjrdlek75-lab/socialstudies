<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">과점시장 굴절수요곡선과 가격경직성 (Kinked Demand Curve)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">생산량 (Q)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">가격, 비용 (P, C)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- Kinked Demand Curve -->
  <!-- Flat segment (elastic, price increase) -->
  <line x1="120" y1="130" x2="380" y2="210" stroke="#2563eb" stroke-width="3" />
  <text x="180" y="145" font-size="13" font-weight="bold" fill="#2563eb">가격 인상 시 탄력적 (비협조)</text>
  <!-- Steep segment (inelastic, price decrease) -->
  <line x1="380" y1="210" x2="620" y2="380" stroke="#1d4ed8" stroke-width="3" />
  <text x="500" y="330" font-size="13" font-weight="bold" fill="#1d4ed8">가격 인하 시 비탄력적 (협조/동조)</text>
  <!-- Discontinuous MR -->
  <line x1="120" y1="130" x2="380" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="380" y1="280" x2="380" y2="350" stroke="#dc2626" stroke-width="3" stroke-dasharray="3,3" />
  <text x="390" y="315" font-size="12" font-weight="bold" fill="#dc2626">수직 단절 구간</text>
  <line x1="380" y1="350" x2="520" y2="390" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4" />
  <!-- MC curves intersecting the gap -->
  <path d="M 280 340 Q 380 310 480 270" fill="none" stroke="#059669" stroke-width="2.5" />
  <text x="490" y="275" font-size="13" font-weight="bold" fill="#059669">MC1</text>
  <path d="M 280 360 Q 380 330 480 290" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3" />
  <text x="490" y="295" font-size="13" font-weight="bold" fill="#10b981">MC2 (비용 변동 시에도 가격 불변)</text>
  <!-- Kink Point -->
  <circle cx="380" cy="210" r="6" fill="#f59e0b" />
  <line x1="380" y1="390" x2="380" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="210" x2="380" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="50" y="215" font-size="14" font-weight="bold" fill="#0f172a">P* (경직적 가격)</text>
  <text x="370" y="410" font-size="14" font-weight="bold" fill="#0f172a">Q*</text>
</svg>