<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="990" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="move-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- Feasible Set Shading: Origin (100, 365), rx=390, ry=290 -->
  <path d="M 100 75 A 390 290 0 0 1 490 365 L 100 365 Z" fill="#f8fafc" />

  <!-- Axes -->
  <line x1="100" y1="365" x2="100" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="100" y1="365" x2="555" y2="365" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />

  <text x="86" y="28" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Y재</text>
  <text x="565" y="370" font-size="16" font-weight="800" fill="#0f172a">X재</text>
  <text x="84" y="384" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Concave PPF Curve: (x-100)^2 / 390^2 + (365-y)^2 / 290^2 = 1 -->
  <path d="M 100 75 A 390 290 0 0 1 490 365" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" />
  <text x="498" y="346" font-size="17" font-weight="800" fill="#1d4ed8">PPF</text>

  <!-- Point A: theta = 62 deg -> x = 100 + 390*cos(62)=283.1, y = 365 - 290*sin(62)=108.9; dy/dx = (290/390)*cot(62) = 0.395 -->
  <line x1="210" y1="80" x2="356" y2="137.7" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="283" cy="109" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="283" y="88" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" class="halo">A (완만한 기울기)</text>

  <!-- Point B: theta = 26 deg -> x = 100 + 390*cos(26)=450.5, y = 365 - 290*sin(26)=237.9; dy/dx = (290/390)*cot(26) = 1.525 -->
  <line x1="414" y1="182.2" x2="487" y2="293.6" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6,4" />
  <circle cx="450.5" cy="238" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="468" y="232" font-size="16" font-weight="800" fill="#b91c1c" class="halo">B (가파른 기울기)</text>

  <!-- Curved Arrow A -> B showing Increasing Opportunity Cost -->
  <path d="M 316 128 Q 386 162 428 212" fill="none" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#move-arr)" />
  <text x="394" y="160" font-size="14" font-weight="800" fill="#b91c1c" class="halo">기회비용(MRT) 체증</text>

  <!-- Point C: Inside (Inefficient) -->
  <circle cx="235" cy="255" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <text x="250" y="260" font-size="15.5" font-weight="800" fill="#0f172a">C (비효율 · 유휴자원)</text>

  <!-- Point D: Outside (Unattainable) -->
  <circle cx="435" cy="88" r="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />
  <text x="450" y="93" font-size="15.5" font-weight="700" fill="#475569">D (생산 불가능)</text>

  <!-- Clean Formula Note at Bottom -->
  <text x="320" y="406" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">
    접선 기울기 절댓값 = MRTxy = ΔY / ΔX = MCx / MCy
  </text>
</svg>
