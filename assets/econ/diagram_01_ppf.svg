<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">생산가능곡선 (PPF)과 기회비용 체증의 법칙</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="160" y="62" width="600" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 한계변환율 MRTxy = MCx / MCy (접선 기울기 절댓값) 체증 ➔ 원점에 대해 오목한 형태</text>

  <!-- Main Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#475569">X재 생산량 (소비재)</text>
  <text x="100" y="92" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Y재 생산량 (자본재)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- Shaded Production Feasible Set -->
  <path d="M 100 130 Q 380 150, 680 460 L 100 460 Z" fill="#f0fdf4" fill-opacity="0.7" />

  <!-- PPF Curve (Concave to origin) -->
  <!-- Start: (100, 130), Control: (380, 150), End: (680, 460) -->
  <path d="M 100 130 Q 380 150, 680 460" fill="none" stroke="#16a34a" stroke-width="3.5" />
  <text x="690" y="455" font-size="13" font-weight="bold" fill="#16a34a">PPF0 (기존)</text>

  <!-- Shifted PPF1 (Technological Progress in X & Y) -->
  <path d="M 100 110 Q 450 120, 780 460" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="785" y="450" font-size="12" font-weight="bold" fill="#2563eb">PPF1 (기술진보 시)</text>

  <!-- Points on PPF0 -->
  <!-- Point A (220, 168): low X, high Y, gentle tangent -->
  <circle cx="220" cy="168" r="5" fill="#16a34a" />
  <line x1="150" y1="145" x2="290" y2="191" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3,3" />
  <text x="215" y="152" font-size="12" font-weight="bold" fill="#166534">A (기회비용 작음, 평탄한 기울기)</text>

  <!-- Point B (480, 275): high X, low Y, steep tangent -->
  <circle cx="480" cy="275" r="5" fill="#16a34a" />
  <line x1="390" y1="180" x2="570" y2="370" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3,3" />
  <text x="495" y="270" font-size="12" font-weight="bold" fill="#166534">B (기회비용 큼, 가파른 기울기)</text>

  <!-- Movement arrow A -> B -->
  <path d="M 235 185 Q 350 210, 460 270" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)" />
  <text x="330" y="240" font-size="11" font-weight="bold" fill="#dc2626">X재 증산 시 Y재 포기량 체증 (MRTxy ↑)</text>

  <!-- Point C: Inefficient (Inside PPF) -->
  <circle cx="280" cy="360" r="5" fill="#d97706" />
  <text x="295" y="365" font-size="11.5" font-weight="bold" fill="#b45309">C (비효율적 생산점, 실업·유휴자원 존재)</text>

  <!-- Point D: Unattainable (Outside PPF) -->
  <circle cx="620" cy="200" r="5" fill="#9333ea" />
  <text x="635" y="205" font-size="11.5" font-weight="bold" fill="#7e22ce">D (현재 기술·자원 하에서 생산 불가능한 점)</text>
</svg>