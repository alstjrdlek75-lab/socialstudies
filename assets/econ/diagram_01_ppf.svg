<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="curve-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="960" height="48" fill="#f8fafc" />
  <line x1="0" y1="48" x2="960" y2="48" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="480" y="31" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">생산가능곡선 (PPF)과 기회비용 체증의 법칙</text>

  <!-- ==================== LEFT GRAPH AREA ==================== -->
  <!-- Axes: Origin at (100, 460) -->
  <line x1="100" y1="460" x2="100" y2="75" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="460" x2="580" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />

  <!-- Axis Labels -->
  <text x="100" y="65" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">Y재 생산량 (자본재)</text>
  <text x="590" y="464" font-size="13" font-weight="800" fill="#1e293b">X재 생산량 (소비재)</text>
  <text x="85" y="475" font-size="12" font-weight="600" fill="#94a3b8">0</text>

  <!-- Shaded Feasible Production Set (Quarter-ellipse: rx=440, ry=330 from (100,460)) -->
  <path d="M 100 130 A 440 330 0 0 1 540 460 L 100 460 Z" fill="#f0fdf4" fill-opacity="0.6" />
  <text x="190" y="420" font-size="12" font-weight="700" fill="#86efac" letter-spacing="1">생산가능영역 (Feasible Set)</text>

  <!-- PPF Curve (Concave to Origin) -->
  <path d="M 100 130 A 440 330 0 0 1 540 460" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
  <rect x="505" y="470" width="48" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="529" y="484" font-size="11" font-weight="800" fill="#166534" text-anchor="middle">PPF</text>

  <!-- Point A (x=286, y=161) -->
  <!-- Tangent Line at A (Slope = 0.35, gentle) -->
  <line x1="206" y1="133" x2="366" y2="189" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="286" cy="161" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2.5" />
  <!-- Label A directly above -->
  <text x="286" y="116" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">점 A</text>
  <text x="286" y="131" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">완만한 접선 기울기 (MRTxy 작음)</text>

  <!-- Point B (x=481, y=295) -->
  <!-- Tangent Line at B (Slope = 1.30, steep) -->
  <line x1="436" y1="236" x2="526" y2="354" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" />
  <circle cx="481" cy="295" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2.5" />
  <!-- Label B directly right -->
  <text x="505" y="278" font-size="13" font-weight="800" fill="#b91c1c">점 B</text>
  <text x="505" y="294" font-size="11" font-weight="600" fill="#dc2626">가파른 접선 기울기 (MRTxy 큼)</text>

  <!-- Curved Arrow along PPF from A toward B -->
  <path d="M 330 185 Q 405 220 445 260" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#curve-arr)" />
  <!-- Pill Badge along Arrow -->
  <g transform="translate(305, 208)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
    <text x="90" y="16" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">X재 증산 ➔ 기회비용(MRTxy) 체증</text>
  </g>

  <!-- Point C: Inside PPF (Inefficient) -->
  <circle cx="230" cy="320" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" />
  <text x="244" y="318" font-size="12" font-weight="800" fill="#b45309">점 C (비효율적 생산)</text>
  <text x="244" y="333" font-size="10.5" font-weight="600" fill="#78350f">실업 및 유휴 자원 존재</text>

  <!-- Point D: Outside PPF (Unattainable) -->
  <circle cx="460" cy="130" r="6" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
  <text x="474" y="128" font-size="12" font-weight="800" fill="#6d28d9">점 D (생산 불가능)</text>
  <text x="474" y="143" font-size="10.5" font-weight="600" fill="#4c1d95">현재 자원·기술 수준 초과</text>

  <!-- ==================== RIGHT INFO PANEL ==================== -->
  <g transform="translate(635, 65)" filter="url(#card-shadow)">
    <!-- Card Container -->
    <rect x="0" y="0" width="310" height="448" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Card Header -->
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 42 L 0 42 Z" fill="#f8fafc" />
    <line x1="0" y1="42" x2="310" y2="42" stroke="#e2e8f0" stroke-width="1" />
    <text x="18" y="27" font-size="13.5" font-weight="800" fill="#0f172a">💡 핵심 개념 한눈에 정리</text>

    <!-- Section 1: Points meaning -->
    <g transform="translate(16, 58)">
      <rect x="0" y="0" width="5" height="14" rx="2.5" fill="#2563eb" />
      <text x="12" y="12" font-size="12" font-weight="800" fill="#1e293b">1. 생산점의 위치별 의미</text>

      <g transform="translate(4, 25)">
        <circle cx="5" cy="5" r="4.5" fill="#16a34a" />
        <text x="16" y="9" font-size="11.5" font-weight="700" fill="#166534">곡선 상 (점 A, B)</text>
        <text x="16" y="23" font-size="10.5" fill="#475569">모든 자원을 효율적으로 완전고용 생산</text>

        <circle cx="5" cy="41" r="4.5" fill="#f59e0b" />
        <text x="16" y="45" font-size="11.5" font-weight="700" fill="#b45309">곡선 내부 (점 C)</text>
        <text x="16" y="59" font-size="10.5" fill="#475569">자원 낭비 및 실업 존재 (비효율적)</text>

        <circle cx="5" cy="77" r="4.5" fill="#8b5cf6" />
        <text x="16" y="81" font-size="11.5" font-weight="700" fill="#6d28d9">곡선 외부 (점 D)</text>
        <text x="16" y="95" font-size="10.5" fill="#475569">현재의 생산요소·기술로 달성 불가</text>
      </g>
    </g>

    <line x1="16" y1="182" x2="294" y2="182" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Section 2: Law of Increasing Opportunity Cost -->
    <g transform="translate(16, 196)">
      <rect x="0" y="0" width="5" height="14" rx="2.5" fill="#dc2626" />
      <text x="12" y="12" font-size="12" font-weight="800" fill="#1e293b">2. 기회비용 체증의 법칙 원리</text>

      <g transform="translate(6, 25)">
        <text x="0" y="10" font-size="11" font-weight="700" fill="#0f172a">• X재 증산 시 Y재 포기량 점증</text>
        <text x="8" y="26" font-size="10.5" fill="#475569">생산요소마다 적합도(특화도)가 상이하여,</text>
        <text x="8" y="40" font-size="10.5" fill="#475569">X재 생산을 늘릴수록 비효율적인 자원이</text>
        <text x="8" y="54" font-size="10.5" fill="#475569">투입되므로 포기해야 할 Y재가 증가함</text>
      </g>
    </g>

    <line x1="16" y1="282" x2="294" y2="282" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Section 3: MRT & Concave Shape -->
    <g transform="translate(16, 296)">
      <rect x="0" y="0" width="5" height="14" rx="2.5" fill="#16a34a" />
      <text x="12" y="12" font-size="12" font-weight="800" fill="#1e293b">3. 한계변환율 (MRTxy)과 형태</text>

      <!-- Formula Box -->
      <rect x="4" y="24" width="280" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="144" y="42" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">MRTxy = - (ΔY / ΔX) = MCx / MCy</text>
      <text x="144" y="56" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">( = 생산가능곡선 접선 기울기의 절댓값 )</text>

      <g transform="translate(6, 80)">
        <text x="0" y="12" font-size="11" font-weight="700" fill="#166534">➔ X재 생산 증가 시 MRTxy 상승 (체증)</text>
        <text x="0" y="28" font-size="10.5" font-weight="600" fill="#0f172a">➔ 곡선이 <tspan fill="#dc2626" font-weight="800">원점에 대해 오목(Concave)</tspan>한 형태</text>
      </g>
    </g>
  </g>
</svg>