<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="960" height="48" fill="#f8fafc" />
  <text x="480" y="31" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">생산가능곡선 (PPF)과 기회비용 체증의 법칙</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="130" y="58" width="700" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="480" y="75" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">
    • 한계변환율 MRTxy = MCx / MCy (접선 기울기의 절댓값) 체증 ➔ 원점에 대해 오목한 형태
  </text>

  <!-- Summary Card (Top-Right) -->
  <g transform="translate(710, 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="235" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="235" height="26" rx="8" fill="#f1f5f9" />
    <path d="M 0 16 L 0 26 L 235 26 L 235 16 z" fill="#f1f5f9" />
    <text x="12" y="18" font-size="11.5" font-weight="bold" fill="#1e293b">📌 기회비용 체증의 원리</text>

    <text x="12" y="44" font-size="10.5" font-weight="bold" fill="#166534">• 재화별 생산요소 투입비율 상이</text>
    <text x="20" y="60" font-size="9.5" fill="#64748b">특화된 생산요소 전용에 한계 존재</text>

    <text x="12" y="80" font-size="10.5" font-weight="bold" fill="#dc2626">• X재 증산 시 Y재 포기량 증가</text>
    <text x="20" y="96" font-size="9.5" fill="#64748b">비효율적 생산요소 투입 ➔ MCx 상승</text>

    <line x1="10" y1="108" x2="225" y2="108" stroke="#e2e8f0" stroke-width="1" />

    <text x="12" y="126" font-size="10.5" font-weight="bold" fill="#2563eb">➔ 접선 기울기 절댓값(MRTxy) 상승</text>
    <text x="12" y="142" font-size="9.5" fill="#475569">생산가능곡선이 원점에 오목(Concave)</text>
  </g>

  <!-- Main Axes: Origin (100, 470) -->
  <line x1="100" y1="470" x2="780" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="470" x2="100" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <text x="790" y="475" font-size="12" font-weight="bold" fill="#334155">X재 생산량 (소비재)</text>
  <text x="100" y="84" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Y재 생산량 (자본재)</text>
  <text x="86" y="484" font-size="11" fill="#94a3b8">0</text>

  <!-- Shaded Production Feasible Set -->
  <path d="M 100 140 Q 420 160, 700 470 L 100 470 Z" fill="#f0fdf4" fill-opacity="0.6" />

  <!-- Shifted PPF1 (Technological Progress in X & Y) -->
  <path d="M 100 110 Q 500 130, 800 470" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,4" />
  <rect x="710" y="420" width="160" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="790" y="435" font-size="10.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PPF1 (기술 진보 시 외측 이동)</text>

  <!-- PPF0 Curve (Concave to origin) -->
  <path d="M 100 140 Q 420 160, 700 470" fill="none" stroke="#16a34a" stroke-width="3.5" />
  <rect x="640" y="480" width="80" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="680" y="494" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">PPF0 (기존)</text>

  <!-- Tangent Line at Point A (226, 160) - gentle slope = 0.25 -->
  <line x1="120" y1="134" x2="332" y2="187" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="226" cy="160" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />

  <!-- Point A Callout Badge (Positioned above-left cleanly) -->
  <g transform="translate(140, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
    <text x="10" y="16" font-size="11" font-weight="bold" fill="#166534">점 A (X재 소량 생산)</text>
    <text x="10" y="30" font-size="9.5" fill="#15803d">• 완만한 접선 기울기 (기회비용 작음)</text>
  </g>
  <line x1="226" y1="133" x2="226" y2="154" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Tangent Line at Point B (528, 310) - steep slope = 0.764 -->
  <line x1="430" y1="235" x2="626" y2="385" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <circle cx="528" cy="310" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />

  <!-- Point B Callout Badge (Positioned right cleanly) -->
  <g transform="translate(560, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
    <text x="10" y="16" font-size="11" font-weight="bold" fill="#b91c1c">점 B (X재 다량 생산)</text>
    <text x="10" y="30" font-size="9.5" fill="#dc2626">• 가파른 접선 기울기 (기회비용 큼)</text>
  </g>
  <line x1="560" y1="270" x2="534" y2="305" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Movement along PPF from A to B -->
  <path d="M 255 175 Q 370 215, 495 285" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <rect x="260" y="222" width="220" height="24" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" filter="url(#shadow)" />
  <text x="370" y="238" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">A ➔ B: X재 증산 시 Y재 포기량 체증 (MRTxy ↑)</text>

  <!-- Point C: Inefficient Point (Inside PPF) -->
  <circle cx="270" cy="350" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(160, 375)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
    <text x="8" y="15" font-size="10.5" font-weight="bold" fill="#b45309">점 C: 비효율적 생산점</text>
    <text x="8" y="28" font-size="9" fill="#78350f">• 내부 점: 실업 및 유휴 자원 존재</text>
  </g>
  <line x1="260" y1="355" x2="260" y2="375" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Point D: Unattainable Point (Outside PPF) -->
  <circle cx="640" cy="180" r="5.5" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(560, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="34" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
    <text x="8" y="15" font-size="10.5" font-weight="bold" fill="#6d28d9">점 D: 생산 불가능한 점</text>
    <text x="8" y="28" font-size="9" fill="#4c1d95">• 현재의 기술·자원 수준 초과</text>
  </g>
  <line x1="640" y1="164" x2="640" y2="175" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2" />
</svg>