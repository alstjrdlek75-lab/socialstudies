<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="1050" height="645" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- Geometry: Origin (105, 355); Autarky E0 = (355, 115) -->
  <!-- S: y = -0.8*(x - 355) + 115 -> at y=195 (Pw+t): x = 255 (Q2); at y=267 (Pw): x = 165 (Q1) -->
  <!-- D: y = +0.8*(x - 355) + 115 -> at y=195 (Pw+t): x = 455 (Q3); at y=267 (Pw): x = 545 (Q4) -->

  <!-- (a) Producer Surplus Gain: (105,195)-(255,195)-(165,267)-(105,267) -->
  <polygon points="105,195 255,195 165,267 105,267" fill="#f1f5f9" />
  <text x="158" y="237" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">a (+생산자)</text>

  <!-- (b) Production Distortion DWL: (165,267)-(255,195)-(255,267) -->
  <polygon points="165,267 255,195 255,267" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.6" />
  <text x="228" y="252" font-size="16" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">b</text>

  <!-- (c) Tariff Revenue: x=255..455, y=195..267 -->
  <rect x="255" y="195" width="200" height="72" fill="#dbeafe" fill-opacity="0.75" />
  <text x="355" y="230" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle">c (관세수입)</text>
  <text x="355" y="252" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">(Q₃ − Q₂) × t</text>

  <!-- (d) Consumption Distortion DWL: (455,195)-(545,267)-(455,267) -->
  <polygon points="455,195 545,267 455,267" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.6" />
  <text x="482" y="252" font-size="16" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">d</text>

  <!-- Leader Lines for b & d DWL Labels (Cleanly above/below without crowding!) -->
  <line x1="218" y1="262" x2="205" y2="302" stroke="#b91c1c" stroke-width="1.5" />
  <text x="202" y="320" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">생산왜곡 손실</text>

  <line x1="492" y1="262" x2="505" y2="302" stroke="#b91c1c" stroke-width="1.5" />
  <text x="508" y="320" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">소비왜곡 손실</text>

  <!-- Projections -->
  <line x1="165" y1="267" x2="165" y2="355" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <line x1="255" y1="195" x2="255" y2="355" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="455" y1="195" x2="455" y2="355" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="545" y1="267" x2="545" y2="355" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />

  <!-- Axes -->
  <line x1="105" y1="355" x2="625" y2="355" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="105" y1="355" x2="105" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="635" y="360" font-size="16" font-weight="800" fill="#0f172a">수량 Q</text>
  <text x="105" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">가격 P</text>
  <text x="89" y="372" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Domestic Supply S & Demand D -->
  <line x1="130" y1="295" x2="430" y2="55" stroke="#0f172a" stroke-width="3" />
  <text x="438" y="58" font-size="16" font-weight="800" fill="#0f172a">국내공급 S</text>

  <line x1="280" y1="55" x2="585" y2="299" stroke="#1d4ed8" stroke-width="3" />
  <text x="593" y="304" font-size="16" font-weight="800" fill="#1d4ed8">국내수요 D</text>

  <!-- World Price Pw & Tariff Price Pw + t -->
  <line x1="105" y1="267" x2="595" y2="267" stroke="#475569" stroke-width="2.2" />
  <text x="603" y="272" font-size="15" font-weight="700" fill="#475569">국제가격 Pw</text>
  <text x="93" y="272" font-size="15" font-weight="700" fill="#475569" text-anchor="end">Pw</text>

  <line x1="105" y1="195" x2="595" y2="195" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7,5" />
  <text x="603" y="200" font-size="15" font-weight="800" fill="#1d4ed8">관세 가격</text>
  <text x="93" y="200" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">Pw + t</text>

  <!-- X-Axis Quantities & Post-Tariff Import Bracket -->
  <text x="165" y="380" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">Q₁</text>
  <text x="255" y="380" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q₂</text>
  <text x="455" y="380" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q₃</text>
  <text x="545" y="380" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">Q₄</text>

  <line x1="260" y1="400" x2="450" y2="400" stroke="#1d4ed8" stroke-width="2.3" marker-start="url(#blue-arr)" marker-end="url(#blue-arr)" />
  <text x="355" y="421" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle">관세 후 수입량 (Q₃ − Q₂)</text>
</svg>
