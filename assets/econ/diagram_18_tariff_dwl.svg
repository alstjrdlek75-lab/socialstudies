<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-left-red" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-right-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-up-red" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1.5 8 L 5 0 L 8.5 8 z" fill="#dc2626" />
    </marker>
    <marker id="arr-down-red" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#dc2626" />
    </marker>

    <!-- Shadow filter for cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="960" height="48" fill="#f8fafc" />
  <text x="480" y="31" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">소국 개방경제의 관세 부과 효과와 사회적 후생손실 (DWL)</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 2. Subtitle Banner -->
  <rect x="130" y="58" width="700" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="480" y="75" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">
    • 소비자잉여 감소 -(a+b+c+d) ➔ 생산자잉여 증가 (+a), 정부 관세수입 (+c), 사중손실 -(b+d)
  </text>

  <!-- 3. Key Summary Card (Top-Right: y=90 to y=256, cleanly above y=280 price line) -->
  <g transform="translate(710, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="235" height="166" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="235" height="28" rx="8" fill="#f1f5f9" />
    <path d="M 0 18 L 0 28 L 235 28 L 235 18 z" fill="#f1f5f9" />
    <text x="12" y="19" font-size="12" font-weight="bold" fill="#1e293b">📊 관세 부과의 후생 효과 종합</text>

    <text x="12" y="46" font-size="11" font-weight="bold" fill="#2563eb">• 소비자잉여: -(a + b + c + d)</text>
    <text x="12" y="68" font-size="11" font-weight="bold" fill="#b45309">• 생산자잉여: +a (국내공급 보호)</text>
    <text x="12" y="90" font-size="11" font-weight="bold" fill="#1d4ed8">• 정부 관세수입: +c (수입량 × t)</text>

    <line x1="10" y1="102" x2="225" y2="102" stroke="#e2e8f0" stroke-width="1" />

    <text x="12" y="121" font-size="11" font-weight="bold" fill="#dc2626">• 사회적 순손실(DWL): -(b + d)</text>
    <text x="20" y="139" font-size="10" fill="#475569">b: 생산왜곡(비효율) / d: 소비왜곡</text>
    <text x="12" y="155" font-size="10" font-weight="bold" fill="#b91c1c">➔ 소국 관세는 항상 사회총후생 감소!</text>
  </g>

  <!-- 4. Surplus Regions (Plotted first so lines render above them) -->
  <!-- (a) Producer Surplus Gain: Trapezoid (100,280)-(350,280)-(250,360)-(100,360) -->
  <polygon points="100,280 350,280 250,360 100,360" fill="#fef3c7" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
  <text x="200" y="315" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">a</text>
  <text x="200" y="333" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">생산자잉여 증가 (+a)</text>

  <!-- (b) Production Distortion DWL: Triangle (250,360)-(350,280)-(350,360) -->
  <polygon points="250,360 350,280 350,360" fill="#fee2e2" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.5" />
  <text x="317" y="324" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">b</text>
  <text x="317" y="340" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">생산 왜곡</text>
  <text x="317" y="353" font-size="9.5" font-weight="bold" fill="#991b1b" text-anchor="middle">(DWL)</text>

  <!-- (c) Tariff Revenue: Rectangle (350,280)-(550,280)-(550,360)-(350,360) -->
  <rect x="350" y="280" width="200" height="80" fill="#dbeafe" fill-opacity="0.9" stroke="#2563eb" stroke-width="1.5" />
  <text x="450" y="310" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">c</text>
  <text x="450" y="328" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">정부 관세수입 (+c)</text>
  <text x="450" y="344" font-size="10.5" fill="#2563eb" text-anchor="middle">수입량(Q3-Q2) × 관세(t)</text>

  <!-- (d) Consumption Distortion DWL: Triangle (550,280)-(650,360)-(550,360) -->
  <polygon points="550,280 650,360 550,360" fill="#fee2e2" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.5" />
  <text x="583" y="324" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">d</text>
  <text x="583" y="340" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">소비 왜곡</text>
  <text x="583" y="353" font-size="9.5" font-weight="bold" fill="#991b1b" text-anchor="middle">(DWL)</text>

  <!-- 5. Axes: Origin at (100, 470) -->
  <line x1="100" y1="470" x2="700" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="470" x2="100" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  
  <text x="710" y="475" font-size="13" font-weight="bold" fill="#1e293b">수량 (Q)</text>
  <text x="100" y="84" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">가격 (P)</text>
  <text x="86" y="484" font-size="11" fill="#94a3b8">0</text>

  <!-- 6. Domestic Supply & Demand Lines -->
  <!-- Domestic Supply (S): passes through (150, 440) -> (250, 360) -> (350, 280) -> (450, 200) -> (520, 144) -->
  <line x1="150" y1="440" x2="520" y2="144" stroke="#16a34a" stroke-width="3.5" />
  <text x="528" y="142" font-size="13" font-weight="bold" fill="#16a34a">국내 공급 (S)</text>

  <!-- Domestic Demand (D): passes through (380, 144) -> (450, 200) -> (550, 280) -> (650, 360) -> (750, 440) -->
  <line x1="380" y1="144" x2="750" y2="440" stroke="#2563eb" stroke-width="3.5" />
  <text x="758" y="445" font-size="13" font-weight="bold" fill="#2563eb">국내 수요 (D)</text>

  <!-- Autarky Equilibrium Point (450, 200) -->
  <circle cx="450" cy="200" r="5" fill="#475569" stroke="#ffffff" stroke-width="1.5" />
  <text x="450" y="190" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">폐쇄경제 균형 (E0)</text>

  <!-- 7. Price Lines -->
  <!-- Tariff Price Pw + t (y=280) -->
  <line x1="100" y1="280" x2="695" y2="280" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <rect x="702" y="271" width="168" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="708" y="285" font-size="11" font-weight="bold" fill="#dc2626">Pw + t (관세 부과 가격)</text>
  <text x="92" y="284" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="end">Pw + t</text>

  <!-- World Price Pw (y=360) -->
  <line x1="100" y1="360" x2="695" y2="360" stroke="#475569" stroke-width="2.5" />
  <rect x="702" y="351" width="180" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="708" y="365" font-size="11" font-weight="bold" fill="#475569">Pw (국제가격: 완전탄력적)</text>
  <text x="92" y="364" font-size="11" font-weight="bold" fill="#475569" text-anchor="end">Pw</text>

  <!-- Tariff measure bracket on the right -->
  <line x1="680" y1="285" x2="680" y2="355" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arr-up-red)" marker-end="url(#arr-down-red)" />
  <text x="674" y="324" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="end">관세(t)</text>

  <!-- 8. Projections to X-axis -->
  <!-- Q1 (250) -->
  <line x1="250" y1="360" x2="250" y2="470" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="232" y="478" width="36" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="250" y="493" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">Q1</text>

  <!-- Q2 (350) -->
  <line x1="350" y1="280" x2="350" y2="470" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="330" y="478" width="40" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="350" y="493" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Q2</text>

  <!-- Q3 (550) -->
  <line x1="550" y1="280" x2="550" y2="470" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="530" y="478" width="40" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="550" y="493" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Q3</text>

  <!-- Q4 (650) -->
  <line x1="650" y1="360" x2="650" y2="470" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="632" y="478" width="36" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="650" y="493" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">Q4</text>

  <!-- 9. Import Volume Brackets -->
  <!-- Before tariff imports: Q1 -> Q4 (400px) -->
  <line x1="255" y1="400" x2="645" y2="400" stroke="#64748b" stroke-width="2" marker-start="url(#arr-left)" marker-end="url(#arr-right)" />
  <rect x="375" y="388" width="150" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="450" y="402" font-size="10.5" font-weight="bold" fill="#475569" text-anchor="middle">관세 전 수입량 (Q1 ➔ Q4)</text>

  <!-- After tariff imports: Q2 -> Q3 (200px) -->
  <line x1="355" y1="432" x2="545" y2="432" stroke="#dc2626" stroke-width="2" marker-start="url(#arr-left-red)" marker-end="url(#arr-right-red)" />
  <rect x="365" y="420" width="170" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="450" y="434" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">관세 후 수입량 (Q2 ➔ Q3, 감소)</text>
</svg>