<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">소국 개방경제의 관세 부과 효과와 사회적 후생손실 (DWL)</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 소비자잉여 감소분 -(a+b+c+d) ➔ 생산자잉여 증가(+a), 정부 관세수입(+c), 순후생손실 -(b+d)</text>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#475569">수량 (Q)</text>
  <text x="100" y="88" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">가격 (P)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- Domestic Demand D: y = 0.5*x + 90 -->
  <!-- at x=140: y=160; at x=660: y=420 -->
  <line x1="140" y1="160" x2="660" y2="420" stroke="#2563eb" stroke-width="3" />
  <text x="670" y="425" font-size="13" font-weight="bold" fill="#2563eb">국내 수요 (D)</text>

  <!-- Domestic Supply S: y = -0.5*x + 500 -->
  <!-- at x=140: y=430; at x=660: y=170 -->
  <line x1="140" y1="430" x2="660" y2="170" stroke="#16a34a" stroke-width="3" />
  <text x="670" y="175" font-size="13" font-weight="bold" fill="#16a34a">국내 공급 (S)</text>

  <!-- World Price Pw (horizontal at y=360): -->
  <!-- S at Pw: -0.5*x + 500 = 360 => x = 280 (Q1) -->
  <!-- D at Pw: 0.5*x + 90 = 360 => x = 540 (Q4) -->
  <line x1="100" y1="360" x2="720" y2="360" stroke="#64748b" stroke-width="2.5" />
  <text x="730" y="365" font-size="12" font-weight="bold" fill="#64748b">Pw (국제가격: 완전탄력적)</text>

  <!-- Tariff Price Pw + t (horizontal at y=300): -->
  <!-- S at Pt: -0.5*x + 500 = 300 => x = 400 (Q2) -->
  <!-- D at Pt: 0.5*x + 90 = 300 => x = 420 (Q3) -> let adjust spacing -->
  <!-- Let Pw = 370 (Q1=260, Q4=560) -->
  <!-- Let Pt = 310 (Q2=380, Q3=440) -->
  <line x1="100" y1="300" x2="720" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="730" y="305" font-size="12" font-weight="bold" fill="#dc2626">Pw + t (관세 부과 가격)</text>

  <!-- Surplus regions between y=300 and y=360: -->
  <!-- S intersects y=360 at x=280, y=300 at x=400 -->
  <!-- D intersects y=300 at x=420, y=360 at x=540 -->

  <!-- (a) Producer Surplus Gain: Trapezoid (100 to 280 at 360, 100 to 400 at 300) -->
  <polygon points="100,360 280,360 400,300 100,300" fill="#fef3c7" fill-opacity="0.85" stroke="#d97706" />
  <text x="220" y="335" font-size="13" font-weight="bold" fill="#b45309">a (생산자잉여 증가)</text>

  <!-- (b) Production Distortion DWL: Triangle (280,360) to (400,300) to (400,360) -->
  <polygon points="280,360 400,300 400,360" fill="#fecaca" stroke="#dc2626" stroke-width="1.8" />
  <text x="365" y="348" font-size="12" font-weight="bold" fill="#b91c1c">b (DWL)</text>

  <!-- (c) Government Tariff Revenue: Rectangle (400 to 420, 300 to 360) -> Let make Q3 wider for visibility -->
  <rect x="400" y="300" width="80" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="440" y="335" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">c (관세수입)</text>

  <!-- (d) Consumption Distortion DWL: Triangle (480,300) to (480,360) to (560,360) -->
  <polygon points="480,300 480,360 560,360" fill="#fecaca" stroke="#dc2626" stroke-width="1.8" />
  <text x="500" y="348" font-size="12" font-weight="bold" fill="#b91c1c">d (DWL)</text>

  <!-- Projections to X axis -->
  <!-- Q1 (280) -->
  <line x1="280" y1="360" x2="280" y2="460" stroke="#64748b" stroke-dasharray="3,3" />
  <text x="280" y="478" font-size="11" fill="#475569" text-anchor="middle">Q1</text>

  <!-- Q2 (400) -->
  <line x1="400" y1="300" x2="400" y2="460" stroke="#dc2626" stroke-dasharray="3,3" />
  <text x="400" y="478" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Q2</text>

  <!-- Q3 (480) -->
  <line x1="480" y1="300" x2="480" y2="460" stroke="#dc2626" stroke-dasharray="3,3" />
  <text x="480" y="478" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Q3</text>

  <!-- Q4 (560) -->
  <line x1="560" y1="360" x2="560" y2="460" stroke="#64748b" stroke-dasharray="3,3" />
  <text x="560" y="478" font-size="11" fill="#475569" text-anchor="middle">Q4</text>

  <!-- Import brackets -->
  <line x1="280" y1="410" x2="560" y2="410" stroke="#64748b" stroke-width="2" />
  <text x="420" y="405" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">관세 전 수입량 (Q1 ➔ Q4)</text>

  <line x1="400" y1="435" x2="480" y2="435" stroke="#dc2626" stroke-width="2.5" />
  <text x="440" y="430" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">관세 후 수입량 (Q2 ➔ Q3)</text>
</svg>