<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-left-blue" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-right-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-up-blue" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1.5 8 L 5 0 L 8.5 8 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-down-blue" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#1d4ed8" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f8fafc" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="960" height="46" fill="#f8fafc" />
  <text x="480" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">소국 개방경제의 관세 부과 효과와 사회적 후생손실 (DWL)</text>
  <line x1="0" y1="46" x2="960" y2="46" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- 2. Subtitle Banner -->
  <rect x="145" y="56" width="670" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="73" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">
    소비자잉여 감소 -(a+b+c+d)  →  생산자잉여 증가 (+a), 정부 관세수입 (+c), 사중손실 -(b+d)
  </text>

  <!-- 3. Key Summary Card (Top-Right: y=92 to y=254) -->
  <g transform="translate(705, 92)">
    <rect x="0" y="0" width="238" height="162" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="238" height="28" rx="8" fill="#f8fafc" />
    <path d="M 0 18 L 0 28 L 238 28 L 238 18 z" fill="#f8fafc" />
    <line x1="0" y1="28" x2="238" y2="28" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="19" font-size="12" font-weight="700" fill="#0f172a">관세 부과의 후생 효과 종합</text>

    <text x="12" y="47" font-size="11" font-weight="600" fill="#334155">• 소비자잉여: -(a + b + c + d)</text>
    <text x="12" y="68" font-size="11" font-weight="600" fill="#334155">• 생산자잉여: +a (국내공급 보호)</text>
    <text x="12" y="89" font-size="11" font-weight="700" fill="#1d4ed8">• 정부 관세수입: +c (수입량 × t)</text>

    <line x1="10" y1="101" x2="228" y2="101" stroke="#e2e8f0" stroke-width="1" />

    <text x="12" y="120" font-size="11" font-weight="700" fill="#0f172a">• 사회적 순손실(DWL): -(b + d)</text>
    <text x="20" y="137" font-size="10.5" fill="#475569">b: 생산왜곡 / d: 소비왜곡</text>
    <text x="12" y="153" font-size="10.5" font-weight="700" fill="#1d4ed8">→ 소국 관세는 항상 사회총후생 감소</text>
  </g>

  <!-- 4. Surplus Regions -->
  <!-- (a) Producer Surplus Gain: Trapezoid (100,280)-(350,280)-(250,360)-(100,360) -->
  <polygon points="100,280 350,280 250,360 100,360" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
  <text x="195" y="315" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">a</text>
  <text x="195" y="333" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">생산자잉여 증가 (+a)</text>

  <!-- (b) Production Distortion DWL: Triangle (250,360)-(350,280)-(350,360) -->
  <polygon points="250,360 350,280 350,360" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.2" />
  <rect x="302" y="317" width="44" height="38" rx="3" fill="#ffffff" fill-opacity="0.88" />
  <text x="324" y="330" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">b</text>
  <text x="324" y="343" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">생산왜곡</text>
  <text x="324" y="353" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">(DWL)</text>

  <!-- (c) Tariff Revenue: Rectangle (350,280)-(550,280)-(550,360)-(350,360) -->
  <rect x="350" y="280" width="200" height="80" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" />
  <text x="450" y="310" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">c</text>
  <text x="450" y="328" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">정부 관세수입 (+c)</text>
  <text x="450" y="344" font-size="10.5" fill="#334155" text-anchor="middle">수입량(Q₃ - Q₂) × 관세(t)</text>

  <!-- (d) Consumption Distortion DWL: Triangle (550,280)-(650,360)-(550,360) -->
  <polygon points="550,280 650,360 550,360" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.2" />
  <rect x="554" y="317" width="44" height="38" rx="3" fill="#ffffff" fill-opacity="0.88" />
  <text x="576" y="330" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">d</text>
  <text x="576" y="343" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">소비왜곡</text>
  <text x="576" y="353" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">(DWL)</text>

  <!-- 5. Axes: Origin at (100, 470) -->
  <line x1="100" y1="470" x2="775" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="470" x2="100" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />

  <text x="785" y="475" font-size="13" font-weight="700" fill="#1e293b">수량 (Q)</text>
  <text x="100" y="84" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">가격 (P)</text>
  <text x="86" y="484" font-size="11" fill="#64748b">0</text>

  <!-- 6. Domestic Supply & Demand Lines -->
  <!-- Domestic Supply (S) -->
  <line x1="150" y1="440" x2="520" y2="144" stroke="#1e293b" stroke-width="2.6" />
  <text x="528" y="142" font-size="12.5" font-weight="700" fill="#1e293b">국내 공급 (S)</text>

  <!-- Domestic Demand (D) -->
  <line x1="380" y1="144" x2="740" y2="432" stroke="#1d4ed8" stroke-width="2.6" />
  <text x="748" y="436" font-size="12.5" font-weight="700" fill="#1d4ed8">국내 수요 (D)</text>

  <!-- Autarky Equilibrium Point (450, 200) -->
  <circle cx="450" cy="200" r="4.5" fill="#ffffff" stroke="#475569" stroke-width="2" />
  <text x="450" y="186" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">폐쇄경제 균형 (E₀)</text>

  <!-- 7. Price Lines -->
  <!-- Tariff Price Pw + t (y=280) -->
  <line x1="100" y1="280" x2="695" y2="280" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="702" y="270" width="168" height="21" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="710" y="285" font-size="11" font-weight="700" fill="#1d4ed8">Pw + t (관세 부과 가격)</text>
  <text x="90" y="284" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="end">Pw + t</text>

  <!-- World Price Pw (y=360) -->
  <line x1="100" y1="360" x2="695" y2="360" stroke="#475569" stroke-width="2" />
  <rect x="702" y="350" width="182" height="21" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="710" y="365" font-size="11" font-weight="600" fill="#334155">Pw (국제가격: 완전탄력적)</text>
  <text x="90" y="364" font-size="11" font-weight="600" fill="#334155" text-anchor="end">Pw</text>

  <!-- Tariff measure bracket on the right -->
  <line x1="680" y1="285" x2="680" y2="355" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#arr-up-blue)" marker-end="url(#arr-down-blue)" />
  <text x="673" y="324" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="end">관세(t)</text>

  <!-- 8. Projections to X-axis -->
  <!-- Q1 (250) -->
  <line x1="250" y1="360" x2="250" y2="470" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="232" y="478" width="36" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="250" y="493" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Q₁</text>

  <!-- Q2 (350) -->
  <line x1="350" y1="280" x2="350" y2="470" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="331" y="478" width="38" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="350" y="493" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Q₂</text>

  <!-- Q3 (550) -->
  <line x1="550" y1="280" x2="550" y2="470" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="531" y="478" width="38" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="550" y="493" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Q₃</text>

  <!-- Q4 (650) -->
  <line x1="650" y1="360" x2="650" y2="470" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="632" y="478" width="36" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="650" y="493" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Q₄</text>

  <!-- 9. Import Volume Brackets -->
  <line x1="255" y1="400" x2="645" y2="400" stroke="#64748b" stroke-width="1.8" marker-start="url(#arr-left)" marker-end="url(#arr-right)" />
  <rect x="374" y="389" width="152" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="450" y="403" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">관세 전 수입량 (Q₁ → Q₄)</text>

  <line x1="355" y1="434" x2="545" y2="434" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)" />
  <rect x="364" y="423" width="172" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="450" y="437" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">관세 후 수입량 (Q₂ → Q₃, 감소)</text>
</svg>
