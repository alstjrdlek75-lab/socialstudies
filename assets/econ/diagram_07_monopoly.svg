<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">완전경쟁 vs 독점시장: 균형 비교와 자원배분의 비효율성 (DWL)</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 독점 균형(MR = MC): 완전경쟁 대비 생산량 감소(Qm &lt; Qc), 가격 상승(Pm &gt; Pc) ➔ 사중손실(DWL) 발생</text>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#475569">수량 (Q)</text>
  <text x="100" y="88" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">가격, 비용 (P, C)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- Demand D: y = 0.5*x + 100 -->
  <!-- at x=100: y=150; at x=660: y=430 -->
  <line x1="100" y1="150" x2="660" y2="430" stroke="#2563eb" stroke-width="3" />
  <text x="670" y="435" font-size="13" font-weight="bold" fill="#2563eb">D = AR (수요곡선)</text>

  <!-- Marginal Revenue MR (Twice slope): y = 1.0*x + 50 -->
  <!-- at x=100: y=150; at x=380: y=430 -->
  <line x1="100" y1="150" x2="380" y2="430" stroke="#dc2626" stroke-width="2.5" />
  <text x="390" y="435" font-size="12.5" font-weight="bold" fill="#dc2626">MR (한계수입: 기울기 2배)</text>

  <!-- Marginal Cost MC = AC (Constant Cost Case for clarity): horizontal at y=320 -->
  <line x1="100" y1="320" x2="720" y2="320" stroke="#16a34a" stroke-width="3" />
  <text x="730" y="325" font-size="12.5" font-weight="bold" fill="#16a34a">MC = AC = Pc (완전경쟁 가격)</text>

  <!-- Intersections: -->
  <!-- Competitive Eq Ec: P = MC => y=320, 0.5*x + 100 = 320 => x_c = 440 -->
  <!-- Monopoly Eq Em: MR = MC => y=320, 1.0*x + 50 = 320 => x_m = 270 -->
  <!-- Monopoly Price Pm: on D at x_m=270 => y = 0.5*(270) + 100 = 235 -->

  <!-- Monopoly Profit (Box between 100 to 270, y=235 to y=320) -->
  <rect x="100" y="235" width="170" height="85" fill="#fef3c7" fill-opacity="0.85" stroke="#d97706" stroke-dasharray="2,2" />
  <text x="185" y="282" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">독점 초과이윤</text>

  <!-- Deadweight Loss (DWL) Triangle: (270, 235) on D -> (440, 320) on D -> (270, 320) on MC -->
  <polygon points="270,235 440,320 270,320" fill="#fecaca" stroke="#dc2626" stroke-width="1.8" />
  <text x="310" y="295" font-size="12" font-weight="bold" fill="#b91c1c">DWL (후생손실)</text>

  <!-- Consumer Surplus under Monopoly: (100, 150) -> (270, 235) -> (100, 235) -->
  <polygon points="100,150 270,235 100,235" fill="#eff6ff" fill-opacity="0.8" stroke="#2563eb" stroke-dasharray="2,2" />
  <text x="150" y="210" font-size="10.5" font-weight="bold" fill="#1d4ed8">소비자잉여</text>

  <!-- Points and Projections -->
  <!-- Monopoly Quantity Qm = 270 -->
  <circle cx="270" cy="320" r="5" fill="#dc2626" />
  <circle cx="270" cy="235" r="5" fill="#dc2626" />
  <line x1="270" y1="235" x2="270" y2="460" stroke="#dc2626" stroke-dasharray="3,3" />
  <text x="270" y="478" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Qm (독점 생산량)</text>

  <!-- Competitive Quantity Qc = 440 -->
  <circle cx="440" cy="320" r="5" fill="#16a34a" />
  <line x1="440" y1="320" x2="440" y2="460" stroke="#16a34a" stroke-dasharray="3,3" />
  <text x="440" y="478" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Qc (완경 생산량)</text>

  <!-- Prices on Y-axis -->
  <line x1="100" y1="235" x2="270" y2="235" stroke="#dc2626" stroke-dasharray="2,2" />
  <text x="50" y="240" font-size="11.5" font-weight="bold" fill="#dc2626">Pm (독점가격)</text>
  <text x="50" y="325" font-size="11.5" font-weight="bold" fill="#16a34a">Pc (완경가격)</text>
</svg>