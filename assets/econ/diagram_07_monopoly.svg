<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">독점시장 균형과 사중손실 (Monopoly Equilibrium &amp; Deadweight Loss)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">생산량 (Q)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">가격, 비용 (P, C)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>
  <!-- DWL triangle -->
  <polygon points="320,180 470,255 320,320" fill="#fef08a" fill-opacity="0.75" stroke="#eab308" stroke-width="1.5" />
  <text x="360" y="255" font-size="13" font-weight="bold" fill="#a16207">사중손실 (DWL)</text>
  <!-- Demand -->
  <line x1="120" y1="80" x2="680" y2="360" stroke="#2563eb" stroke-width="3" />
  <text x="690" y="365" font-size="14" font-weight="bold" fill="#2563eb">수요곡선 D (AR)</text>
  <!-- MR -->
  <line x1="120" y1="80" x2="400" y2="360" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="410" y="370" font-size="14" font-weight="bold" fill="#7c3aed">한계수입 MR</text>
  <!-- MC -->
  <path d="M 140 370 Q 250 350 320 320 T 620 160" fill="none" stroke="#dc2626" stroke-width="3" />
  <text x="630" y="155" font-size="14" font-weight="bold" fill="#dc2626">한계비용 MC</text>
  <!-- Qm lines -->
  <line x1="320" y1="390" x2="320" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="180" x2="320" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="320" cy="320" r="5" fill="#dc2626" />
  <text x="210" y="325" font-size="12" font-weight="bold" fill="#dc2626">MR = MC (이윤극대화)</text>
  <circle cx="320" cy="180" r="5" fill="#2563eb" />
  <text x="40" y="185" font-size="13" font-weight="bold" fill="#1e40af">Pm (독점가격)</text>
  <text x="310" y="410" font-size="13" font-weight="bold" fill="#1e40af">Qm</text>
  <!-- Qc, Pc -->
  <circle cx="470" cy="255" r="5" fill="#059669" />
  <line x1="470" y1="390" x2="470" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="255" x2="470" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="40" y="260" font-size="13" font-weight="bold" fill="#059669">Pc (경쟁가격)</text>
  <text x="460" y="410" font-size="13" font-weight="bold" fill="#059669">Qc</text>
</svg>