<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- Geometry: Origin (120, 365); Demand y = 0.5*(x-120) + 75; MC = AC at y = 245 -->
  <!-- At Qm = 290: MR(290) = 245, Pm on D(290) = 160; At Qc = 460: D(460) = 245 -->

  <!-- Consumer Surplus under Monopoly: (120,75) -> (290,160) -> (120,160) -->
  <polygon points="120,75 290,160 120,160" fill="#dbeafe" fill-opacity="0.7" />
  <text x="176" y="138" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">소비자잉여</text>

  <!-- Monopoly Profit: x=120..290, y=160..245 -->
  <rect x="120" y="160" width="170" height="85" fill="#f1f5f9" />
  <text x="205" y="208" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">독점 초과이윤</text>

  <!-- Deadweight Loss (DWL): (290,160) -> (460,245) -> (290,245) -->
  <polygon points="290,160 460,245 290,245" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.8" />
  <text x="348" y="224" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

  <!-- Projections -->
  <line x1="120" y1="160" x2="290" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="290" y1="160" x2="290" y2="365" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="460" y1="245" x2="460" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Axes -->
  <line x1="120" y1="365" x2="605" y2="365" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="120" y1="365" x2="120" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="615" y="370" font-size="16" font-weight="800" fill="#0f172a">수량 Q</text>
  <text x="120" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">가격 · 비용</text>
  <text x="104" y="382" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Demand D = AR: (120, 75) to (580, 305) -->
  <line x1="120" y1="75" x2="580" y2="305" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="588" y="310" font-size="16" font-weight="800" fill="#1d4ed8">D = AR</text>

  <!-- Marginal Revenue MR: (120, 75) to (390, 345) -->
  <line x1="120" y1="75" x2="390" y2="345" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,5" />
  <text x="398" y="348" font-size="15.5" font-weight="800" fill="#475569">MR</text>

  <!-- MC = AC: Horizontal at y = 245 -->
  <line x1="120" y1="245" x2="575" y2="245" stroke="#0f172a" stroke-width="3" />
  <text x="583" y="250" font-size="15.5" font-weight="800" fill="#0f172a">MC = AC</text>

  <!-- Key Points -->
  <circle cx="290" cy="245" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <circle cx="290" cy="160" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="302" y="152" font-size="15.5" font-weight="800" fill="#1d4ed8" class="halo">독점 균형</text>

  <circle cx="460" cy="245" r="5.5" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <text x="468" y="232" font-size="15" font-weight="800" fill="#0f172a" class="halo">완전경쟁</text>

  <!-- Axis Labels -->
  <text x="108" y="165" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">Pm</text>
  <text x="108" y="250" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">Pc</text>
  <text x="290" y="392" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Qm</text>
  <text x="460" y="392" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Qc</text>
</svg>
