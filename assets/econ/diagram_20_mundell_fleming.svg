<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="1230" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="red-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
  </defs>

  <line x1="405" y1="20" x2="405" y2="400" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== LEFT PANEL: 환율제도별 외환시장 조정 ==================== -->
  <text x="205" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">환율제도별 자본유입(S₀ → S₁) 반응</text>

  <line x1="74" y1="355" x2="355" y2="355" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="74" y1="355" x2="74" y2="62" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <text x="362" y="360" font-size="14.5" font-weight="800" fill="#0f172a">외환 Q</text>
  <text x="74" y="52" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">환율 e</text>

  <!-- Fixed Rate Line e0 (y = 195) & Appreciated Floating Rate e1 (y = 255) -->
  <line x1="74" y1="195" x2="345" y2="195" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,4" />
  <line x1="74" y1="255" x2="255" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="62" y="200" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="end">e₀</text>
  <text x="62" y="260" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="end">e₁</text>

  <!-- Demand D: y = (x - 195) + 195 = x -> (110, 110) to (325, 325); A=(195,195), C=(255,255) -->
  <line x1="110" y1="110" x2="325" y2="325" stroke="#0f172a" stroke-width="2.8" />
  <text x="332" y="330" font-size="14.5" font-weight="800" fill="#0f172a">D</text>

  <!-- Supply S0: y = -(x - 195) + 195 = 390 - x -> (105, 285) to (280, 110) -->
  <line x1="105" y1="285" x2="280" y2="110" stroke="#64748b" stroke-width="2.3" stroke-dasharray="6,4" />
  <text x="286" y="108" font-size="14.5" font-weight="700" fill="#475569">S₀</text>

  <!-- Supply S1 (Capital Inflow, shifted right by 120): y = 510 - x -> (200, 310) to (360, 150); B=(315, 195), C=(255, 255) -->
  <line x1="200" y1="310" x2="360" y2="150" stroke="#1d4ed8" stroke-width="3" />
  <text x="366" y="148" font-size="14.5" font-weight="800" fill="#1d4ed8">S₁</text>

  <!-- Excess Supply AB under Fixed Rate (at y=195, x=195..315) -->
  <line x1="203" y1="181" x2="307" y2="181" stroke="#b91c1c" stroke-width="2.2" marker-start="url(#red-arr)" marker-end="url(#red-arr)" />
  <text x="255" y="166" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">고정환율: 외환 매입 (통화↑)</text>

  <!-- Points A, B, C -->
  <circle cx="195" cy="195" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
  <text x="183" y="188" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="end" class="halo">A</text>

  <circle cx="315" cy="195" r="5" fill="#b91c1c" stroke="#ffffff" stroke-width="1.8" />
  <text x="326" y="213" font-size="14.5" font-weight="800" fill="#b91c1c" class="halo">B</text>

  <circle cx="255" cy="255" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="255" y="284" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">C (변동환율: e 하락)</text>

  <!-- ==================== RIGHT PANEL: 삼원불가능성 (트릴레마) ==================== -->
  <text x="615" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">삼원불가능성 (트릴레마)</text>

  <!-- Triangle: Top (615, 118), Bottom-Left (485, 326), Bottom-Right (745, 326) -->
  <polygon points="615,118 485,326 745,326" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="615" y1="118" x2="485" y2="326" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" />
  <line x1="615" y1="118" x2="745" y2="326" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Center Rule -->
  <text x="615" y="258" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle">3가지 동시 달성 불가</text>
  <text x="615" y="279" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">(2가지만 선택 가능)</text>

  <!-- Left Edge Label: 변동환율제 -->
  <text x="530" y="205" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">변동환율제</text>
  <text x="530" y="224" font-size="13" font-weight="700" fill="#334155" text-anchor="end" class="halo">통화정책 유효</text>

  <!-- Right Edge Label: 고정환율제 -->
  <text x="700" y="205" font-size="14.5" font-weight="800" fill="#0f172a" class="halo">고정환율제</text>
  <text x="700" y="224" font-size="13" font-weight="700" fill="#334155" class="halo">재정정책 유효</text>

  <!-- Vertex 1: Top -->
  <rect x="525" y="68" width="180" height="44" rx="10" fill="#0f172a" />
  <text x="615" y="96" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">자유로운 자본 이동</text>

  <!-- Vertex 2: Bottom-Left -->
  <rect x="425" y="334" width="166" height="44" rx="10" fill="#1d4ed8" />
  <text x="508" y="362" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">독립적 통화정책</text>

  <!-- Vertex 3: Bottom-Right -->
  <rect x="639" y="334" width="166" height="44" rx="10" fill="#334155" />
  <text x="722" y="362" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">환율 안정 (고정)</text>
</svg>
