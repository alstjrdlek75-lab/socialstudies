<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">먼델-플레밍 모형 (IS-LM-BP 개방거시모형)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">국민소득 (Y)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">이자율 (r)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- Horizontal BP curve (perfect capital mobility) -->
  <line x1="100" y1="230" x2="680" y2="230" stroke="#dc2626" stroke-width="3" />
  <text x="690" y="235" font-size="14" font-weight="bold" fill="#dc2626">BP 곡선 (r = rf, 완전자본이동)</text>
  <text x="50" y="235" font-size="13" font-weight="bold" fill="#dc2626">rf (국제금리)</text>
  <!-- IS curve -->
  <line x1="160" y1="120" x2="620" y2="340" stroke="#2563eb" stroke-width="3" />
  <text x="630" y="345" font-size="14" font-weight="bold" fill="#2563eb">IS 곡선</text>
  <!-- LM curve -->
  <line x1="160" y1="340" x2="620" y2="120" stroke="#059669" stroke-width="3" />
  <text x="630" y="125" font-size="14" font-weight="bold" fill="#059669">LM 곡선</text>
  <!-- Policy summary table -->
  <rect x="140" y="280" width="220" height="95" rx="6" fill="#f8fafc" stroke="#94a3b8" />
  <text x="150" y="305" font-size="12" font-weight="bold" fill="#1e40af">변동환율제도:</text>
  <text x="150" y="325" font-size="12" fill="#334155">• 재정정책: 완전 무력 (순수출 구축)</text>
  <text x="150" y="345" font-size="12" font-weight="bold" fill="#059669">• 통화정책: 매우 강력 (환율상승)</text>
  <rect x="420" y="280" width="220" height="95" rx="6" fill="#f8fafc" stroke="#94a3b8" />
  <text x="430" y="305" font-size="12" font-weight="bold" fill="#dc2626">고정환율제도:</text>
  <text x="430" y="325" font-size="12" font-weight="bold" fill="#059669">• 재정정책: 매우 강력 (통화량 동조)</text>
  <text x="430" y="345" font-size="12" fill="#334155">• 통화정책: 완전 무력 (환율방어)</text>
</svg>