<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="1260" height="870" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Clean Crosshair Grid Dividers -->
  <line x1="420" y1="18" x2="420" y2="562" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="18" y1="290" x2="822" y2="290" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== [1] 양 시장 완전경쟁 ==================== -->
  <g transform="translate(0, 0)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">① 생산물 완전경쟁 × 요소 완전경쟁</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">L</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">w</text>

    <!-- DL = VMPL = MRPL: (90, 78) to (310, 198); Ec at (200, 138) -->
    <line x1="90" y1="78" x2="310" y2="198" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="316" y="203" font-size="13" font-weight="800" fill="#1d4ed8">VMPL = MRPL</text>

    <!-- SL = w: y = 138 -->
    <line x1="66" y1="138" x2="315" y2="138" stroke="#0f172a" stroke-width="2.6" />
    <text x="321" y="143" font-size="13" font-weight="800" fill="#0f172a">SL = MFCL</text>

    <line x1="200" y1="138" x2="200" y2="242" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <circle cx="200" cy="138" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <text x="210" y="126" font-size="14" font-weight="800" fill="#0f172a" class="halo">Ec (착취 없음)</text>
    <text x="200" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Lc</text>
    <text x="56" y="143" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="end">wc</text>
  </g>

  <!-- ==================== [2] 생산물 독점 × 요소 완전경쟁 ==================== -->
  <g transform="translate(420, 0)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">② 생산물 독점 × 요소 완전경쟁</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">L</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">w</text>

    <!-- VMPL: (90, 78) to (310, 198); at Lm=155, y = 78 + (65/220)*120 = 113.5; at Lc=200, y=138 -->
    <line x1="90" y1="78" x2="310" y2="198" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="316" y="203" font-size="13" font-weight="700" fill="#475569">VMPL</text>

    <!-- MRPL: (85, 76) to (255, 224); at Lm=155, y = 138 -->
    <line x1="85" y1="76" x2="255" y2="224" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="262" y="228" font-size="13" font-weight="800" fill="#1d4ed8">MRPL</text>

    <!-- SL = w at y = 138 -->
    <line x1="66" y1="138" x2="315" y2="138" stroke="#0f172a" stroke-width="2.6" />
    <text x="321" y="143" font-size="13" font-weight="800" fill="#0f172a">SL = w</text>

    <!-- Projections -->
    <line x1="200" y1="138" x2="200" y2="242" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="200" y="264" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Lc</text>

    <line x1="155" y1="113.5" x2="155" y2="242" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <!-- Exploitation Segment -->
    <line x1="155" y1="113.5" x2="155" y2="138" stroke="#b91c1c" stroke-width="4.5" />
    <circle cx="155" cy="113.5" r="4.5" fill="#ffffff" stroke="#b91c1c" stroke-width="2.2" />
    <circle cx="155" cy="138" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

    <text x="168" y="114" font-size="13.5" font-weight="800" fill="#b91c1c" class="halo">독점적 착취</text>
    <text x="155" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Lm</text>
    <text x="56" y="143" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="end">w</text>
  </g>

  <!-- ==================== [3] 생산물 완전경쟁 × 요소 수요독점 ==================== -->
  <g transform="translate(0, 290)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">③ 생산물 완전경쟁 × 요소 수요독점</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">L</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">w</text>

    <!-- VMPL = MRPL: y = 0.5*x + 35 -> (90, 80) to (310, 190); at Ls=166, y=118 -->
    <line x1="90" y1="80" x2="310" y2="190" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="316" y="195" font-size="13" font-weight="800" fill="#1d4ed8">VMPL</text>

    <!-- SL = AFCL: y = -0.35*x + 218 -> (90, 186.5) to (310, 109.5); at Ls=166, ws=160 -->
    <line x1="90" y1="186.5" x2="310" y2="109.5" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="114" font-size="13" font-weight="800" fill="#0f172a">SL</text>

    <!-- MFCL: y = -0.7*x + 234.2 -> (90, 171.2) to (250, 59.2); at Ls=166, y=118 -->
    <line x1="90" y1="171.2" x2="250" y2="59.2" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6,4" />
    <text x="256" y="64" font-size="13" font-weight="800" fill="#475569">MFCL</text>

    <!-- Projections & Exploitation Bar -->
    <line x1="166" y1="118" x2="166" y2="242" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <line x1="66" y1="160" x2="166" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <line x1="166" y1="118" x2="166" y2="160" stroke="#b91c1c" stroke-width="4.5" />
    <circle cx="166" cy="118" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="166" cy="160" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

    <text x="180" y="144" font-size="13.5" font-weight="800" fill="#b91c1c" class="halo">수요독점 착취</text>
    <text x="166" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Ls</text>
    <text x="56" y="165" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="end">ws</text>
  </g>

  <!-- ==================== [4] 생산물 독점 × 요소 수요독점 ==================== -->
  <g transform="translate(420, 290)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">④ 생산물 독점 × 요소 수요독점</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">L</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">w</text>

    <!-- VMPL: y = 0.5*x + 35 -> at Lmm=150, y = 110 -->
    <line x1="90" y1="80" x2="310" y2="190" stroke="#64748b" stroke-width="2.1" stroke-dasharray="5,4" />
    <text x="316" y="195" font-size="13" font-weight="700" fill="#475569">VMPL</text>

    <!-- MRPL: y = 0.8*x + 9.2 -> (85, 77.2) to (255, 213.2); at Lmm=150, y = 129.2 -->
    <line x1="85" y1="77.2" x2="255" y2="213.2" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="262" y="218" font-size="13" font-weight="800" fill="#1d4ed8">MRPL</text>

    <!-- SL: y = -0.35*x + 218 -> at Lmm=150, wmm = 165.5 -->
    <line x1="90" y1="186.5" x2="310" y2="109.5" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="114" font-size="13" font-weight="800" fill="#0f172a">SL</text>

    <!-- MFCL: y = -0.7*x + 234.2 -> at Lmm=150, y = 129.2 -->
    <line x1="90" y1="171.2" x2="250" y2="59.2" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6,4" />
    <text x="256" y="64" font-size="13" font-weight="800" fill="#475569">MFCL</text>

    <!-- Projections & Dual Exploitation Bar -->
    <line x1="150" y1="110" x2="150" y2="242" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <line x1="66" y1="165.5" x2="150" y2="165.5" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />

    <line x1="150" y1="110" x2="150" y2="165.5" stroke="#b91c1c" stroke-width="4.5" />
    <circle cx="150" cy="110" r="4" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle cx="150" cy="129.2" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="150" cy="165.5" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

    <text x="165" y="142" font-size="13.5" font-weight="800" fill="#b91c1c" class="halo">이중 착취 (최저 고용)</text>
    <text x="150" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Lmm</text>
    <text x="56" y="170" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="end">wmm</text>
  </g>
</svg>
