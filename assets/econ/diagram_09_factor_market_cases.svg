<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <!-- Title Header -->
  <rect x="0" y="0" width="980" height="60" fill="#f8fafc" border-bottom="1px solid #e2e8f0" />
  <text x="490" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">생산요소시장 균형 4대 케이스 종합 비교 (생산물시장 × 생산요소시장 구조)</text>
  <line x1="0" y1="60" x2="980" y2="60" stroke="#cbd5e1" stroke-width="1.5" />

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ==================== QUADRANT 1: [Case 1] 완경 x 완경 ==================== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#eff6ff" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#eff6ff" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#1d4ed8">[Case 1] 생산물 완전경쟁 × 요소 완전경쟁 (양 시장 완전경쟁)</text>

    <!-- Axes -->
    <line x1="60" y1="250" x2="400" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="60" y1="250" x2="60" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="405" y="254" font-size="12" font-weight="bold" fill="#475569">노동량(L)</text>
    <text x="55" y="52" font-size="12" font-weight="bold" fill="#475569">임금(w)</text>
    <text x="48" y="264" font-size="11" fill="#94a3b8">0</text>

    <!-- Demand Curve: VMPL = MRPL -->
    <line x1="80" y1="90" x2="350" y2="230" stroke="#dc2626" stroke-width="2.5" />
    <text x="280" y="225" font-size="12" font-weight="bold" fill="#dc2626">DL = VMPL = MRPL</text>

    <!-- Supply Curve: w = AFCL = MFCL (Horizontal) -->
    <line x1="60" y1="160" x2="380" y2="160" stroke="#2563eb" stroke-width="2.5" />
    <text x="270" y="150" font-size="12" font-weight="bold" fill="#2563eb">SL = AFCL = MFCL = w_c</text>

    <!-- Equilibrium Point Ec -->
    <circle cx="200" cy="160" r="5" fill="#1d4ed8" />
    <line x1="200" y1="160" x2="200" y2="250" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="194" y="266" font-size="12" font-weight="bold" fill="#1e293b">Lc</text>
    <text x="35" y="164" font-size="12" font-weight="bold" fill="#1e293b">wc</text>
    <text x="208" y="152" font-size="12" font-weight="bold" fill="#1d4ed8">Ec (균형)</text>

    <!-- Badges / Summary -->
    <rect x="75" y="68" width="345" height="20" rx="4" fill="#dbeafe" />
    <text x="247" y="82" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">• 이윤극대화: VMPL = MRPL = w | 착취 없음, 자원배분 효율적</text>
  </g>

  <!-- ==================== QUADRANT 2: [Case 2] 독점 x 완경 ==================== -->
  <g transform="translate(505, 80)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#fef3c7" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#fef3c7" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#b45309">[Case 2] 생산물 독점 × 요소 완전경쟁 (생산물시장 독점)</text>

    <!-- Axes -->
    <line x1="60" y1="250" x2="400" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="60" y1="250" x2="60" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="405" y="254" font-size="12" font-weight="bold" fill="#475569">노동량(L)</text>
    <text x="55" y="52" font-size="12" font-weight="bold" fill="#475569">임금(w)</text>
    <text x="48" y="264" font-size="11" fill="#94a3b8">0</text>

    <!-- Curves -->
    <!-- VMPL (Upper) -->
    <line x1="80" y1="85" x2="350" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" />
    <text x="320" y="205" font-size="11" font-weight="bold" fill="#64748b">VMPL (P × MPL)</text>

    <!-- MRPL (Lower, Demand) -->
    <line x1="80" y1="85" x2="280" y2="235" stroke="#dc2626" stroke-width="2.5" />
    <text x="250" y="245" font-size="12" font-weight="bold" fill="#dc2626">DL = MRPL (MR × MPL)</text>

    <!-- Supply: w = AFCL = MFCL -->
    <line x1="60" y1="160" x2="380" y2="160" stroke="#2563eb" stroke-width="2.5" />
    <text x="290" y="150" font-size="12" font-weight="bold" fill="#2563eb">SL = AFCL = MFCL = w</text>

    <!-- Exploitation Bracket / Shading at Lm -->
    <!-- Intersection MRPL = w at Lm (x=180, y=160) -->
    <!-- VMPL at x=180: y = 85 + (220-85)*(100/270) = 85 + 50 = 135 -->
    <line x1="180" y1="160" x2="180" y2="250" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <line x1="180" y1="135" x2="180" y2="160" stroke="#f59e0b" stroke-width="4" />
    <circle cx="180" cy="160" r="5" fill="#dc2626" />
    <circle cx="180" cy="135" r="4" fill="#f59e0b" />
    <line x1="60" y1="135" x2="180" y2="135" stroke="#f59e0b" stroke-dasharray="2,2" stroke-width="1" />
    <text x="18" y="139" font-size="10" font-weight="bold" fill="#b45309">VMPL</text>
    <text x="174" y="266" font-size="12" font-weight="bold" fill="#1e293b">Lm</text>
    <text x="40" y="164" font-size="12" font-weight="bold" fill="#1e293b">w</text>

    <!-- Exploitation Label -->
    <rect x="190" y="120" width="135" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="195" y="134" font-size="10" font-weight="bold" fill="#92400e">⚡ 독점적 착취 발생</text>
    <text x="195" y="146" font-size="9.5" fill="#b45309">크기: VMPL - w (&gt; 0)</text>

    <!-- Lc comparison -->
    <circle cx="230" cy="160" r="4" fill="#94a3b8" />
    <line x1="230" y1="160" x2="230" y2="250" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="225" y="266" font-size="11" fill="#64748b">Lc</text>

    <!-- Badges / Summary -->
    <rect x="75" y="68" width="345" height="20" rx="4" fill="#fef9c3" />
    <text x="247" y="82" font-size="11" font-weight="bold" text-anchor="middle" fill="#854d0e">• 이윤극대화: MRPL = w | 고용량 감소(Lm &lt; Lc), 독점적 착취</text>
  </g>

  <!-- ==================== QUADRANT 3: [Case 3] 완경 x 수요독점 ==================== -->
  <g transform="translate(30, 395)">
    <rect x="0" y="0" width="445" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#ede9fe" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#ede9fe" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#6d28d9">[Case 3] 생산물 완전경쟁 × 요소 수요독점 (요소시장 수요독점)</text>

    <!-- Axes -->
    <line x1="60" y1="255" x2="400" y2="255" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="60" y1="255" x2="60" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="405" y="259" font-size="12" font-weight="bold" fill="#475569">노동량(L)</text>
    <text x="55" y="52" font-size="12" font-weight="bold" fill="#475569">임금(w)</text>
    <text x="48" y="269" font-size="11" fill="#94a3b8">0</text>

    <!-- Demand: VMPL = MRPL -->
    <line x1="80" y1="90" x2="360" y2="235" stroke="#dc2626" stroke-width="2.5" />
    <text x="320" y="242" font-size="12" font-weight="bold" fill="#dc2626">VMPL = MRPL</text>

    <!-- Supply: SL = AFCL (Upward sloping) -->
    <line x1="80" y1="230" x2="360" y2="130" stroke="#2563eb" stroke-width="2.5" />
    <text x="330" y="125" font-size="12" font-weight="bold" fill="#2563eb">SL = AFCL = w(L)</text>

    <!-- MFCL (Steeper, slope x2) -->
    <line x1="80" y1="230" x2="240" y2="80" stroke="#7c3aed" stroke-width="2.5" />
    <text x="210" y="76" font-size="12" font-weight="bold" fill="#7c3aed">MFCL (한계요소비용)</text>

    <!-- Intersection MFCL = VMPL at Ls (approx x=175, y=140) -->
    <circle cx="175" cy="140" r="5" fill="#7c3aed" />
    <line x1="175" y1="140" x2="175" y2="255" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="170" y="270" font-size="12" font-weight="bold" fill="#1e293b">Ls</text>

    <!-- Wage ws on AFCL curve at x=175: y = 230 - (100)*(95/280) = 196 -->
    <circle cx="175" cy="196" r="5" fill="#2563eb" />
    <line x1="60" y1="196" x2="175" y2="196" stroke="#2563eb" stroke-dasharray="2,2" />
    <text x="38" y="200" font-size="12" font-weight="bold" fill="#2563eb">ws</text>

    <!-- Exploitation bar between VMPL(140) and ws(196) -->
    <line x1="175" y1="140" x2="175" y2="196" stroke="#9333ea" stroke-width="4" />

    <!-- Exploitation Callout -->
    <rect x="185" y="150" width="145" height="32" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" />
    <text x="190" y="164" font-size="10" font-weight="bold" fill="#6b21a8">⚡ 수요독점적 착취</text>
    <text x="190" y="176" font-size="9.5" fill="#7e22ce">크기: VMPL - ws (&gt; 0)</text>

    <!-- Competitive reference Lc, wc -->
    <circle cx="235" cy="174" r="4" fill="#94a3b8" />
    <line x1="235" y1="174" x2="235" y2="255" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <line x1="60" y1="174" x2="235" y2="174" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="230" y="270" font-size="11" fill="#64748b">Lc</text>
    <text x="38" y="178" font-size="11" fill="#64748b">wc</text>

    <!-- Badges / Summary -->
    <rect x="75" y="68" width="345" height="20" rx="4" fill="#fae8ff" />
    <text x="247" y="82" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#581c87">• MFCL = VMPL에서 Ls 결정 ➔ 임금은 SL 높이(ws) | 최저임금 시 L, w 동시증가</text>
  </g>

  <!-- ==================== QUADRANT 4: [Case 4] 독점 x 수요독점 ==================== -->
  <g transform="translate(505, 395)">
    <rect x="0" y="0" width="445" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#fee2e2" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#fee2e2" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#b91c1c">[Case 4] 생산물 독점 × 요소 수요독점 (양 시장 독점/불완전경쟁)</text>

    <!-- Axes -->
    <line x1="60" y1="255" x2="400" y2="255" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="60" y1="255" x2="60" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="405" y="259" font-size="12" font-weight="bold" fill="#475569">노동량(L)</text>
    <text x="55" y="52" font-size="12" font-weight="bold" fill="#475569">임금(w)</text>
    <text x="48" y="269" font-size="11" fill="#94a3b8">0</text>

    <!-- Curves -->
    <!-- VMPL (Highest) -->
    <line x1="80" y1="90" x2="360" y2="225" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" />
    <text x="330" y="215" font-size="11" font-weight="bold" fill="#64748b">VMPL</text>

    <!-- MRPL (Lower Demand) -->
    <line x1="80" y1="90" x2="280" y2="245" stroke="#dc2626" stroke-width="2.5" />
    <text x="260" y="250" font-size="12" font-weight="bold" fill="#dc2626">MRPL</text>

    <!-- Supply: SL = AFCL -->
    <line x1="80" y1="235" x2="360" y2="140" stroke="#2563eb" stroke-width="2.5" />
    <text x="340" y="135" font-size="12" font-weight="bold" fill="#2563eb">SL = AFCL</text>

    <!-- MFCL (Steepest) -->
    <line x1="80" y1="235" x2="250" y2="80" stroke="#7c3aed" stroke-width="2.5" />
    <text x="220" y="78" font-size="12" font-weight="bold" fill="#7c3aed">MFCL</text>

    <!-- Equilibrium Intersection: MFCL = MRPL at Lmm (approx x=155, y=167) -->
    <circle cx="155" cy="167" r="5" fill="#dc2626" />
    <line x1="155" y1="167" x2="155" y2="255" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="142" y="270" font-size="12" font-weight="bold" fill="#dc2626">Lmm(최소)</text>

    <!-- VMPL at x=155: y approx 126 -->
    <circle cx="155" cy="126" r="4" fill="#f59e0b" />
    <!-- wmm on SL curve at x=155: y approx 210 -->
    <circle cx="155" cy="210" r="5" fill="#2563eb" />
    <line x1="60" y1="210" x2="155" y2="210" stroke="#2563eb" stroke-dasharray="2,2" />
    <text x="22" y="214" font-size="11" font-weight="bold" fill="#2563eb">wmm(최저)</text>

    <!-- Dual Exploitation Brackets -->
    <line x1="155" y1="126" x2="155" y2="167" stroke="#f59e0b" stroke-width="4" />
    <line x1="155" y1="167" x2="155" y2="210" stroke="#9333ea" stroke-width="4" />

    <!-- Dual Exploitation Callout -->
    <rect x="165" y="135" width="155" height="52" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
    <text x="170" y="150" font-size="10" font-weight="bold" fill="#991b1b">⚡ 이중 착취 (Dual Exploitation)</text>
    <text x="170" y="164" font-size="9" fill="#b45309">• 독점적 착취: VMPL - MRPL</text>
    <text x="170" y="176" font-size="9" fill="#6b21a8">• 수요독점 착취: MRPL - wmm</text>

    <!-- Badges / Summary -->
    <rect x="75" y="68" width="345" height="20" rx="4" fill="#ffe4e6" />
    <text x="247" y="82" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#9f1239">• MFCL = MRPL ➔ SL에서 wmm 결정 | 고용량·임금 모두 최저 수준</text>
  </g>
</svg>