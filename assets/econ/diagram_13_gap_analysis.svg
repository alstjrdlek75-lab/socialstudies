<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="1200" height="615" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
  </defs>

  <line x1="400" y1="20" x2="400" y2="392" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== LEFT PANEL: 디플레이션 갭 (경기침체) ==================== -->
  <g transform="translate(0, 0)">
    <text x="200" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">디플레이션 갭 (경기침체: Y₁ &lt; Yf)</text>

    <!-- Axes: Origin (64, 325) -->
    <line x1="64" y1="325" x2="355" y2="325" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
    <line x1="64" y1="325" x2="64" y2="62" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
    <text x="363" y="330" font-size="14.5" font-weight="800" fill="#0f172a">Y</text>
    <text x="64" y="52" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">AE</text>

    <!-- 45-deg line: (64, 325) to (324, 65) [slope -1] -->
    <line x1="64" y1="325" x2="324" y2="65" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="330" y="68" font-size="13.5" font-weight="700" fill="#475569">45°</text>

    <!-- AE1 (Recession): y = 265 - 0.5*(x-64) -> meets 45-deg [325 - (x-64)] at 0.5*(x-64)=60 -> x-64=120 -> E1=(184, 205) -->
    <!-- At Yf = 264 (x-64=200): 45-deg y = 125, AE1 y = 165 -> Vertical Deflationary Gap = 40px! -->
    <line x1="64" y1="265" x2="334" y2="130" stroke="#1d4ed8" stroke-width="3" />
    <text x="340" y="134" font-size="14.5" font-weight="800" fill="#1d4ed8">AE</text>

    <!-- Projections -->
    <line x1="184" y1="205" x2="184" y2="325" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
    <line x1="264" y1="125" x2="264" y2="325" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Vertical Deflationary Gap at Yf = 264 (y=125..165) -->
    <line x1="264" y1="125" x2="264" y2="165" stroke="#1d4ed8" stroke-width="4.5" />
    <circle cx="264" cy="125" r="4.5" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <circle cx="264" cy="165" r="4.5" fill="#1d4ed8" />
    <text x="252" y="149" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">디플레이션 갭</text>

    <circle cx="184" cy="205" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <text x="174" y="196" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="end" class="halo">E₁</text>

    <text x="184" y="348" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Y₁</text>
    <text x="264" y="348" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">Yf</text>

    <!-- Horizontal GDP Gap -->
    <line x1="189" y1="368" x2="259" y2="368" stroke="#1d4ed8" stroke-width="2.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)" />
    <text x="224" y="392" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">GDP 갭 (= 디플레 갭 × 승수)</text>
  </g>

  <!-- ==================== RIGHT PANEL: 인플레이션 갭 (경기과열) ==================== -->
  <g transform="translate(400, 0)">
    <text x="200" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">인플레이션 갭 (경기과열: Y₂ &gt; Yf)</text>

    <!-- Axes: Origin (64, 325) -->
    <line x1="64" y1="325" x2="355" y2="325" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
    <line x1="64" y1="325" x2="64" y2="62" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
    <text x="363" y="330" font-size="14.5" font-weight="800" fill="#0f172a">Y</text>
    <text x="64" y="52" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">AE</text>

    <!-- 45-deg line: (64, 325) to (324, 65) -->
    <line x1="64" y1="325" x2="324" y2="65" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="318" y="58" font-size="13.5" font-weight="700" fill="#475569" text-anchor="end">45°</text>

    <!-- AE2 (Overheating): y = 215 - 0.5*(x-64) -> meets 45-deg at 0.5*(x-64)=110 -> x-64=220 -> E2=(284, 105) -->
    <!-- At Yf = 204 (x-64=140): 45-deg y = 185, AE2 y = 145 -> Vertical Inflationary Gap = 40px! -->
    <line x1="64" y1="215" x2="334" y2="80" stroke="#b91c1c" stroke-width="3" />
    <text x="342" y="85" font-size="14.5" font-weight="800" fill="#b91c1c">AE</text>

    <!-- Projections -->
    <line x1="204" y1="145" x2="204" y2="325" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="284" y1="105" x2="284" y2="325" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />

    <!-- Vertical Inflationary Gap at Yf = 204 (y=145..185) -->
    <line x1="204" y1="145" x2="204" y2="185" stroke="#b91c1c" stroke-width="4.5" />
    <circle cx="204" cy="145" r="4.5" fill="#b91c1c" />
    <circle cx="204" cy="185" r="4.5" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <text x="192" y="170" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="end" class="halo">인플레이션 갭</text>

    <circle cx="284" cy="105" r="5.5" fill="#b91c1c" stroke="#ffffff" stroke-width="2" />
    <text x="295" y="122" font-size="14.5" font-weight="800" fill="#0f172a" class="halo">E₂</text>

    <text x="204" y="348" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">Yf</text>
    <text x="284" y="348" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Y₂</text>

    <!-- Horizontal Overheating Gap -->
    <line x1="209" y1="368" x2="279" y2="368" stroke="#b91c1c" stroke-width="2.2" marker-start="url(#arr-red)" marker-end="url(#arr-red)" />
    <text x="244" y="392" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">초과 산출 (= 인플레 갭 × 승수)</text>
  </g>
</svg>
