<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#334155" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1020" height="48" fill="#f8fafc" />
  <text x="510" y="31" font-size="17.5" font-weight="800" text-anchor="middle" fill="#0f172a">소득-지출 분석(45°선 모형)과 인플레이션 갭 · 디플레이션 갭 · GDP 갭</text>
  <line x1="0" y1="48" x2="1020" y2="48" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Subtitle Strip -->
  <rect x="120" y="56" width="780" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="510" y="73" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">
    균형 조건: Y = AE  ┃  완전고용(Yₑ) 기준 수직 거리 = 인플레이션·디플레이션 갭  ┃  수평 거리 = GDP 갭 [GDP 갭 = 디플레이션 갭 × 승수]
  </text>

  <!-- Subtle Grid Lines -->
  <line x1="115" y1="304" x2="835" y2="304" stroke="#f1f5f9" stroke-width="1" />
  <line x1="115" y1="219" x2="835" y2="219" stroke="#f1f5f9" stroke-width="1" />

  <!-- Axes: Origin (115, 430) -->
  <line x1="115" y1="430" x2="865" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="875" y="435" font-size="13" font-weight="700" fill="#0f172a">국민소득, 총생산 (Y)</text>
  <text x="98" y="445" font-size="12" font-weight="600" fill="#64748b">0</text>

  <line x1="115" y1="430" x2="115" y2="104" stroke="#334155" stroke-width="2" marker-end="url(#arr-slate)" />
  <text x="115" y="93" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">총수요, 총지출 (YD, AE)</text>

  <!-- 45-DEGREE REFERENCE RAY -->
  <line x1="115" y1="430" x2="795" y2="124" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(675, 96)">
    <rect x="0" y="0" width="146" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="73" y="16" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">45°선 (YD = Y, AE = Y)</text>
  </g>

  <!-- 3 AGGREGATE DEMAND LINES -->
  <!-- 1. Y2^D (상단: 과열) -->
  <line x1="115" y1="282" x2="825" y2="122" stroke="#1e293b" stroke-width="2.4" />
  <g transform="translate(834, 108)">
    <rect x="0" y="0" width="138" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="69" y="16" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Y₂ᴰ = a₂ + bY (과열)</text>
  </g>

  <!-- 2. Y0^D (중앙: 완전고용 적정) -->
  <line x1="115" y1="325" x2="825" y2="165" stroke="#1d4ed8" stroke-width="2.8" />
  <g transform="translate(834, 152)">
    <rect x="0" y="0" width="138" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="69" y="16" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Y₀ᴰ = a₀ + bY (적정)</text>
  </g>

  <!-- 3. Y1^D (하단: 경기침체) -->
  <line x1="115" y1="367" x2="825" y2="207" stroke="#64748b" stroke-width="2.3" stroke-dasharray="6,4" />
  <g transform="translate(834, 196)">
    <rect x="0" y="0" width="138" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="69" y="16" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Y₁ᴰ = a₁ + bY (침체)</text>
  </g>

  <!-- Y-Axis Intercept Labels -->
  <text x="103" y="286" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">a₂</text>
  <text x="103" y="329" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="end">a₀</text>
  <text x="103" y="371" font-size="12" font-weight="700" fill="#475569" text-anchor="end">a₁</text>

  <!-- EQUILIBRIUM POINTS -->
  <!-- E1: (395, 304) -->
  <line x1="395" y1="304" x2="395" y2="430" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.3" />
  <circle cx="395" cy="304" r="5" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="383" y="295" font-size="12" font-weight="800" fill="#334155" text-anchor="end">E₁</text>

  <!-- E0: (585, 219) -->
  <line x1="585" y1="140" x2="585" y2="430" stroke="#64748b" stroke-dasharray="4,3" stroke-width="1.4" />
  <circle cx="585" cy="219" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="573" y="214" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="end">E₀</text>

  <!-- E2: (775, 133) -->
  <circle cx="775" cy="133" r="4.5" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />

  <!-- X-Axis Point Badges -->
  <g transform="translate(332, 438)">
    <rect x="0" y="0" width="126" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="63" y="15" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Y₁ (실제 균형소득)</text>
  </g>

  <g transform="translate(518, 438)">
    <rect x="0" y="0" width="134" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="67" y="15" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Yₑ (완전고용소득)</text>
  </g>

  <!-- GAPS VISUALIZATION -->
  <!-- 1. 인플레이션 갭 (x=585, y=176..219) -->
  <line x1="585" y1="176" x2="585" y2="219" stroke="#0f172a" stroke-width="3.2" />
  <line x1="578" y1="176" x2="592" y2="176" stroke="#0f172a" stroke-width="1.8" />
  <line x1="578" y1="219" x2="592" y2="219" stroke="#0f172a" stroke-width="1.8" />
  <g transform="translate(602, 168)">
    <rect x="0" y="0" width="212" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="10" y="16" font-size="12" font-weight="800" fill="#0f172a">▲ 인플레이션 갭 (초과수요)</text>
    <text x="10" y="32" font-size="11" font-weight="600" fill="#475569">초과수요(a₂-a₀) → 물가상승 압력</text>
  </g>

  <!-- 2. 디플레이션 갭 (x=585, y=219..261) -->
  <line x1="585" y1="219" x2="585" y2="261" stroke="#1d4ed8" stroke-width="3.2" />
  <line x1="578" y1="261" x2="592" y2="261" stroke="#1d4ed8" stroke-width="1.8" />
  <g transform="translate(602, 224)">
    <rect x="0" y="0" width="212" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
    <text x="10" y="16" font-size="12" font-weight="800" fill="#1d4ed8">▼ 디플레이션 갭 (경기침체 갭)</text>
    <text x="10" y="32" font-size="11" font-weight="600" fill="#334155">수요부족(a₀-a₁) → 불황·실업 발생</text>
  </g>

  <!-- 3. GDP 갭 (Horizontal between x=395 and x=585 at y=468) -->
  <line x1="400" y1="468" x2="580" y2="468" stroke="#1d4ed8" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)" />
  <line x1="395" y1="463" x2="395" y2="473" stroke="#1d4ed8" stroke-width="1.6" />
  <line x1="585" y1="463" x2="585" y2="473" stroke="#1d4ed8" stroke-width="1.6" />
  <g transform="translate(415, 475)">
    <rect x="0" y="0" width="150" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="75" y="15" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">&#x2194;&#xFE0E; GDP 갭 (Yₑ - Y₁)</text>
  </g>

  <!-- CORE TAKEAWAY CARDS -->
  <g transform="translate(60, 508)">
    <rect x="0" y="0" width="435" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 427 0 Q 435 0 435 8 L 435 24 L 0 24 Z" fill="#f8fafc" />
    <line x1="0" y1="24" x2="435" y2="24" stroke="#e2e8f0" stroke-width="1" />
    <text x="14" y="16" font-size="12" font-weight="800" fill="#0f172a">수직 갭(인플레이션·디플레이션 갭): 완전고용(Yₑ) 기준 측정</text>
    <text x="14" y="43" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#0f172a">인플레이션 갭</tspan>: 생산능력 초과 총수요 → 긴축정책(지출 삭감)</text>
    <text x="14" y="62" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#1d4ed8">디플레이션 갭</tspan>: 완전고용 미달 총수요 → 확장정책(지출 증액)</text>
  </g>

  <g transform="translate(515, 508)">
    <rect x="0" y="0" width="445" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 437 0 Q 445 0 445 8 L 445 24 L 0 24 Z" fill="#dbeafe" />
    <text x="14" y="16" font-size="12" font-weight="800" fill="#1d4ed8">수험 핵심 공식: GDP 갭과 디플레이션 갭의 승수 관계</text>
    <text x="14" y="43" font-size="12" font-weight="800" fill="#0f172a">GDP 갭 (수평) = 디플레이션 갭 (수직) × 승수 [ 1 / (1 - b) ]</text>
    <text x="14" y="62" font-size="11" font-weight="600" fill="#334155">→ 정부지출(ΔG)은 GDP 갭 전체가 아닌 디플레이션 갭만큼만 늘리면 해소</text>
  </g>
</svg>
