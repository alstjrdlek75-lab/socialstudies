<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="960" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Axes: Origin (105, 355) -->
  <line x1="105" y1="355" x2="555" y2="355" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr)" />
  <line x1="105" y1="355" x2="105" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr)" />

  <text x="565" y="360" font-size="16" font-weight="800" fill="#0f172a">국민소득 Y</text>
  <text x="105" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">총수요 AD</text>
  <text x="89" y="372" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Projections: Y1=200 -> (295, 165); Y3=300 -> x=390, 45-deg y=70, AD y=117.5 -->
  <line x1="105" y1="165" x2="295" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="295" y1="165" x2="295" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <line x1="390" y1="70" x2="390" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="105" y1="70" x2="390" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="105" y1="117.5" x2="390" y2="117.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 45-degree Ray: (105, 355) to (415, 45) [1 unit = 0.95px -> 100=95px, 200=190px, 300=285px] -->
  <line x1="105" y1="355" x2="415" y2="45" stroke="#475569" stroke-width="2.4" stroke-dasharray="7,5" />
  <text x="423" y="49" font-size="15" font-weight="800" fill="#475569">45°선 (Y = AD)</text>
  <text x="142" y="344" font-size="13.5" font-weight="700" fill="#64748b">45°</text>

  <!-- AD = 100 + 0.5Y: starts at (105, 260) [100], through (295, 165) [200], (390, 117.5) [250], ends at (485, 70) -->
  <line x1="105" y1="260" x2="485" y2="70" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="493" y="74" font-size="15.5" font-weight="800" fill="#1d4ed8">AD = 100 + 0.5Y</text>

  <!-- Deflationary Gap Segment at Y3 = 300 (x=390, y=70..117.5) -->
  <line x1="390" y1="70" x2="390" y2="117.5" stroke="#b91c1c" stroke-width="4.5" />
  <circle cx="390" cy="70" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
  <circle cx="390" cy="117.5" r="4.5" fill="#b91c1c" />
  <path d="M 398 70 C 405 70 405 93.8 411 93.8 C 405 93.8 405 117.5 398 117.5" fill="none" stroke="#b91c1c" stroke-width="2" />
  <line x1="411" y1="93.8" x2="438" y2="136" stroke="#b91c1c" stroke-width="1.6" />
  <text x="444" y="148" font-size="15" font-weight="800" fill="#b91c1c" class="halo">(가) 디플레이션 갭 = 50</text>

  <!-- Equilibrium Point E (295, 165) -->
  <circle cx="295" cy="165" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="306" y="184" font-size="15.5" font-weight="800" fill="#0f172a" class="halo">E</text>

  <!-- Axis Numbers -->
  <text x="93" y="265" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">100</text>
  <text x="93" y="170" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">200</text>
  <text x="93" y="123" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="end">250</text>
  <text x="93" y="75" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">300</text>

  <text x="295" y="380" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">200 (Y₁)</text>
  <text x="390" y="380" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">300 (Y₃)</text>
  <text x="295" y="402" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">균형소득</text>
  <text x="390" y="402" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">완전고용</text>
</svg>
