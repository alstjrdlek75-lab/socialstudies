<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">정부지출 승수효과 (The Keynesian Multiplier Effect)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">국민소득 (Y)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">총지출 (AE)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- 45-degree line -->
  <line x1="100" y1="390" x2="680" y2="90" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="690" y="95" font-size="14" font-weight="bold" fill="#64748b">Y = AE (45°선)</text>
  <!-- Initial AE1 line -->
  <line x1="100" y1="280" x2="650" y2="150" stroke="#2563eb" stroke-width="2.5" />
  <text x="660" y="155" font-size="13" font-weight="bold" fill="#2563eb">AE₁ = C + I + G₁</text>
  <!-- New AE2 line shifted up by delta G -->
  <line x1="100" y1="230" x2="650" y2="100" stroke="#dc2626" stroke-width="2.5" />
  <text x="660" y="105" font-size="13" font-weight="bold" fill="#dc2626">AE₂ = C + I + G₂</text>
  <!-- Delta G indicator -->
  <line x1="200" y1="256" x2="200" y2="206" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="210" y="235" font-size="13" font-weight="bold" fill="#ea580c">ΔG (초기 지출증가)</text>
  <!-- Equilibrium points E1 and E2 -->
  <circle cx="342" cy="223" r="5" fill="#2563eb" />
  <circle cx="493" cy="143" r="5" fill="#dc2626" />
  <!-- Dropdown lines -->
  <line x1="342" y1="390" x2="342" y2="223" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="493" y1="390" x2="493" y2="143" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="335" y="412" font-size="13" font-weight="bold" fill="#2563eb">Y₁</text>
  <text x="485" y="412" font-size="13" font-weight="bold" fill="#dc2626">Y₂</text>
  <!-- Delta Y arrow -->
  <line x1="345" y1="375" x2="490" y2="375" stroke="#16a34a" stroke-width="3" marker-end="url(#arr)" />
  <text x="400" y="365" font-size="13" font-weight="bold" fill="#16a34a">ΔY = ΔG / (1 - c)</text>
  <!-- Multiplier Formula Box -->
  <rect x="360" y="270" width="300" height="60" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
  <text x="375" y="295" font-size="13" font-weight="bold" fill="#1e40af">정부지출승수 = 1 / (1 - MPC)</text>
  <text x="375" y="315" font-size="12" fill="#475569">소득이 소비를 유발하며 연속적으로 확장</text>
</svg>