<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="1140" height="600" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Context Header Line (Clean, No Box) -->
  <text x="380" y="34" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">재정승수 크기 비교 (한계소비성향 c = 0.8, ΔG = ΔT = +100 가정)</text>

  <!-- Zero Baseline Axis at x = 390 -->
  <line x1="150" y1="336" x2="710" y2="336" stroke="#0f172a" stroke-width="2" marker-start="url(#arr-axis)" marker-end="url(#arr-axis)" />
  <line x1="390" y1="62" x2="390" y2="344" stroke="#0f172a" stroke-width="2.2" />

  <!-- Scale Ticks -->
  <line x1="190" y1="68" x2="190" y2="336" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4,4" />
  <line x1="440" y1="68" x2="440" y2="336" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4,4" />
  <line x1="640" y1="68" x2="640" y2="336" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4,4" />

  <text x="190" y="360" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="middle">−400</text>
  <text x="390" y="360" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">0</text>
  <text x="440" y="360" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">+100</text>
  <text x="640" y="360" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">+500</text>
  <text x="708" y="384" font-size="13" font-weight="700" fill="#475569" text-anchor="end">국민소득 변동 (ΔY)</text>

  <!-- Row 1: 정부지출 승수 (+5배 -> +500: x=390..640, width=250) -->
  <text x="32" y="102" font-size="16" font-weight="800" fill="#0f172a">정부지출 승수</text>
  <text x="32" y="126" font-size="14" font-weight="700" fill="#1d4ed8">1 / (1 − c) = +5</text>
  <rect x="390" y="84" width="250" height="44" rx="6" fill="#1d4ed8" />
  <text x="515" y="112" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">+500 (1차 총지출 직접 증가)</text>

  <!-- Row 2: 조세 승수 (-4배 -> 증세 시 -400: x=190..390, width=200) -->
  <text x="32" y="196" font-size="16" font-weight="800" fill="#0f172a">조세 승수 (증세)</text>
  <text x="32" y="220" font-size="14" font-weight="700" fill="#b91c1c">−c / (1 − c) = −4</text>
  <rect x="190" y="178" width="200" height="44" rx="6" fill="#b91c1c" />
  <text x="290" y="206" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">−400 (저축 누출 반영)</text>
  <text x="404" y="206" font-size="13" font-weight="600" fill="#64748b">※ 감세(−ΔT) 시 +400</text>

  <!-- Row 3: 균형재정 승수 (+1배 -> +100: x=390..440, width=50) -->
  <text x="32" y="290" font-size="16" font-weight="800" fill="#0f172a">균형재정 승수</text>
  <text x="32" y="314" font-size="14" font-weight="800" fill="#0f172a">kG + kT = +1</text>
  <rect x="390" y="272" width="50" height="44" rx="6" fill="#0f172a" />
  <text x="454" y="300" font-size="15" font-weight="800" fill="#0f172a">+100  (ΔG = ΔT 동시 증가 시 항상 1배)</text>
</svg>
