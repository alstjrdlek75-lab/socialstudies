<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="1200" height="600" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="red-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <line x1="385" y1="20" x2="385" y2="382" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== LEFT PANEL: 외환시장 균형 ==================== -->
  <text x="195" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">외환시장 균형</text>

  <line x1="74" y1="345" x2="312" y2="345" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="74" y1="345" x2="74" y2="62" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <text x="320" y="350" font-size="14.5" font-weight="800" fill="#0f172a">외환량 Q</text>
  <text x="74" y="52" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">환율 E</text>
  <text x="59" y="360" font-size="14" font-weight="700" fill="#475569">0</text>

  <!-- Supply S (수출): (105, 305) to (305, 105); Equilibrium at (205, 205) -->
  <line x1="105" y1="305" x2="305" y2="105" stroke="#0f172a" stroke-width="3" />
  <text x="312" y="105" font-size="15" font-weight="800" fill="#0f172a">S (수출)</text>

  <!-- Demand D (수입): (105, 105) to (305, 305) -->
  <line x1="105" y1="105" x2="305" y2="305" stroke="#1d4ed8" stroke-width="3" />
  <text x="312" y="310" font-size="15" font-weight="800" fill="#1d4ed8">D (수입)</text>

  <line x1="74" y1="205" x2="205" y2="205" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="205" y1="205" x2="205" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="205" cy="205" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <text x="62" y="210" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">E₀</text>
  <text x="205" y="370" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q₀</text>

  <!-- ==================== RIGHT PANEL: J-커브 효과 ==================== -->
  <text x="595" y="32" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">J-커브 효과 (환율 상승 후 경상수지)</text>

  <!-- Axes: Y-axis at x=475 (y=345..62), Zero Balance horizontal line at y=225, bottom time axis at y=345 -->
  <line x1="475" y1="345" x2="755" y2="345" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="475" y1="345" x2="475" y2="62" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="475" y1="225" x2="745" y2="225" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,4" />

  <text x="762" y="350" font-size="14.5" font-weight="800" fill="#0f172a">시간</text>
  <text x="475" y="52" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">경상수지</text>

  <!-- Zone Labels Left of Y-axis -->
  <text x="462" y="135" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="end">흑자 (+)</text>
  <text x="462" y="230" font-size="14" font-weight="700" fill="#475569" text-anchor="end">0 (균형)</text>
  <text x="462" y="305" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="end">적자 (−)</text>

  <!-- J-Curve Trajectory: flat 475..535 at y=225 -> dips to (580, 308) -> crosses 0 at (645, 225) -> rises to (730, 92) -->
  <path d="M 475 225 L 535 225 C 548 292, 562 308, 582 308 C 610 308, 632 250, 648 225 C 674 185, 704 132, 730 92" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round" />

  <!-- Devaluation Time t0 -->
  <line x1="535" y1="225" x2="535" y2="345" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <circle cx="535" cy="225" r="5.5" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <text x="535" y="370" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">t₀ (환율 상승)</text>

  <!-- Short-Run Worsening vs Long-Run Improvement Arrows -->
  <line x1="520" y1="238" x2="520" y2="296" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#red-arr)" />
  <text x="582" y="330" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">단기 악화</text>

  <line x1="636" y1="205" x2="692" y2="118" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#blue-arr)" />
  <text x="615" y="138" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">장기 개선</text>
  <text x="615" y="158" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" class="halo">(|ηx| + |ηm| &gt; 1)</text>
</svg>
