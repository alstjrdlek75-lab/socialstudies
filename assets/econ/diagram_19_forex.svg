<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="980" height="46" fill="#f8fafc" />
  <text x="490" y="29" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">외환시장 균형과 환율 변동 및 J-커브 효과</text>
  <line x1="0" y1="46" x2="980" y2="46" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- 2. Subtitle Banner -->
  <rect x="105" y="56" width="770" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="490" y="73" font-size="11.5" font-weight="600" text-anchor="middle" fill="#334155">
    환율 상승(원화 절하) 시 단기에는 계약 가격 고정으로 경상수지 악화 → 장기에는 수출입 수량 조정으로 흑자 반등 (J-Curve)
  </text>

  <!-- ==================== LEFT PLOT: 외환시장 균형 (X: 20 ~ 460) ==================== -->
  <!-- Left Axes: Origin (92, 460) -->
  <line x1="92" y1="460" x2="450" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="92" y1="460" x2="92" y2="104" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <text x="450" y="482" font-size="12" font-weight="700" fill="#334155" text-anchor="end">외환 거래량 (Q)</text>
  <text x="92" y="94" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">원/달러 환율 (E)</text>
  <text x="78" y="474" font-size="11" fill="#64748b">0</text>

  <!-- Forex Supply S -->
  <line x1="130" y1="410" x2="390" y2="150" stroke="#1e293b" stroke-width="2.6" />
  <g transform="translate(248, 118)">
    <rect x="0" y="0" width="184" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
    <text x="92" y="16" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">외환 공급 S (수출, 외화유입)</text>
  </g>

  <!-- Forex Demand D -->
  <line x1="130" y1="150" x2="390" y2="410" stroke="#1d4ed8" stroke-width="2.6" />
  <g transform="translate(248, 418)">
    <rect x="0" y="0" width="184" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1" />
    <text x="92" y="16" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">외환 수요 D (수입, 외화유출)</text>
  </g>

  <!-- Equilibrium Point E0 (260, 280) -->
  <line x1="92" y1="280" x2="260" y2="280" stroke="#93c5fd" stroke-dasharray="4,4" stroke-width="1.3" />
  <line x1="260" y1="280" x2="260" y2="460" stroke="#93c5fd" stroke-dasharray="4,4" stroke-width="1.3" />
  <circle cx="260" cy="280" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <!-- E0 Badge on Y-axis -->
  <rect x="20" y="269" width="64" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="52" y="284" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">E₀ (균형)</text>

  <!-- Q0 Badge on X-axis -->
  <rect x="240" y="468" width="40" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="260" y="483" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Q₀</text>

  <g transform="translate(164, 252)">
    <rect x="0" y="0" width="84" height="22" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <text x="42" y="15" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">균형점 (E₀)</text>
  </g>

  <!-- Subtle center divider -->
  <line x1="480" y1="96" x2="480" y2="482" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== RIGHT PLOT: J-커브 효과 (X: 500 ~ 960) ==================== -->
  <!-- Zero Trade Balance Line (NX = 0): y = 300 -->
  <line x1="570" y1="300" x2="895" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="570" y1="460" x2="570" y2="104" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <text x="904" y="304" font-size="12" font-weight="700" fill="#334155">시간 (t)</text>
  <text x="570" y="94" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">경상수지 (NX = X - M)</text>

  <!-- Axis zone labels (cleanly left of x=570) -->
  <rect x="500" y="170" width="62" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="531" y="185" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">흑자 (+)</text>

  <rect x="500" y="289" width="62" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="531" y="304" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">0 (균형)</text>

  <rect x="500" y="390" width="62" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="531" y="405" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">적자 (-)</text>

  <!-- Devaluation Event at t0 (610, 300) - badge strictly right of x=570 -->
  <line x1="610" y1="278" x2="610" y2="294" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2" />
  <g transform="translate(580, 254)">
    <rect x="0" y="0" width="116" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
    <text x="58" y="16" font-size="10.5" font-weight="700" fill="#1e293b" text-anchor="middle">t₀ (환율 급등 시점)</text>
  </g>

  <!-- J-Curve Trajectory -->
  <path d="M 570 300 L 610 300 C 640 300, 655 415, 685 415 C 720 415, 745 320, 770 300 C 800 270, 850 198, 895 155" fill="none" stroke="#1d4ed8" stroke-width="3" />
  <circle cx="610" cy="300" r="5" fill="#1e293b" stroke="#ffffff" stroke-width="1.8" />

  <g transform="translate(842, 122)">
    <rect x="0" y="0" width="96" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
    <text x="48" y="16" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">J-커브 곡선</text>
  </g>

  <!-- Phase 1 (단기): Trough Callout Card (below y=415 trough) -->
  <line x1="685" y1="418" x2="685" y2="432" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2" />
  <g transform="translate(600, 432)">
    <rect x="0" y="0" width="204" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#1e293b">① [단기] 경상수지 악화 (적자 심화)</text>
    <text x="10" y="31" font-size="10" fill="#475569">• 계약가격 고정 및 수량조정 시차 지연</text>
  </g>

  <!-- Phase 2 (장기): Expansion Callout Card (cleanly upper-left of rising curve, zero collision) -->
  <line x1="812" y1="176" x2="848" y2="202" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="3,2" />
  <g transform="translate(604, 148)">
    <rect x="0" y="0" width="208" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1" />
    <text x="10" y="16" font-size="10.5" font-weight="700" fill="#1d4ed8">② [장기] 경상수지 대폭 개선 (흑자)</text>
    <text x="10" y="31" font-size="10" fill="#334155">• 마셜-러너 조건 충족 (|ηx| + |ηm| &gt; 1)</text>
  </g>

  <!-- 3. Bottom Summary Banner -->
  <rect x="60" y="504" width="860" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
  <text x="490" y="525" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">
    마셜-러너 조건(Marshall-Lerner Condition): 환율 상승이 경상수지를 개선하려면 수출입 수요의 가격탄력성 합이 1보다 커야 함 (|ηx| + |ηm| &gt; 1)
  </text>
</svg>
