<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">외환시장 균형과 환율 변동 및 J-커브 효과</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 마셜-러너 조건 만족 시 환율 상승(평가절하) ➔ 단기 경상수지 악화 ➔ 장기 경상수지 대폭 개선(J-Curve)</text>

  <!-- Left Plot: Forex Market Equilibrium -->
  <!-- Origin: (80, 460) -->
  <line x1="80" y1="460" x2="480" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="80" y1="460" x2="80" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="485" y="465" font-size="11" font-weight="bold" fill="#475569">외환 거래량 (Q)</text>
  <text x="80" y="98" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">원/달러 환율 (E)</text>
  <text x="68" y="472" font-size="10" fill="#94a3b8">0</text>

  <!-- Forex Supply S$ (Export revenue, capital inflow): upward sloping -->
  <line x1="120" y1="410" x2="420" y2="150" stroke="#16a34a" stroke-width="3" />
  <text x="425" y="155" font-size="12" font-weight="bold" fill="#16a34a">S$ (외환 공급: 수출, 자본유입)</text>

  <!-- Forex Demand D$ (Import payment, capital outflow): downward sloping -->
  <line x1="120" y1="150" x2="420" y2="410" stroke="#2563eb" stroke-width="3" />
  <text x="425" y="415" font-size="12" font-weight="bold" fill="#2563eb">D$ (외환 수요: 수입, 대외송금)</text>

  <!-- Equilibrium E0 (270, 280) -->
  <circle cx="270" cy="280" r="5.5" fill="#1d4ed8" />
  <line x1="80" y1="280" x2="270" y2="280" stroke="#1d4ed8" stroke-dasharray="3,3" />
  <line x1="270" y1="280" x2="270" y2="460" stroke="#1d4ed8" stroke-dasharray="3,3" />
  <text x="50" y="284" font-size="12" font-weight="bold" fill="#1d4ed8">E0 (균형환율)</text>
  <text x="270" y="478" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Q0</text>

  <!-- Right Plot: J-Curve Effect -->
  <!-- Origin: (540, 320) [Horizontal line is trade balance = 0] -->
  <line x1="540" y1="320" x2="880" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="540" y1="460" x2="540" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="885" y="324" font-size="11" font-weight="bold" fill="#475569">시간 경과 (t)</text>
  <text x="540" y="98" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">경상수지 (NX = X - M)</text>
  <text x="520" y="324" font-size="11" font-weight="bold" fill="#475569">0 (균형)</text>
  <text x="510" y="200" font-size="11" font-weight="bold" fill="#16a34a">흑자(+)</text>
  <text x="510" y="420" font-size="11" font-weight="bold" fill="#dc2626">적자(-)</text>

  <!-- Devaluation occurs at t0 (580, 320) -->
  <circle cx="580" cy="320" r="4" fill="#dc2626" />
  <text x="580" y="305" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">t0 (환율 급등)</text>

  <!-- J-Curve trajectory: dips below 0 (short-run price rigidity), then rises above 0 (long-run volume effect) -->
  <!-- Starts at (580, 320) -> down to (630, 420) -> crosses at (700, 320) -> up to (860, 150) -->
  <path d="M 540 320 L 580 320 Q 620 440, 680 340 T 860 160" fill="none" stroke="#dc2626" stroke-width="3.5" />
  <text x="865" y="165" font-size="13" font-weight="bold" fill="#dc2626">J-Curve</text>

  <rect x="620" y="440" width="240" height="40" rx="4" fill="#fef2f2" stroke="#fecaca" />
  <text x="740" y="457" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">단기: 수량조정 지연으로 악화</text>
  <text x="740" y="473" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">장기: 마셜-러너 조건으로 흑자 전환</text>
</svg>