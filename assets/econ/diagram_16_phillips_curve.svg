<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">단기 및 장기 필립스 곡선 (SRPC &amp; LRPC: 자연실업률 가설)</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 단기: 인플레와 실업률의 상충 관계(우하향) | 장기: 기대 조정으로 수직의 자연실업률(Un)</text>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#475569">실업률 (u)</text>
  <text x="100" y="88" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">인플레이션율 (π)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- Long-Run Phillips Curve (LRPC): Vertical at Un = 440 -->
  <line x1="440" y1="460" x2="440" y2="100" stroke="#dc2626" stroke-width="3" />
  <text x="440" y="92" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">LRPC (장기 수직선: 자연실업률 Un)</text>

  <!-- Short-Run Phillips Curve 0 (SRPC0: πe = 0%) -->
  <path d="M 160 180 Q 350 320, 680 430" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="690" y="435" font-size="12" font-weight="bold" fill="#2563eb">SRPC0 (기대인플레 πe=0%)</text>

  <!-- Short-Run Phillips Curve 1 (SRPC1: Shifted up by expected inflation πe = 4%) -->
  <path d="M 160 110 Q 350 250, 680 360" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="5,3" />
  <text x="690" y="365" font-size="12" font-weight="bold" fill="#16a34a">SRPC1 (기대인플레 πe=4% 상승 시)</text>

  <!-- Equilibrium Points A, B, C -->
  <!-- A: (440, 360) on SRPC0 and LRPC -->
  <circle cx="440" cy="360" r="5" fill="#2563eb" />
  <text x="450" y="375" font-size="12" font-weight="bold" fill="#2563eb">A (최초 장기균형: π=0%, u=Un)</text>

  <!-- B: Short run expansion (280, 270) on SRPC0: unemployment drops, inflation rises -->
  <circle cx="280" cy="270" r="5" fill="#e11d48" />
  <text x="210" y="260" font-size="12" font-weight="bold" fill="#e11d48">B (단기: u↓, π↑)</text>

  <!-- C: Long run adjustment (440, 290) on SRPC1: expectation adjusts, back to Un with higher inflation -->
  <circle cx="440" cy="290" r="5" fill="#16a34a" />
  <text x="455" y="295" font-size="12" font-weight="bold" fill="#16a34a">C (장기: 기대조정 후 Un 복귀, π 고착화)</text>
</svg>