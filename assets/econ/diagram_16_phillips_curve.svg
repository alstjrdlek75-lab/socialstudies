<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>

    <!-- Shadow filter for cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="960" height="48" fill="#f8fafc" />
  <text x="480" y="31" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">단기 및 장기 필립스 곡선 (SRPC &amp; LRPC: 자연실업률 가설)</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 2. Subtitle Banner -->
  <rect x="140" y="58" width="680" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="480" y="75" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">
    • 단기: 인플레이션-실업률의 역(-)의 상충관계  |  장기: 기대 조정으로 자연실업률(Un)에서 수직
  </text>

  <!-- 3. Key Summary Box (Top-Right) -->
  <g transform="translate(690, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="185" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#f1f5f9" />
    <path d="M 0 20 L 0 30 L 250 30 L 250 20 z" fill="#f1f5f9" />
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#1e293b">💡 프리드먼 자연실업률 가설 요약</text>
    
    <text x="12" y="48" font-size="11" font-weight="bold" fill="#2563eb">① 단기 효과 (A → B):</text>
    <text x="20" y="65" font-size="10.5" fill="#475569">• 확장정책 → 총수요 증가로 물가(π) 상승</text>
    <text x="20" y="80" font-size="10.5" fill="#475569">• 적응적 기대로 실질임금 하락 → 실업률↓</text>

    <text x="12" y="105" font-size="11" font-weight="bold" fill="#16a34a">② 장기 조정 (B → C):</text>
    <text x="20" y="122" font-size="10.5" fill="#475569">• 물가상승 인지 후 명목임금 인상 요구</text>
    <text x="20" y="137" font-size="10.5" fill="#475569">• 기대인플레 상승(πe↑) → SRPC 상방이동</text>
    <text x="20" y="152" font-size="10.5" fill="#475569">• 실업률은 Un 복귀, 인플레만 π1로 고착</text>

    <line x1="10" y1="162" x2="240" y2="162" stroke="#e2e8f0" stroke-width="1" />
    <text x="125" y="176" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">➔ 장기: 화폐의 중립성 성립 (LRPC 수직)</text>
  </g>

  <!-- 4. Axes & Projection Grid: Origin at (110, 470) -->
  <line x1="110" y1="470" x2="680" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="110" y1="470" x2="110" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  
  <text x="690" y="475" font-size="13" font-weight="bold" fill="#1e293b">실업률 (u)</text>
  <text x="110" y="84" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">인플레이션율 (π)</text>
  <text x="96" y="484" font-size="11" fill="#94a3b8">0</text>

  <!-- Projection: Point B & C to Y-axis (π1) -->
  <line x1="110" y1="290" x2="500" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="100" y="294" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="end">π1 (상승한 인플레)</text>

  <!-- Projection: Point A to Y-axis (π0) -->
  <line x1="110" y1="410" x2="500" y2="410" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="100" y="414" font-size="11.5" font-weight="bold" fill="#64748b" text-anchor="end">π0 (초기 안정물가)</text>

  <!-- Projection: Point B to X-axis (u1) -->
  <line x1="320" y1="290" x2="320" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="270" y="480" width="100" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="320" y="495" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">u1 (단기 실업감소)</text>

  <!-- Projection: Natural Rate of Unemployment Un on X-axis -->
  <rect x="445" y="480" width="110" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="500" y="495" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Un (자연실업률)</text>

  <!-- 5. Long-Run Phillips Curve (LRPC): Vertical Red Line at x = 500 -->
  <line x1="500" y1="470" x2="500" y2="120" stroke="#dc2626" stroke-width="3" />
  <!-- LRPC Top Badge -->
  <g transform="translate(380, 94)">
    <rect x="0" y="0" width="240" height="25" rx="12.5" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
    <text x="120" y="17" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">LRPC (장기 수직선: u = Un)</text>
  </g>

  <!-- 6. Short-Run Phillips Curves -->
  <!-- SRPC0 (Initial: πe = π0) -->
  <path d="M 200 210 C 364 289, 416 446, 670 455" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="678" y="458" font-size="12" font-weight="bold" fill="#2563eb">SRPC0 (기대인플레 πe = π0)</text>

  <!-- SRPC1 (Shifted up by expectation adjustment: πe = π1) -->
  <path d="M 200 90 C 364 169, 416 326, 670 335" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,4" />
  <text x="678" y="338" font-size="12" font-weight="bold" fill="#16a34a">SRPC1 (기대인플레 πe = π1)</text>

  <!-- 7. Dynamic Adjustment Arrows -->
  <!-- Short-Run Path: A -> B along SRPC0 (Blue Curved Arrow) -->
  <path d="M 480 395 C 410 350, 370 320, 335 300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <rect x="365" y="340" width="95" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="412" y="354" font-size="10.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 단기: A → B</text>

  <!-- Long-Run Path: B -> C (Green Dashed Arrow) -->
  <line x1="335" y1="290" x2="480" y2="290" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arr-green)" />
  <rect x="375" y="262" width="95" height="20" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="422" y="276" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">② 장기: B → C</text>

  <!-- 8. Equilibrium Points & Detailed Cards -->
  <!-- Point A: Initial Long-Run Equilibrium (500, 410) -->
  <circle cx="500" cy="410" r="6.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(518, 385)" filter="url(#shadow)">
    <rect x="0" y="0" width="155" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
    <text x="8" y="17" font-size="11.5" font-weight="bold" fill="#1d4ed8">A: 최초 장기균형</text>
    <text x="8" y="34" font-size="10.5" fill="#475569">• 실업률 u = Un, 인플레 π = π0</text>
  </g>

  <!-- Point B: Short-Run Equilibrium (320, 290) -->
  <circle cx="320" cy="290" r="6.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(145, 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="48" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
    <text x="8" y="17" font-size="11.5" font-weight="bold" fill="#b91c1c">B: 단기 확장 균형</text>
    <text x="8" y="32" font-size="10" fill="#475569">• 실업률 하락 (u1 &lt; Un)</text>
    <text x="8" y="44" font-size="10" fill="#475569">• 물가 상승 (π1 &gt; π0)</text>
  </g>

  <!-- Point C: New Long-Run Equilibrium (500, 290) -->
  <circle cx="500" cy="290" r="6.5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(518, 255)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
    <text x="8" y="16" font-size="11.5" font-weight="bold" fill="#15803d">C: 새로운 장기균형</text>
    <text x="8" y="32" font-size="10" fill="#475569">• 기대인플레 상승(πe = π1)</text>
    <text x="8" y="44" font-size="10" fill="#475569">• 자연실업률(Un)로 복귀</text>
    <text x="8" y="54" font-size="9.5" font-weight="bold" fill="#dc2626">• 인플레이션만 π1로 고착화</text>
  </g>
</svg>