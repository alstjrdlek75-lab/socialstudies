<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- Axes: Origin (115, 360) -->
  <line x1="115" y1="360" x2="595" y2="360" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="115" y1="360" x2="115" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="605" y="365" font-size="16" font-weight="800" fill="#0f172a">실업률 u</text>
  <text x="115" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">인플레이션율 π</text>
  <text x="99" y="377" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Projections: A(395, 290), B(245, 180), C(395, 180) -->
  <line x1="115" y1="290" x2="395" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="115" y1="180" x2="395" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="245" y1="180" x2="245" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- LRPC: Vertical at un = 395 -->
  <line x1="395" y1="360" x2="395" y2="48" stroke="#0f172a" stroke-width="3.2" />
  <text x="395" y="36" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">LRPC</text>

  <!-- SRPC0: passes through B(245, 180) and A(395, 290) -->
  <path d="M 170 105 C 215 155, 315 245, 395 290 C 455 322, 500 332, 540 336" fill="none" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="548" y="340" font-size="15.5" font-weight="800" fill="#1d4ed8">SRPC₀</text>

  <!-- SRPC1 (Expected inflation rises: passes through C(395, 180)) -->
  <path d="M 220 55 C 275 108, 335 148, 395 180 C 455 212, 500 222, 540 226" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,5" />
  <text x="548" y="230" font-size="15.5" font-weight="700" fill="#475569">SRPC₁ (πᵉ 상승)</text>

  <!-- Dynamic Transition Arrows -->
  <path d="M 380 278 C 330 248, 290 218, 258 191" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="295" y="256" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">① 단기 상충</text>

  <line x1="260" y1="180" x2="378" y2="180" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="5,3" marker-end="url(#arr-red)" />
  <text x="320" y="166" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">② 장기 기대조정</text>

  <!-- Points A, B, C -->
  <circle cx="395" cy="290" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="410" y="286" font-size="15.5" font-weight="800" fill="#0f172a" class="halo">A (초기 균형)</text>

  <circle cx="245" cy="180" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="232" y="172" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">B (단기)</text>

  <circle cx="395" cy="180" r="6" fill="#b91c1c" stroke="#ffffff" stroke-width="2" />
  <text x="410" y="174" font-size="15.5" font-weight="800" fill="#b91c1c" class="halo">C (장기 복귀)</text>

  <!-- Axis Labels -->
  <text x="103" y="295" font-size="15" font-weight="700" fill="#475569" text-anchor="end">π₀</text>
  <text x="103" y="185" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="end">π₁</text>
  <text x="245" y="388" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">u₁</text>
  <text x="395" y="388" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">uₙ (자연실업률)</text>
</svg>
