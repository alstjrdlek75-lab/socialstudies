<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="980" height="48" fill="#f8fafc" />
  <text x="490" y="31" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">단기 및 장기 필립스 곡선 (SRPC &amp; LRPC: 자연실업률 가설)</text>
  <line x1="0" y1="48" x2="980" y2="48" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- 2. Subtitle Strip -->
  <rect x="120" y="58" width="740" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="490" y="75" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">
    단기: 인플레이션-실업률의 역(-)의 상충관계  ┃  장기: 기대 조정으로 자연실업률(Uₙ)에서 수직
  </text>

  <!-- 3. Key Summary Box (Top-Right: x=685..960, y=96..300) -->
  <g transform="translate(685, 96)">
    <rect x="0" y="0" width="275" height="204" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 265 0 Q 275 0 275 10 L 275 32 L 0 32 Z" fill="#f8fafc" />
    <line x1="0" y1="32" x2="275" y2="32" stroke="#e2e8f0" stroke-width="1" />
    <text x="14" y="21" font-size="13" font-weight="800" fill="#0f172a">프리드먼 자연실업률 가설 요약</text>

    <text x="14" y="54" font-size="12" font-weight="800" fill="#1d4ed8">① 단기 효과 (A → B)</text>
    <text x="20" y="72" font-size="11" fill="#334155">• 확장정책 → 총수요 증가로 물가(π) 상승</text>
    <text x="20" y="89" font-size="11" fill="#334155">• 적응적 기대로 실질임금 하락 → 실업률↓</text>

    <text x="14" y="116" font-size="12" font-weight="800" fill="#0f172a">② 장기 조정 (B → C)</text>
    <text x="20" y="134" font-size="11" fill="#334155">• 물가상승 인지 후 명목임금 인상 요구</text>
    <text x="20" y="151" font-size="11" fill="#334155">• 기대인플레 상승(πᵉ↑) → SRPC 상방이동</text>
    <text x="20" y="168" font-size="11" font-weight="700" fill="#1e293b">• 실업률은 Uₙ 복귀, 인플레만 π₁로 상승</text>

    <line x1="12" y1="180" x2="263" y2="180" stroke="#e2e8f0" stroke-width="1" />
    <text x="137" y="196" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">장기: 화폐의 중립성 성립 (LRPC 수직)</text>
  </g>

  <!-- 4. Axes & Projection Grid: Origin at (135, 475) -->
  <line x1="135" y1="475" x2="665" y2="475" stroke="#1e293b" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="135" y1="475" x2="135" y2="96" stroke="#1e293b" stroke-width="2" marker-end="url(#axis-arr)" />

  <text x="675" y="480" font-size="13.5" font-weight="700" fill="#0f172a">실업률 (u)</text>
  <text x="135" y="84" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">인플레이션율 (π)</text>
  <text x="121" y="490" font-size="12" font-weight="600" fill="#64748b">0</text>

  <!-- Projection: Point B & C to Y-axis (π1 = 290) -->
  <line x1="135" y1="290" x2="465" y2="290" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <text x="125" y="294" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">π₁ (상승 물가)</text>

  <!-- Projection: Point A to Y-axis (π0 = 410) -->
  <line x1="135" y1="410" x2="465" y2="410" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <text x="125" y="414" font-size="12" font-weight="700" fill="#475569" text-anchor="end">π₀ (초기 물가)</text>

  <!-- Projection: Point B to X-axis (u1 = 295) -->
  <line x1="295" y1="290" x2="295" y2="475" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <rect x="237" y="485" width="116" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="295" y="501" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">u₁ (단기 실업감소)</text>

  <!-- Projection: Natural Rate Un (x = 465) -->
  <rect x="405" y="485" width="120" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="465" y="501" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle">Uₙ (자연실업률)</text>

  <!-- 5. Long-Run Phillips Curve (LRPC): Vertical Line at x = 465 -->
  <line x1="465" y1="475" x2="465" y2="122" stroke="#1e293b" stroke-width="2.8" />
  <g transform="translate(345, 94)">
    <rect x="0" y="0" width="240" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
    <text x="120" y="17" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">LRPC (장기 수직선: u = Uₙ)</text>
  </g>

  <!-- 6. Short-Run Phillips Curves -->
  <!-- SRPC0 (Initial: passes through B(295, 290) and A(465, 410)) -->
  <path d="M 205 215 C 255 262, 375 362, 465 410 C 525 442, 575 452, 625 456" fill="none" stroke="#1d4ed8" stroke-width="2.8" />
  <g transform="translate(634, 443)">
    <rect x="0" y="0" width="186" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
    <text x="93" y="16" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">SRPC₀ (기대인플레 πᵉ = π₀)</text>
  </g>

  <!-- SRPC1 (Shifted up by 120px: passes through C(465, 290)) -->
  <path d="M 255 135 C 315 190, 395 252, 465 290 C 525 322, 575 332, 625 336" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6,4" />
  <g transform="translate(634, 323)">
    <rect x="0" y="0" width="186" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="93" y="16" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">SRPC₁ (기대인플레 πᵉ = π₁)</text>
  </g>

  <!-- 7. Dynamic Adjustment Arrows -->
  <path d="M 448 398 C 392 365, 345 330, 310 302" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <rect x="336" y="344" width="96" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="384" y="359" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">① 단기: A → B</text>

  <line x1="310" y1="290" x2="446" y2="290" stroke="#475569" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-slate)" />
  <rect x="336" y="260" width="96" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="384" y="275" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">② 장기: B → C</text>

  <!-- 8. Equilibrium Points & Cards (All clear of Summary Box at x=685!) -->
  <!-- Point A (465, 410) -->
  <circle cx="465" cy="410" r="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.4" />
  <g transform="translate(480, 378)">
    <rect x="0" y="0" width="166" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="10" y="18" font-size="12" font-weight="800" fill="#1e293b">A: 최초 장기균형</text>
    <text x="10" y="35" font-size="11" fill="#475569">• 실업률 u=Uₙ, 인플레 π=π₀</text>
  </g>

  <!-- Point B (295, 290) -->
  <circle cx="295" cy="290" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(148, 224)">
    <rect x="0" y="0" width="156" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
    <text x="10" y="18" font-size="12" font-weight="800" fill="#1d4ed8">B: 단기 확장 균형</text>
    <text x="10" y="34" font-size="11" fill="#334155">• 실업률 하락 (u₁ &lt; Uₙ)</text>
    <text x="10" y="47" font-size="11" fill="#334155">• 물가 상승 (π₁ &gt; π₀)</text>
  </g>

  <!-- Point C (465, 290) -->
  <circle cx="465" cy="290" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
  <g transform="translate(480, 244)">
    <rect x="0" y="0" width="166" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="10" y="18" font-size="12" font-weight="800" fill="#0f172a">C: 새로운 장기균형</text>
    <text x="10" y="34" font-size="11" fill="#334155">• 자연실업률(Uₙ)로 복귀</text>
    <text x="10" y="49" font-size="11" font-weight="700" fill="#1d4ed8">• 인플레이션만 π₁로 고착</text>
  </g>
</svg>
