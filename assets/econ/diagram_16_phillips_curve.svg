<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d" />
    </marker>

    <!-- Shadow filter for cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. Header Area -->
  <rect x="0" y="0" width="980" height="48" fill="#f8fafc" />
  <text x="490" y="32" font-size="18.5" font-weight="800" text-anchor="middle" fill="#0f172a">단기 및 장기 필립스 곡선 (SRPC &amp; LRPC: 자연실업률 가설)</text>
  <line x1="0" y1="48" x2="980" y2="48" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- 2. Subtitle Banner -->
  <rect x="120" y="58" width="740" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="490" y="77" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e40af">
    • 단기: 인플레이션-실업률의 역(-)의 상충관계  ┃  장기: 기대 조정으로 자연실업률(Un)에서 수직
  </text>

  <!-- 3. Key Summary Box (Top-Right) -->
  <g transform="translate(685, 96)" filter="url(#shadow)">
    <rect x="0" y="0" width="275" height="205" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="0" y="0" width="275" height="32" rx="10" fill="#f1f5f9" />
    <path d="M 0 20 L 0 32 L 275 32 L 275 20 z" fill="#f1f5f9" />
    <line x1="0" y1="32" x2="275" y2="32" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="22" font-size="13.5" font-weight="800" fill="#0f172a">💡 프리드먼 자연실업률 가설 요약</text>
    
    <text x="14" y="54" font-size="12.5" font-weight="800" fill="#1d4ed8">① 단기 효과 (A → B):</text>
    <text x="22" y="73" font-size="12" font-weight="600" fill="#0f172a">• 확장정책 ➔ 총수요 증가로 물가(π) 상승</text>
    <text x="22" y="91" font-size="12" font-weight="600" fill="#0f172a">• 적응적 기대로 실질임금 하락 ➔ 실업률↓</text>

    <text x="14" y="118" font-size="12.5" font-weight="800" fill="#15803d">② 장기 조정 (B → C):</text>
    <text x="22" y="137" font-size="12" font-weight="600" fill="#0f172a">• 물가상승 인지 후 명목임금 인상 요구</text>
    <text x="22" y="155" font-size="12" font-weight="600" fill="#0f172a">• 기대인플레 상승(πe↑) ➔ SRPC 상방이동</text>
    <text x="22" y="173" font-size="12" font-weight="700" fill="#b91c1c">• 실업률은 Un 복귀, 인플레만 π1로 고착</text>

    <line x1="12" y1="183" x2="263" y2="183" stroke="#e2e8f0" stroke-width="1" />
    <text x="137" y="198" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">➔ 장기: 화폐의 중립성 성립 (LRPC 수직)</text>
  </g>

  <!-- 4. Axes & Projection Grid: Origin at (115, 475) -->
  <line x1="115" y1="475" x2="685" y2="475" stroke="#0f172a" stroke-width="2.5" marker-end="url(#axis-arr)" />
  <line x1="115" y1="475" x2="115" y2="92" stroke="#0f172a" stroke-width="2.5" marker-end="url(#axis-arr)" />
  
  <text x="695" y="480" font-size="14.5" font-weight="800" fill="#0f172a">실업률 (u)</text>
  <text x="115" y="82" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">인플레이션율 (π)</text>
  <text x="100" y="490" font-size="13" font-weight="700" fill="#334155">0</text>

  <!-- Projection: Point B & C to Y-axis (π1) -->
  <line x1="115" y1="290" x2="500" y2="290" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" />
  <text x="105" y="295" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="end">π₁ (상승한 인플레)</text>

  <!-- Projection: Point A to Y-axis (π0) -->
  <line x1="115" y1="410" x2="500" y2="410" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" />
  <text x="105" y="415" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">π₀ (초기 안정물가)</text>

  <!-- Projection: Point B to X-axis (u1) -->
  <line x1="320" y1="290" x2="320" y2="475" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" />
  <rect x="260" y="485" width="120" height="24" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" />
  <text x="320" y="502" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">u₁ (단기 실업감소)</text>

  <!-- Projection: Natural Rate of Unemployment Un on X-axis -->
  <rect x="435" y="485" width="130" height="24" rx="4" fill="#fff1f2" stroke="#f87171" stroke-width="1.5" />
  <text x="500" y="502" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Uₙ (자연실업률)</text>

  <!-- 5. Long-Run Phillips Curve (LRPC): Vertical Red Line at x = 500 -->
  <line x1="500" y1="475" x2="500" y2="120" stroke="#dc2626" stroke-width="3.5" />
  <!-- LRPC Top Badge -->
  <g transform="translate(370, 92)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#fff1f2" stroke="#ef4444" stroke-width="2" />
    <text x="130" y="19" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">LRPC (장기 수직선: u = Uₙ)</text>
  </g>

  <!-- 6. Short-Run Phillips Curves -->
  <!-- SRPC0 (Initial: πe = π0) -->
  <path d="M 200 210 C 364 289, 416 446, 670 455" fill="none" stroke="#2563eb" stroke-width="3.5" />
  <g transform="translate(678, 442)">
    <rect x="0" y="0" width="195" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
    <text x="97" y="17" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">SRPC₀ (기대인플레 πᵉ = π₀)</text>
  </g>

  <!-- SRPC1 (Shifted up by expectation adjustment: πe = π1) -->
  <path d="M 200 90 C 364 169, 416 326, 670 335" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-dasharray="6,4" />
  <g transform="translate(678, 322)">
    <rect x="0" y="0" width="195" height="24" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
    <text x="97" y="17" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="middle">SRPC₁ (기대인플레 πᵉ = π₁)</text>
  </g>

  <!-- 7. Dynamic Adjustment Arrows -->
  <!-- Short-Run Path: A -> B along SRPC0 (Blue Curved Arrow) -->
  <path d="M 480 395 C 410 350, 370 320, 335 300" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr-blue)" />
  <rect x="360" y="338" width="105" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2" />
  <text x="412" y="354" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">① 단기: A → B</text>

  <!-- Long-Run Path: B -> C (Green Dashed Arrow) -->
  <line x1="335" y1="290" x2="480" y2="290" stroke="#15803d" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arr-green)" />
  <rect x="370" y="260" width="105" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2" />
  <text x="422" y="276" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">② 장기: B → C</text>

  <!-- 8. Equilibrium Points & Detailed High-Contrast Cards -->
  <!-- Point A: Initial Long-Run Equilibrium (500, 410) -->
  <circle cx="500" cy="410" r="7.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2.5" />
  <g transform="translate(515, 382)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" />
    <text x="10" y="19" font-size="13" font-weight="800" fill="#1d4ed8">A: 최초 장기균형</text>
    <text x="10" y="38" font-size="12" font-weight="700" fill="#0f172a">• 실업률 u=Un, 인플레 π=π0</text>
  </g>

  <!-- Point B: Short-Run Equilibrium (320, 290) -->
  <circle cx="320" cy="290" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" />
  <g transform="translate(130, 222)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="56" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5" />
    <text x="10" y="19" font-size="13" font-weight="800" fill="#b91c1c">B: 단기 확장 균형</text>
    <text x="10" y="37" font-size="12" font-weight="700" fill="#0f172a">• 실업률 하락 (u₁ &lt; Uₙ)</text>
    <text x="10" y="52" font-size="12" font-weight="700" fill="#0f172a">• 물가 상승 (π₁ &gt; π₀)</text>
  </g>

  <!-- Point C: New Long-Run Equilibrium (500, 290) -->
  <circle cx="500" cy="290" r="7.5" fill="#15803d" stroke="#ffffff" stroke-width="2.5" />
  <g transform="translate(515, 248)" filter="url(#shadow)">
    <rect x="0" y="0" width="175" height="66" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" />
    <text x="10" y="19" font-size="13" font-weight="800" fill="#15803d">C: 새로운 장기균형</text>
    <text x="10" y="36" font-size="11.5" font-weight="700" fill="#0f172a">• 기대인플레 상승(πᵉ = π₁)</text>
    <text x="10" y="50" font-size="11.5" font-weight="700" fill="#0f172a">• 자연실업률(Uₙ)로 복귀</text>
    <text x="10" y="63" font-size="11.5" font-weight="800" fill="#b91c1c">• 인플레이션만 π₁로 고착화</text>
  </g>
</svg>
