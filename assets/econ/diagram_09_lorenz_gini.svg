<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="960" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Lorenz Square: (110, 42) to (430, 362) [320 x 320] -->
  <!-- Area B (Under Lorenz Curve) -->
  <path d="M 110 362 Q 335 352 430 42 L 430 362 Z" fill="#f8fafc" />

  <!-- Area A (Between 45° Line and Lorenz Curve) -->
  <path d="M 110 362 L 430 42 Q 335 352 110 362 Z" fill="#dbeafe" fill-opacity="0.75" />

  <!-- 45-Degree Perfect Equality Line -->
  <line x1="110" y1="362" x2="430" y2="42" stroke="#64748b" stroke-width="2.4" stroke-dasharray="7,5" />
  <text x="242" y="185" font-size="14.5" font-weight="700" fill="#475569" transform="rotate(-45 242 185)" text-anchor="middle" class="halo">45° 완전균등선</text>

  <!-- Lorenz Curve -->
  <path d="M 110 362 Q 335 352 430 42" fill="none" stroke="#1d4ed8" stroke-width="3.4" />
  <text x="342" y="292" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">로렌츠 곡선</text>

  <!-- Crisp Outer Box Frame -->
  <rect x="110" y="42" width="320" height="320" fill="none" stroke="#0f172a" stroke-width="2.4" />

  <!-- Area Letters A & B -->
  <text x="292" y="246" font-size="22" font-weight="800" fill="#1d4ed8" text-anchor="middle">A</text>
  <text x="396" y="340" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">B</text>

  <!-- Axis Labels -->
  <text x="270" y="402" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">누적 인구 비율 (%)</text>
  <text x="110" y="384" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">0</text>
  <text x="430" y="384" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">100</text>

  <text x="52" y="202" font-size="15.5" font-weight="800" fill="#0f172a" transform="rotate(-90 52 202)" text-anchor="middle">누적 소득 점유율 (%)</text>
  <text x="98" y="366" font-size="14" font-weight="700" fill="#475569" text-anchor="end">0</text>
  <text x="98" y="50" font-size="14" font-weight="700" fill="#475569" text-anchor="end">100</text>

  <!-- Right Formula Callout (Minimal, High-Contrast) -->
  <text x="535" y="156" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">지니계수 (Gini)</text>
  <line x1="468" y1="196" x2="602" y2="196" stroke="#0f172a" stroke-width="2.2" />
  <text x="535" y="187" font-size="16" font-weight="800" fill="#1d4ed8" text-anchor="middle">불평등 면적 A</text>
  <text x="535" y="218" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">전체 면적 (A + B)</text>

  <text x="535" y="264" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">0 : 완전균등</text>
  <text x="535" y="288" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">1 : 완전불균등</text>
</svg>
