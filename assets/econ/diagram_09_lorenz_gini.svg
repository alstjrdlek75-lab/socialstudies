<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">소득분배 불평등 측정 지표: 로렌츠 곡선과 지니계수</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 지니계수 = 불평등 면적(A) / 대각선 아래 전체 면적(A + B) | 0에 가까울수록 완전균등, 1에 가까울수록 완전불균등</text>

  <!-- Square Box for Lorenz Curve: from (140, 110) to (500, 470) -> width 360, height 360 -->
  <rect x="140" y="110" width="360" height="360" fill="#ffffff" stroke="#475569" stroke-width="2" />

  <!-- Axes Labels -->
  <text x="320" y="500" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">누적 인구 비율 (%)</text>
  <text x="140" y="490" font-size="11" fill="#475569" text-anchor="middle">0%</text>
  <text x="500" y="490" font-size="11" fill="#475569" text-anchor="middle">100%</text>

  <text x="90" y="290" font-size="12" font-weight="bold" fill="#475569" transform="rotate(-90 90 290)" text-anchor="middle">누적 소득 점유율 (%)</text>
  <text x="120" y="475" font-size="11" fill="#475569" text-anchor="end">0%</text>
  <text x="120" y="115" font-size="11" fill="#475569" text-anchor="end">100%</text>

  <!-- 45-degree Line of Perfect Equality: (140, 470) to (500, 110) -->
  <line x1="140" y1="470" x2="500" y2="110" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="340" y="260" font-size="11.5" font-weight="bold" fill="#64748b" transform="rotate(-45 340 260)">45° 완전균등선</text>

  <!-- Shaded Area B (under Lorenz curve): Path from (140, 470) to (500, 110) via curve -->
  <path d="M 140 470 Q 380 460, 500 110 L 500 470 Z" fill="#eff6ff" fill-opacity="0.75" />
  <text x="430" y="410" font-size="16" font-weight="bold" fill="#1e40af">B</text>

  <!-- Shaded Area A (between 45 deg line and Lorenz curve): -->
  <path d="M 140 470 L 500 110 Q 380 460, 140 470 Z" fill="#fee2e2" fill-opacity="0.5" />
  <text x="360" y="340" font-size="16" font-weight="bold" fill="#991b1b">A</text>

  <!-- Lorenz Curve Line -->
  <path d="M 140 470 Q 380 460, 500 110" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="410" y="440" font-size="12" font-weight="bold" fill="#2563eb">로렌츠 곡선</text>

  <!-- Right Info Panel -->
  <rect x="540" y="110" width="350" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="540" y="110" width="350" height="34" rx="8" fill="#f1f5f9" />
  <path d="M 540 128 L 540 144 L 890 144 L 890 128 Z" fill="#f1f5f9" />
  <line x1="540" y1="144" x2="890" y2="144" stroke="#cbd5e1" stroke-width="1" />
  <text x="715" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">소득분배 불평등 지표 핵심 정리</text>

  <text x="565" y="174" font-size="12" font-weight="bold" fill="#1e293b">1. 로렌츠 곡선 (Lorenz Curve)</text>
  <text x="580" y="196" font-size="11" fill="#475569">• 대각선(45°선)에 가까울수록 ➔ 균등</text>
  <text x="580" y="216" font-size="11" fill="#475569">• 대각선에서 멀어져 볼록할수록 ➔ 불균등</text>
  <text x="580" y="236" font-size="11" fill="#475569">• [한계] 두 곡선 교차 시 우열 판정 불가</text>

  <text x="565" y="270" font-size="12" font-weight="bold" fill="#1e293b">2. 지니계수 (Gini Coefficient)</text>
  <rect x="575" y="282" width="280" height="26" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="715" y="299" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">지니계수 = 면적 A / 전체 면적 (A + B)</text>
  <text x="580" y="328" font-size="11" fill="#475569">• 0 ≤ Gini ≤ 1 (0에 가까울수록 완전균등)</text>
  <text x="580" y="348" font-size="11" fill="#475569">• 로렌츠 곡선이 교차해도 단일 수치로 비교 가능</text>

  <text x="565" y="384" font-size="12" font-weight="bold" fill="#1e293b">3. 10분위 분배율 vs 5분위 배율</text>
  <text x="580" y="406" font-size="11" fill="#475569">• 10분위 = 하위 40% 소득 / 상위 20% 소득 (클수록 균등)</text>
  <text x="580" y="426" font-size="11" fill="#475569">• 5분위 = 상위 20% 소득 / 하위 20% 소득 (작을수록 균등)</text>
</svg>