<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">로렌츠 곡선과 지니계수 (Lorenz Curve &amp; Gini Coefficient)</text>
  <!-- Square Box -->
  <rect x="180" y="80" width="300" height="300" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="330" y="410" font-size="14" font-weight="bold" fill="#334155">인구누적비율 (%)</text>
  <text x="60" y="235" font-size="14" font-weight="bold" fill="#334155">소득누적비율 (%)</text>
  <text x="170" y="395" font-size="13" fill="#64748b">0</text>
  <text x="470" y="395" font-size="13" fill="#64748b">100</text>
  <text x="150" y="85" font-size="13" fill="#64748b">100</text>
  <!-- Diagonal 45-degree line -->
  <line x1="180" y1="380" x2="480" y2="80" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,4" />
  <text x="360" y="210" font-size="13" font-weight="bold" fill="#059669" transform="rotate(-45 360,210)">완전균등선 (45° 대각선)</text>
  <!-- Lorenz Curve -->
  <!-- Shaded Area A (between diagonal and Lorenz) -->
  <path d="M 180 380 Q 360 370 480 80 L 180 380 Z" fill="#fee2e2" fill-opacity="0.8" />
  <!-- Lorenz curve border -->
  <path d="M 180 380 Q 360 370 480 80" fill="none" stroke="#dc2626" stroke-width="3" />
  <text x="390" y="365" font-size="13" font-weight="bold" fill="#dc2626">로렌츠 곡선 (Lorenz Curve)</text>
  <!-- Area A and B labels -->
  <text x="320" y="260" font-size="16" font-weight="bold" fill="#b91c1c">면적 A</text>
  <text x="380" y="320" font-size="16" font-weight="bold" fill="#475569">면적 B</text>
  <!-- Explanation Panel on Right -->
  <rect x="520" y="80" width="250" height="300" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="645" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">지니계수 공식</text>
  <text x="645" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">G = A / (A + B)</text>
  <line x1="540" y1="180" x2="750" y2="180" stroke="#cbd5e1" stroke-width="1" />
  <text x="540" y="215" font-size="13" fill="#334155">• G = 0 : 완전 균등 (A = 0)</text>
  <text x="540" y="245" font-size="13" fill="#334155">• G = 1 : 완전 불균등 (B = 0)</text>
  <text x="540" y="280" font-size="13" fill="#334155">• 0 ≤ G ≤ 1</text>
  <text x="540" y="315" font-size="13" font-weight="bold" fill="#2563eb">→ 0에 가까울수록 균등</text>
  <text x="540" y="345" font-size="13" font-weight="bold" fill="#dc2626">→ 1에 가까울수록 불균등</text>
</svg>