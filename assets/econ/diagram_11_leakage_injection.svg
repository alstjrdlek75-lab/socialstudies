<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="1140" height="645" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-leak" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#b91c1c" />
    </marker>
    <marker id="arr-inj" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Top Core Circular Pipeline: 가계 -> 기업 (국내 소비지출) & 기업 -> 가계 (국민소득) -->
  <!-- Return income arc above -->
  <path d="M 596 42 C 470 8, 290 8, 164 42" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-dark)" />
  <text x="380" y="22" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle" class="halo">국민소득 분배 (Y)</text>

  <!-- Main domestic consumption pipeline -->
  <line x1="196" y1="84" x2="554" y2="84" stroke="#0f172a" stroke-width="3.4" marker-end="url(#arr-dark)" />
  <text x="380" y="72" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle" class="halo">국내 소비 순환 (C − M)</text>

  <!-- Left Anchor: 가계 -->
  <rect x="32" y="46" width="164" height="76" rx="12" fill="#0f172a" />
  <text x="114" y="80" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">가계</text>
  <text x="114" y="104" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">처분: Y = C + S + T</text>

  <!-- Right Anchor: 기업 -->
  <rect x="564" y="46" width="164" height="76" rx="12" fill="#0f172a" />
  <text x="646" y="80" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">기업</text>
  <text x="646" y="104" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">지출: C + I + G + NX</text>

  <!-- Horizontal Leakage Manifold (from 가계) & Injection Manifold (to 기업) -->
  <line x1="88" y1="122" x2="88" y2="148" stroke="#b91c1c" stroke-width="2.6" />
  <line x1="88" y1="148" x2="554" y2="148" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="5,4" />

  <line x1="672" y1="148" x2="672" y2="128" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-inj)" />
  <line x1="206" y1="148" x2="672" y2="148" stroke="#1d4ed8" stroke-width="2.2" />

  <!-- ==================== 3 SECTOR CHANNELS ==================== -->
  <!-- Sector 1: 금융시장 -->
  <line x1="88" y1="148" x2="88" y2="232" stroke="#b91c1c" stroke-width="2.8" marker-end="url(#arr-leak)" />
  <text x="88" y="196" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">저축 (S)</text>
  <text x="88" y="214" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" class="halo">누출</text>

  <line x1="206" y1="240" x2="206" y2="154" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-inj)" />
  <text x="206" y="196" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">투자 (I)</text>
  <text x="206" y="214" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" class="halo">주입</text>

  <rect x="42" y="242" width="210" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
  <text x="147" y="269" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">금융시장</text>
  <text x="147" y="292" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">민간수지 (S − I)</text>

  <!-- Sector 2: 정부 부문 -->
  <line x1="321" y1="148" x2="321" y2="232" stroke="#b91c1c" stroke-width="2.8" marker-end="url(#arr-leak)" />
  <text x="321" y="196" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">조세 (T)</text>
  <text x="321" y="214" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" class="halo">누출</text>

  <line x1="439" y1="240" x2="439" y2="154" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-inj)" />
  <text x="439" y="196" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">정부지출 (G)</text>
  <text x="439" y="214" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" class="halo">주입</text>

  <rect x="275" y="242" width="210" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
  <text x="380" y="269" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">정부 부문</text>
  <text x="380" y="292" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">재정수지 (T − G)</text>

  <!-- Sector 3: 해외 부문 -->
  <line x1="554" y1="148" x2="554" y2="232" stroke="#b91c1c" stroke-width="2.8" marker-end="url(#arr-leak)" />
  <text x="554" y="196" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">수입 (M)</text>
  <text x="554" y="214" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" class="halo">누출</text>

  <line x1="672" y1="240" x2="672" y2="154" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arr-inj)" />
  <text x="672" y="196" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">수출 (X)</text>
  <text x="672" y="214" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" class="halo">주입</text>

  <rect x="508" y="242" width="210" height="64" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
  <text x="613" y="269" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">해외 부문</text>
  <text x="613" y="292" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">무역수지 (X − M)</text>

  <!-- Bottom Focal Identity Strip -->
  <rect x="42" y="332" width="676" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" />
  <text x="380" y="362" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">
    <tspan fill="#b91c1c">총누출 (S + T + M)</tspan>  =  <tspan fill="#1d4ed8">총주입 (I + G + X)</tspan>
  </text>
  <text x="380" y="392" font-size="14.5" font-weight="700" text-anchor="middle" fill="#334155">
    항등식 변형 :  (S − I) + (T − G) = (X − M)
  </text>
</svg>
