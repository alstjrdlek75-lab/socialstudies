<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="1020" height="615" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Subtle Highlight Band for Flat Liquidity Trap Zone -->
  <rect x="360" y="276" width="215" height="28" rx="6" fill="#dbeafe" fill-opacity="0.65" />

  <!-- Axes: Origin (115, 360) -->
  <line x1="115" y1="360" x2="605" y2="360" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="115" y1="360" x2="115" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="615" y="365" font-size="16" font-weight="800" fill="#0f172a">통화량</text>
  <text x="115" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">이자율 r</text>
  <text x="99" y="377" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Minimum Interest Rate Guide (y = 290) -->
  <line x1="115" y1="290" x2="360" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="103" y="295" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="end">최저금리</text>

  <!-- Money Supply Vertical Lines -->
  <!-- Ms0 (Normal region: x = 235, y = 215) -->
  <line x1="235" y1="360" x2="235" y2="66" stroke="#0f172a" stroke-width="2.6" />
  <text x="235" y="54" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">Ms₀</text>
  <line x1="115" y1="215" x2="235" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="103" y="220" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">r₀</text>

  <!-- Ms1 (Inside Trap: x = 415) -->
  <line x1="415" y1="360" x2="415" y2="66" stroke="#64748b" stroke-width="2.3" stroke-dasharray="7,5" />
  <text x="415" y="54" font-size="15.5" font-weight="700" fill="#475569" text-anchor="middle">Ms₁</text>

  <!-- Ms2 (Further Expansion: x = 535) -->
  <line x1="535" y1="360" x2="535" y2="66" stroke="#64748b" stroke-width="2.3" stroke-dasharray="7,5" />
  <text x="535" y="54" font-size="15.5" font-weight="700" fill="#475569" text-anchor="middle">Ms₂</text>

  <!-- Expansion Arrows -->
  <line x1="248" y1="112" x2="400" y2="112" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#blue-arr)" />
  <line x1="428" y1="112" x2="520" y2="112" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#blue-arr)" />
  <text x="385" y="98" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">통화공급 확대</text>

  <!-- Money Demand Curve Md: passes through (235, 215) and flattens at (360, 290) to (580, 290) -->
  <path d="M 155 80 Q 228 248 360 290 L 580 290" fill="none" stroke="#1d4ed8" stroke-width="3.6" />
  <text x="590" y="295" font-size="16" font-weight="800" fill="#1d4ed8">Md</text>

  <!-- Equilibrium Dots -->
  <circle cx="235" cy="215" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <circle cx="415" cy="290" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <circle cx="535" cy="290" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <!-- Trap Label cleanly below horizontal segment -->
  <text x="475" y="330" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">유동성 함정 구간 (이자율 불변 · 통화정책 무력)</text>
</svg>
