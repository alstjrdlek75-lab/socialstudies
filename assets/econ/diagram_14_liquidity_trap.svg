<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">화폐시장 균형과 유동성 함정 (Money Market &amp; Liquidity Trap)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">화폐량 (M)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">이자율 (r)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- Money Demand Curve with Horizontal Trap -->
  <path d="M 160 100 Q 250 250 380 330 L 680 330" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="690" y="335" font-size="14" font-weight="bold" fill="#2563eb">화폐수요 MD (유동성선호곡선)</text>
  <text x="450" y="355" font-size="13" font-weight="bold" fill="#dc2626">← 유동성 함정 (화폐수요 이자율탄력성 = ∞) →</text>
  <!-- Money Supply MS1 and MS2 in normal range -->
  <line x1="280" y1="390" x2="280" y2="90" stroke="#059669" stroke-width="2.5" />
  <text x="265" y="80" font-size="13" font-weight="bold" fill="#059669">MS1</text>
  <!-- Money Supply in Trap Range MS3 and MS4 -->
  <line x1="480" y1="390" x2="480" y2="180" stroke="#7c3aed" stroke-width="2.5" />
  <text x="465" y="170" font-size="13" font-weight="bold" fill="#7c3aed">MS3</text>
  <line x1="580" y1="390" x2="580" y2="180" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="565" y="170" font-size="13" font-weight="bold" fill="#a855f7">MS4</text>
  <text x="480" y="230" font-size="12" font-weight="bold" fill="#7c3aed">통화공급 증가해도</text>
  <text x="480" y="250" font-size="12" font-weight="bold" fill="#dc2626">이자율 불변 (통화정책 무력!)</text>
  <!-- Minimum interest rate r_min -->
  <line x1="100" y1="330" x2="380" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="50" y="335" font-size="13" font-weight="bold" fill="#dc2626">r_min (최저금리)</text>
</svg>