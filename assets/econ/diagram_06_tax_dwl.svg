<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- Shaded Regions: Origin (120, 365); E1(310, 185), E0(400, 230), Ps at (310, 275) -->
  <!-- Consumer Tax Burden: x=120..310, y=185..230 -->
  <rect x="120" y="185" width="190" height="45" fill="#dbeafe" fill-opacity="0.75" />
  <text x="215" y="213" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle">소비자 부담</text>

  <!-- Producer Tax Burden: x=120..310, y=230..275 -->
  <rect x="120" y="230" width="190" height="45" fill="#f1f5f9" />
  <text x="215" y="258" font-size="14" font-weight="800" fill="#334155" text-anchor="middle">생산자 부담</text>

  <!-- Deadweight Loss (DWL): (310, 185) -> (400, 230) -> (310, 275) -->
  <polygon points="310,185 400,230 310,275" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.8" />
  <text x="342" y="235" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

  <!-- Projection Guides -->
  <line x1="120" y1="185" x2="310" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="120" y1="230" x2="400" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="120" y1="275" x2="310" y2="275" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="310" y1="185" x2="310" y2="365" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="400" y1="230" x2="400" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Axes -->
  <line x1="120" y1="365" x2="605" y2="365" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="120" y1="365" x2="120" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="615" y="370" font-size="16" font-weight="800" fill="#0f172a">수량 Q</text>
  <text x="120" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">가격 P</text>
  <text x="104" y="382" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Demand D: y = 0.5*(x-120) + 90 -> (150, 105), (310, 185), (400, 230), (570, 315) -->
  <line x1="150" y1="105" x2="570" y2="315" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="580" y="320" font-size="16.5" font-weight="800" fill="#1d4ed8">D</text>

  <!-- Supply S0 (Pre-tax): y = -0.5*(x-120) + 370 -> (150, 355), (310, 275), (400, 230), (560, 150) -->
  <line x1="150" y1="355" x2="560" y2="150" stroke="#64748b" stroke-width="2.4" stroke-dasharray="7,5" />
  <text x="570" y="154" font-size="15.5" font-weight="700" fill="#475569">S₀ (과세 전)</text>

  <!-- Supply S1 = S0 + t (shifted up by 90px): y = -0.5*(x-120) + 280 -> (150, 265), (310, 185), (520, 80) -->
  <line x1="150" y1="265" x2="520" y2="80" stroke="#0f172a" stroke-width="3.2" />
  <text x="530" y="84" font-size="15.5" font-weight="800" fill="#0f172a">S₁ = S₀ + t</text>

  <!-- Tax Wedge Bracket at x = 480 (between y=100 and y=190) -->
  <line x1="480" y1="103" x2="480" y2="187" stroke="#0f172a" stroke-width="2.2" />
  <line x1="474" y1="103" x2="486" y2="103" stroke="#0f172a" stroke-width="2" />
  <line x1="474" y1="187" x2="486" y2="187" stroke="#0f172a" stroke-width="2" />
  <text x="466" y="152" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="end" class="halo">단위당 세금 t</text>

  <!-- Equilibrium Dots -->
  <circle cx="400" cy="230" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="412" y="226" font-size="15.5" font-weight="800" fill="#0f172a" class="halo">E₀</text>

  <circle cx="310" cy="185" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="304" y="170" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">E₁</text>
  <circle cx="310" cy="275" r="5" fill="#ffffff" stroke="#475569" stroke-width="2" />

  <!-- Axis Tick Labels -->
  <text x="108" y="190" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">Pb</text>
  <text x="108" y="235" font-size="15" font-weight="700" fill="#475569" text-anchor="end">P₀</text>
  <text x="108" y="280" font-size="15" font-weight="800" fill="#334155" text-anchor="end">Ps</text>

  <text x="310" y="392" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Qt (과세 후)</text>
  <text x="400" y="392" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Q₀</text>
</svg>
