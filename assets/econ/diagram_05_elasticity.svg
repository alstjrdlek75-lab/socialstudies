<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="990" height="690" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Vertical Alignment Line at Midpoint Q* (x = 320) -->
  <line x1="320" y1="122" x2="320" y2="420" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" />

  <!-- ==================== UPPER GRAPH: DEMAND & ELASTICITY ==================== -->
  <line x1="110" y1="210" x2="565" y2="210" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="110" y1="210" x2="110" y2="28" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <text x="575" y="215" font-size="15.5" font-weight="800" fill="#0f172a">수량 Q</text>
  <text x="110" y="18" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">가격 P</text>
  <text x="95" y="224" font-size="14" font-weight="700" fill="#475569">0</text>

  <!-- Linear Demand Line: (110, 38) to (530, 210); Midpoint (320, 124) -->
  <line x1="110" y1="38" x2="530" y2="210" stroke="#1d4ed8" stroke-width="3.4" />
  <text x="540" y="200" font-size="16.5" font-weight="800" fill="#1d4ed8">D</text>

  <!-- Midpoint & Segment Labels -->
  <circle cx="320" cy="124" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="334" y="116" font-size="15" font-weight="800" fill="#0f172a" class="halo">Ep = 1 (단위탄력)</text>

  <text x="205" y="66" font-size="15" font-weight="800" fill="#1d4ed8" class="halo">Ep &gt; 1 (탄력적: P↓ → TR↑)</text>
  <text x="415" y="152" font-size="15" font-weight="800" fill="#b91c1c" class="halo">Ep &lt; 1 (비탄력적: P↑ → TR↑)</text>

  <!-- ==================== LOWER GRAPH: TOTAL REVENUE (TR) ==================== -->
  <line x1="110" y1="420" x2="565" y2="420" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <line x1="110" y1="420" x2="110" y2="255" stroke="#0f172a" stroke-width="2.3" marker-end="url(#axis-arr)" />
  <text x="575" y="425" font-size="15.5" font-weight="800" fill="#0f172a">수량 Q</text>
  <text x="110" y="244" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">총수입 TR</text>
  <text x="95" y="434" font-size="14" font-weight="700" fill="#475569">0</text>

  <!-- Shaded TR Curve Area -->
  <path d="M 110 420 Q 320 156 530 420 Z" fill="#eff6ff" fill-opacity="0.55" />
  <!-- TR Parabola: Peak at (320, 288) -->
  <path d="M 110 420 Q 320 156 530 420" fill="none" stroke="#0f172a" stroke-width="3.2" />
  <text x="538" y="405" font-size="16" font-weight="800" fill="#0f172a">TR</text>

  <!-- Peak Point -->
  <circle cx="320" cy="288" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <text x="320" y="272" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle" class="halo">TR 극대 (MR = 0)</text>
  <text x="320" y="445" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (중점)</text>

  <text x="220" y="378" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle" class="halo">TR 증가 구간</text>
  <text x="420" y="378" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" class="halo">TR 감소 구간</text>
</svg>
