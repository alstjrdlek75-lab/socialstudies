<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="32" font-size="17.5" font-weight="800" text-anchor="middle" fill="#0f172a">수요의 가격탄력성 (Ep)과 기업의 총수입 (TR)</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Subtitle Strip -->
  <rect x="135" y="60" width="650" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="460" y="77" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">Ep &gt; 1 (탄력적): 가격 인하 시 TR 증가  |  Ep = 1 (단위탄력적): TR 극대화  |  Ep &lt; 1 (비탄력적): 가격 인상 시 TR 증가</text>

  <!-- Upper Plot: Demand Curve -->
  <line x1="95" y1="260" x2="505" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
  <line x1="95" y1="260" x2="95" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
  <text x="512" y="264" font-size="11.5" font-weight="700" fill="#334155">수량(Q)</text>
  <text x="95" y="89" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">가격(P)</text>

  <!-- Demand Line: (95, 110) to (475, 260) -->
  <line x1="95" y1="110" x2="475" y2="260" stroke="#1d4ed8" stroke-width="2.8" />
  <text x="484" y="255" font-size="12.5" font-weight="800" fill="#1d4ed8">D</text>

  <!-- Midpoint (Unit Elastic): (285, 185) -->
  <line x1="285" y1="185" x2="285" y2="500" stroke="#64748b" stroke-dasharray="4,3" stroke-width="1.5" />
  <circle cx="285" cy="185" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
  <text x="296" y="180" font-size="11.5" font-weight="800" fill="#0f172a">Ep = 1 (중앙점: 단위탄력적)</text>

  <text x="172" y="138" font-size="11.5" font-weight="700" fill="#1d4ed8">Ep &gt; 1 (탄력적 구간)</text>
  <text x="355" y="226" font-size="11.5" font-weight="700" fill="#475569">Ep &lt; 1 (비탄력적 구간)</text>

  <!-- Lower Plot: Total Revenue -->
  <line x1="95" y1="500" x2="505" y2="500" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
  <line x1="95" y1="500" x2="95" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
  <text x="512" y="504" font-size="11.5" font-weight="700" fill="#334155">수량(Q)</text>
  <text x="95" y="321" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">총수입(TR)</text>

  <!-- TR Parabola: starts (95, 500), peak at (285, 350), ends at (475, 500) -->
  <path d="M 95 500 Q 285 200, 475 500" fill="none" stroke="#1e293b" stroke-width="2.8" />
  <circle cx="285" cy="350" r="5" fill="#1e293b" stroke="#ffffff" stroke-width="1.8" />
  <text x="296" y="354" font-size="11.5" font-weight="800" fill="#0f172a">TR 극대점 (MR = 0)</text>

  <!-- Right Summary Box -->
  <rect x="565" y="108" width="325" height="372" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <path d="M 565 116 Q 565 108 573 108 L 882 108 Q 890 108 890 116 L 890 144 L 565 144 Z" fill="#f8fafc" />
  <line x1="565" y1="144" x2="890" y2="144" stroke="#e2e8f0" stroke-width="1" />
  <text x="727" y="131" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0f172a">탄력성과 기업의 가격전략 요약</text>

  <text x="583" y="176" font-size="12" font-weight="800" fill="#1d4ed8">1. Ep &gt; 1 (탄력적: 사치품, 대체재 많음)</text>
  <text x="595" y="198" font-size="11" fill="#334155">• 가격 인하(P↓) → 수량 대폭 증가(Q↑↑) → TR 증가</text>
  <text x="595" y="217" font-size="11" fill="#475569">• 가격 인상(P↑) → 수량 대폭 감소(Q↓↓) → TR 감소</text>

  <text x="583" y="254" font-size="12" font-weight="800" fill="#0f172a">2. Ep = 1 (단위탄력적)</text>
  <text x="595" y="276" font-size="11" fill="#334155">• 가격 변동률 = 수요량 변동률 → TR 극대화</text>

  <text x="583" y="314" font-size="12" font-weight="800" fill="#334155">3. Ep &lt; 1 (비탄력적: 필수품, 대체재 적음)</text>
  <text x="595" y="336" font-size="11" fill="#334155">• 가격 인상(P↑) → 수량 미세 감소(Q↓) → TR 증가</text>
  <text x="595" y="355" font-size="11" fill="#475569">• 가격 인하(P↓) → 수량 미세 증가(Q↑) → TR 감소</text>

  <rect x="583" y="388" width="289" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="727" y="411" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1d4ed8">농부의 역설 (풍년의 역설)</text>
  <text x="727" y="432" font-size="10.5" text-anchor="middle" fill="#334155">농산물은 Ep &lt; 1이므로 풍년 시 공급증가(P 급락)로</text>
  <text x="727" y="449" font-size="10.5" text-anchor="middle" fill="#334155">오히려 농가 총수입(TR)이 감소함</text>
</svg>
