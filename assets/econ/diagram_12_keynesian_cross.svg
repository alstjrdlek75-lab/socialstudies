<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">케인즈 45도선 균형모형과 인플레·디플레 갭 (Keynesian Cross)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">국민소득, 총공급 (Y)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">총지출 (AE)</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- 45-degree line -->
  <line x1="100" y1="390" x2="680" y2="80" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
  <text x="690" y="85" font-size="14" font-weight="bold" fill="#475569">Y = AE (45°선)</text>
  <!-- Aggregate Expenditure Curve AE -->
  <line x1="100" y1="280" x2="680" y2="120" stroke="#2563eb" stroke-width="3" />
  <text x="690" y="125" font-size="14" font-weight="bold" fill="#2563eb">AE = C + I + G + NX</text>
  <!-- Equilibrium Point E -->
  <!-- 45 line: Y = 390 - (310/580)*X. AE: AE = 280 - (160/580)*X. Intersection around X=420, Y=220 -->
  <circle cx="430" cy="214" r="6" fill="#2563eb" />
  <line x1="430" y1="390" x2="430" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="410" y="410" font-size="14" font-weight="bold" fill="#2563eb">Y* (균형국민소득)</text>
  <text x="445" y="210" font-size="13" font-weight="bold" fill="#2563eb">균형점 E (재고변동 = 0)</text>
  <!-- Full Employment Yf < Y* (Deflationary gap) or Yf > Y* -->
  <line x1="550" y1="390" x2="550" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="535" y="410" font-size="13" font-weight="bold" fill="#dc2626">Yf (완전고용)</text>
  <line x1="550" y1="150" x2="550" y2="156" stroke="#dc2626" stroke-width="3" />
  <text x="560" y="170" font-size="12" font-weight="bold" fill="#dc2626">디플레이션 갭 (경기침체 갭)</text>
</svg>