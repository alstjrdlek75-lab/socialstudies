<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="1020" height="645" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Axes: Origin (105, 345) -->
  <line x1="105" y1="345" x2="595" y2="345" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="105" y1="345" x2="105" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="605" y="350" font-size="16" font-weight="800" fill="#0f172a">국민소득 Y</text>
  <text x="105" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">총지출 AE</text>
  <text x="89" y="362" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- 45-degree Reference Line: slope -0.64 in screen coords? Wait: true 45-deg visual slope -0.68: (105, 345) to (525, 59.4); let's use exact 1:1 or 0.65 visual:
       Let 45-deg ray go from (105, 345) to (525, 65) [dx=420, dy=-280, ratio 2/3]
       AE0 (slope 1/3): y = 265 - (1/3)*(x-105) -> meets 45-deg [y = 345 - (2/3)*(x-105)] at (1/3)*(x-105) = 80 -> x-105 = 240 -> E0 = (345, 185)!
       AE1 (shifted up by ΔG = 45px): y = 220 - (1/3)*(x-105) -> meets 45-deg at (1/3)*(x-105) = 125 -> x-105 = 375 -> E1 = (480, 95)! -->

  <line x1="105" y1="345" x2="525" y2="65" stroke="#64748b" stroke-width="2.3" stroke-dasharray="7,5" />
  <text x="498" y="48" font-size="15" font-weight="800" fill="#475569" text-anchor="middle">45°선 (Y = AE)</text>
  <text x="144" y="336" font-size="13" font-weight="700" fill="#64748b">45°</text>

  <!-- Initial AE0 -->
  <line x1="105" y1="265" x2="555" y2="115" stroke="#334155" stroke-width="2.6" />
  <text x="564" y="120" font-size="15.5" font-weight="800" fill="#334155">AE₀ = C + I + G₀</text>

  <!-- Shifted AE1 -->
  <line x1="105" y1="220" x2="555" y2="70" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="564" y="75" font-size="15.5" font-weight="800" fill="#1d4ed8">AE₁ = C + I + G₁</text>

  <!-- Vertical Shift ΔG at x = 180 (from y=240 to y=195) -->
  <line x1="180" y1="238" x2="180" y2="201" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#blue-arr)" />
  <text x="192" y="224" font-size="15" font-weight="800" fill="#1d4ed8" class="halo">ΔG</text>

  <!-- Equilibrium Projections -->
  <line x1="345" y1="185" x2="345" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="480" y1="95" x2="480" y2="345" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />

  <circle cx="345" cy="185" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="335" y="172" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="end" class="halo">E₀</text>

  <circle cx="480" cy="95" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="470" y="82" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">E₁</text>

  <!-- X-Axis Income Labels & Amplified Multiplier Arrow -->
  <text x="345" y="370" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">Y₀</text>
  <text x="480" y="370" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Y₁</text>

  <line x1="350" y1="392" x2="472" y2="392" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#blue-arr)" />
  <text x="412" y="416" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">ΔY = [ 1 / (1 − c) ] × ΔG  (승수 확대)</text>
</svg>
