<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">무차별곡선과 예산선에 의한 소비자 균형</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 소비자 균형 조건: MRSxy = Px / Py ➔ MUx / Px = MUy / Py (한계효용 균등의 법칙)</text>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#475569">X재 소비량 (Qx)</text>
  <text x="100" y="92" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Y재 소비량 (Qy)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- Budget Line: M/Py at (100, 160) to M/Px at (650, 460) -->
  <line x1="100" y1="160" x2="650" y2="460" stroke="#dc2626" stroke-width="3" />
  <text x="50" y="165" font-size="11.5" font-weight="bold" fill="#dc2626">M / Py</text>
  <text x="640" y="480" font-size="11.5" font-weight="bold" fill="#dc2626">M / Px</text>
  <text x="550" y="380" font-size="12" font-weight="bold" fill="#dc2626">예산선 (기울기 = -Px/Py)</text>

  <!-- Indifference Curves (Convex to origin) -->
  <!-- IC0 (lower utility): passes below tangent -->
  <path d="M 130 380 Q 220 330, 480 390" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <text x="490" y="395" font-size="11" font-weight="bold" fill="#64748b">U0 (낮은 효용)</text>

  <!-- IC1 (tangent at E(375, 310)): -->
  <path d="M 160 220 Q 300 290, 680 320" fill="none" stroke="#2563eb" stroke-width="3.5" />
  <text x="690" y="325" font-size="12.5" font-weight="bold" fill="#2563eb">U1 (극대화 효용)</text>

  <!-- IC2 (unreachable): above budget line -->
  <path d="M 230 140 Q 420 210, 780 240" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <text x="790" y="245" font-size="11" font-weight="bold" fill="#64748b">U2 (예산 초과, 도달 불가)</text>

  <!-- Equilibrium Point E (375, 310) -->
  <circle cx="375" cy="310" r="5.5" fill="#1d4ed8" />
  <line x1="375" y1="310" x2="375" y2="460" stroke="#1d4ed8" stroke-dasharray="3,3" stroke-width="1.2" />
  <line x1="100" y1="310" x2="375" y2="310" stroke="#1d4ed8" stroke-dasharray="3,3" stroke-width="1.2" />
  <text x="375" y="478" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">X* (최적 소비량)</text>
  <text x="65" y="315" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Y*</text>
  <text x="390" y="300" font-size="13" font-weight="bold" fill="#1d4ed8">E (소비자 균형점: MRSxy = Px/Py)</text>
</svg>