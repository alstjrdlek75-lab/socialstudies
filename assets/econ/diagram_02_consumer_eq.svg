<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="48" fill="#f8fafc" />
  <text x="480" y="31" font-size="17.5" font-weight="800" text-anchor="middle" fill="#0f172a">무차별곡선과 예산선에 의한 소비자 균형</text>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Subtitle Strip -->
  <rect x="130" y="58" width="700" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="75" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">
    소비자 균형 조건: MRSxy = Px / Py  →  1원당 한계효용 균등 (MUx / Px = MUy / Py)
  </text>

  <!-- Summary Card (Top-Right) -->
  <g transform="translate(685, 96)">
    <rect x="0" y="0" width="255" height="156" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 8 Q 0 0 8 0 L 247 0 Q 255 0 255 8 L 255 30 L 0 30 Z" fill="#f8fafc" />
    <line x1="0" y1="30" x2="255" y2="30" stroke="#e2e8f0" stroke-width="1" />
    <text x="14" y="20" font-size="12" font-weight="800" fill="#0f172a">소비자 균형 조건 요약</text>

    <text x="14" y="50" font-size="11" font-weight="700" fill="#1d4ed8">① 접점 균형 조건</text>
    <text x="22" y="66" font-size="10" fill="#475569">MRSxy = Px / Py (무차별곡선·예산선 접점)</text>

    <text x="14" y="88" font-size="11" font-weight="700" fill="#1e293b">② 한계효용 균등의 법칙</text>
    <text x="22" y="104" font-size="10" fill="#475569">MUx / Px = MUy / Py (1원당 한계효용 일치)</text>

    <line x1="12" y1="116" x2="243" y2="116" stroke="#e2e8f0" stroke-width="1" />

    <text x="14" y="133" font-size="10.5" font-weight="700" fill="#1e293b">③ 예산제약 충족: Px·X + Py·Y = M</text>
    <text x="14" y="148" font-size="9.5" fill="#64748b">제한된 예산 하에서 효용(U)의 극대화 달성</text>
  </g>

  <!-- Budget Set Shading -->
  <polygon points="100,150 100,470 600,470" fill="#f8fafc" />

  <!-- Axes: Origin (100, 470) -->
  <line x1="100" y1="470" x2="740" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="470" x2="100" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <text x="750" y="475" font-size="12.5" font-weight="700" fill="#1e293b">X재 소비량 (Qx)</text>
  <text x="100" y="84" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">Y재 소비량 (Qy)</text>
  <text x="86" y="485" font-size="11.5" fill="#64748b">0</text>

  <!-- Budget Line: M/Py (100, 150) to M/Px (600, 470); Midpoint E = (350, 310), slope = 0.64 -->
  <line x1="100" y1="150" x2="600" y2="470" stroke="#1e293b" stroke-width="2.5" />
  <text x="88" y="154" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="end">M / Py</text>
  <text x="600" y="492" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">M / Px</text>

  <!-- Budget line slope label -->
  <rect x="440" y="418" width="155" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="517" y="433" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">예산선 (기울기 = -Px / Py)</text>

  <!-- Indifference Curves -->
  <!-- U0 (Lower utility) -->
  <path d="M 135 305 C 185 362, 255 390, 345 400 C 425 409, 500 415, 575 419" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" />
  <text x="583" y="423" font-size="11" font-weight="700" fill="#64748b">U₀ (낮은 효용)</text>

  <!-- U1 (Maximized Utility: Tangent to budget line at E(350, 310) with slope 0.64) -->
  <path d="M 175 138 C 225 215, 290 271.6, 350 310 C 410 348.4, 515 368, 635 376" fill="none" stroke="#1d4ed8" stroke-width="3" />
  <rect x="642" y="364" width="112" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="698" y="379" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">U₁ (극대화 효용)</text>

  <!-- U2 (Unattainable Utility: Outside budget set) -->
  <path d="M 240 112 C 310 175, 400 228, 495 256 C 565 276, 635 288, 690 294" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" />
  <text x="698" y="298" font-size="11" font-weight="700" fill="#64748b">U₂ (예산 초과: 도달 불가)</text>

  <!-- Equilibrium Point E (350, 310) -->
  <line x1="350" y1="310" x2="350" y2="470" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.4" />
  <line x1="100" y1="310" x2="350" y2="310" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.4" />
  <circle cx="350" cy="310" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <rect x="312" y="478" width="76" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="350" y="493" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">X* (최적소비)</text>
  <text x="88" y="314" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="end">Y*</text>

  <!-- Callout Badge for Equilibrium Point E -->
  <line x1="355" y1="305" x2="395" y2="255" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="3,2" />
  <g transform="translate(395, 204)">
    <rect x="0" y="0" width="256" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
    <path d="M 0 6 Q 0 0 6 0 L 250 0 Q 256 0 256 6 L 256 22 L 0 22 Z" fill="#eff6ff" />
    <text x="10" y="15" font-size="11" font-weight="800" fill="#1d4ed8">소비자 균형점 E (최적 소비 조합)</text>
    <text x="10" y="35" font-size="10" font-weight="600" fill="#1e293b">• 무차별곡선 접선 기울기 = 예산선 기울기</text>
    <text x="10" y="47" font-size="9.5" fill="#475569">• MRSxy = Px / Py → MUx / Px = MUy / Py</text>
  </g>
</svg>
