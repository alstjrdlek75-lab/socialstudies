<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="990" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Budget Set Shading -->
  <polygon points="105,85 105,360 515,360" fill="#f8fafc" />

  <!-- Axes -->
  <line x1="105" y1="360" x2="580" y2="360" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="105" y1="360" x2="105" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="590" y="365" font-size="16" font-weight="800" fill="#0f172a">X재</text>
  <text x="105" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Y재</text>
  <text x="88" y="378" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Budget Line: (105, 85) to (515, 360); Midpoint E = (310, 222.5), slope = 275/410 = 0.6707 -->
  <line x1="105" y1="85" x2="515" y2="360" stroke="#0f172a" stroke-width="2.8" />
  <text x="93" y="90" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">M/Py</text>
  <text x="515" y="384" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">M/Px</text>
  <text x="415" y="338" font-size="14" font-weight="700" fill="#334155" text-anchor="end" class="halo">예산선 (−Px/Py)</text>

  <!-- Indifference Curve U0 (Lower Utility - intersects budget line twice) -->
  <path d="M 140 205 C 185 268, 250 300, 345 312 C 415 321, 470 325, 525 327" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="6,4" />
  <text x="534" y="331" font-size="15" font-weight="700" fill="#64748b">U₀</text>

  <!-- Indifference Curve U1 (Tangent at E(310, 222.5) with exact tangent slope 0.6707: dx=60 -> dy=40.24) -->
  <path d="M 168 62 C 212 138, 250 182.3, 310 222.5 C 370 262.7, 455 282, 545 288" fill="none" stroke="#1d4ed8" stroke-width="3.4" />
  <text x="554" y="293" font-size="16" font-weight="800" fill="#1d4ed8">U₁ (효용 극대)</text>

  <!-- Indifference Curve U2 (Unattainable) -->
  <path d="M 235 46 C 295 112, 375 162, 465 186 C 505 196, 535 202, 560 205" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="6,4" />
  <text x="568" y="209" font-size="15" font-weight="700" fill="#64748b">U₂ (도달 불가)</text>

  <!-- Equilibrium Projections & Point E* -->
  <line x1="310" y1="222.5" x2="310" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="105" y1="222.5" x2="310" y2="222.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="310" cy="222.5" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <text x="310" y="384" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">X*</text>
  <text x="93" y="227" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="end">Y*</text>

  <text x="324" y="204" font-size="16.5" font-weight="800" fill="#0f172a" class="halo">E* (소비자 균형)</text>
  <text x="324" y="225" font-size="14" font-weight="700" fill="#1d4ed8" class="halo">MRSxy = Px / Py</text>
</svg>
