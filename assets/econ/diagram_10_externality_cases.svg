<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="1260" height="870" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4.5px; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Crosshair Dividers -->
  <line x1="420" y1="18" x2="420" y2="562" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="18" y1="290" x2="822" y2="290" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== [1] 생산의 외부불경제 ==================== -->
  <g transform="translate(0, 0)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">① 생산의 외부불경제 (과다생산 · 피구세)</text>

    <!-- DWL: E*(170, 125) -> Em(236, 158) -> SMC(236, 92) -->
    <polygon points="170,125 236,158 236,92" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.5" />
    <text x="214" y="128" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">Q</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">P</text>

    <!-- D = PMB = SMB: y = 0.5*(x-66) + 73 -> (90, 85) to (310, 195) -->
    <line x1="90" y1="85" x2="310" y2="195" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="199" font-size="13" font-weight="800" fill="#0f172a">PMB = SMB</text>

    <!-- PMC: y = -0.5*(x-66) + 243 -> (90, 231) to (310, 121) -->
    <line x1="90" y1="231" x2="310" y2="121" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="316" y="125" font-size="13" font-weight="700" fill="#475569">PMC</text>

    <!-- SMC: shifted up by 66 -> y = -0.5*(x-66) + 177 -> (90, 165) to (280, 70) -->
    <line x1="90" y1="165" x2="280" y2="70" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="286" y="74" font-size="13" font-weight="800" fill="#1d4ed8">SMC</text>

    <line x1="120" y1="212" x2="120" y2="156" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="112" y="188" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">피구세</text>

    <line x1="170" y1="125" x2="170" y2="242" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4" />
    <line x1="236" y1="158" x2="236" y2="242" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4" />
    <circle cx="170" cy="125" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <circle cx="236" cy="158" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <text x="170" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q*</text>
    <text x="236" y="264" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Qm</text>
  </g>

  <!-- ==================== [2] 생산의 외부경제 ==================== -->
  <g transform="translate(420, 0)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">② 생산의 외부경제 (과소생산 · 보조금)</text>

    <!-- DWL: Em(170, 125) -> SMC(170, 191) -> E*(236, 158) -->
    <polygon points="170,125 170,191 236,158" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.5" />
    <text x="192" y="162" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">Q</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">P</text>

    <line x1="90" y1="85" x2="310" y2="195" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="199" font-size="13" font-weight="800" fill="#0f172a">PMB = SMB</text>

    <!-- PMC (higher): (90, 165) to (280, 70) -->
    <line x1="90" y1="165" x2="280" y2="70" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="286" y="74" font-size="13" font-weight="700" fill="#475569">PMC</text>

    <!-- SMC (lower): (90, 231) to (310, 121) -->
    <line x1="90" y1="231" x2="310" y2="121" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="316" y="125" font-size="13" font-weight="800" fill="#1d4ed8">SMC</text>

    <line x1="120" y1="154" x2="120" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="112" y="188" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">보조금</text>

    <line x1="170" y1="125" x2="170" y2="242" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4" />
    <line x1="236" y1="158" x2="236" y2="242" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4" />
    <circle cx="170" cy="125" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="236" cy="158" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <text x="170" y="264" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Qm</text>
    <text x="236" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q*</text>
  </g>

  <!-- ==================== [3] 소비의 외부불경제 ==================== -->
  <g transform="translate(0, 290)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">③ 소비의 외부불경제 (과다소비 · 세금·규제)</text>

    <!-- DWL: E*(170, 191) -> Em(236, 158) -> SMB(236, 224) -->
    <polygon points="170,191 236,158 236,224" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.5" />
    <text x="214" y="195" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">Q</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">P</text>

    <!-- S = PMC = SMC: (90, 231) to (310, 121) -->
    <line x1="90" y1="231" x2="310" y2="121" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="125" font-size="13" font-weight="800" fill="#0f172a">PMC = SMC</text>

    <!-- PMB (higher): (90, 85) to (310, 195) -->
    <line x1="90" y1="85" x2="310" y2="195" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="316" y="199" font-size="13" font-weight="700" fill="#475569">PMB</text>

    <!-- SMB (lower): shifted down by 66 -> (90, 151) to (260, 236) -->
    <line x1="90" y1="151" x2="260" y2="236" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="266" y="235" font-size="13" font-weight="800" fill="#1d4ed8">SMB</text>

    <line x1="120" y1="104" x2="120" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="112" y="136" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">세금</text>

    <line x1="170" y1="191" x2="170" y2="242" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4" />
    <line x1="236" y1="158" x2="236" y2="242" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4" />
    <circle cx="170" cy="191" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <circle cx="236" cy="158" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <text x="170" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q*</text>
    <text x="236" y="264" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Qm</text>
  </g>

  <!-- ==================== [4] 소비의 외부경제 ==================== -->
  <g transform="translate(420, 290)">
    <text x="210" y="30" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">④ 소비의 외부경제 (과소소비 · 보조금)</text>

    <!-- DWL: Em(170, 191) -> SMB(170, 125) -> E*(236, 158) -->
    <polygon points="170,191 170,125 236,158" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.5" />
    <text x="192" y="162" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">DWL</text>

    <line x1="66" y1="242" x2="352" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <line x1="66" y1="242" x2="66" y2="56" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
    <text x="360" y="246" font-size="13.5" font-weight="800" fill="#0f172a">Q</text>
    <text x="66" y="47" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">P</text>

    <line x1="90" y1="231" x2="310" y2="121" stroke="#0f172a" stroke-width="2.6" />
    <text x="316" y="125" font-size="13" font-weight="800" fill="#0f172a">PMC = SMC</text>

    <!-- PMB (lower): (90, 151) to (260, 236) -->
    <line x1="90" y1="151" x2="260" y2="236" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
    <text x="266" y="235" font-size="13" font-weight="700" fill="#475569">PMB</text>

    <!-- SMB (higher): (90, 85) to (310, 195) -->
    <line x1="90" y1="85" x2="310" y2="195" stroke="#1d4ed8" stroke-width="2.8" />
    <text x="316" y="199" font-size="13" font-weight="800" fill="#1d4ed8">SMB</text>

    <line x1="120" y1="162" x2="120" y2="106" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="112" y="136" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">보조금</text>

    <line x1="170" y1="191" x2="170" y2="242" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,4" />
    <line x1="236" y1="158" x2="236" y2="242" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4" />
    <circle cx="170" cy="191" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <circle cx="236" cy="158" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
    <text x="170" y="264" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Qm</text>
    <text x="236" y="264" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q*</text>
  </g>
</svg>
