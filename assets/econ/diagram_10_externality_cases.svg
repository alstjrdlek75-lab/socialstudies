<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <!-- Title Header -->
  <rect x="0" y="0" width="980" height="60" fill="#f8fafc" />
  <text x="490" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">외부효과 4대 케이스 종합 도해 (생산·소비 측면 × 외부경제·불경제)</text>
  <line x1="0" y1="60" x2="980" y2="60" stroke="#cbd5e1" stroke-width="1.5" />

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-tax" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ==================== QUADRANT 1: [Case 1] 생산의 외부불경제 ==================== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#fee2e2" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#fee2e2" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#b91c1c">[Case 1] 생산의 외부불경제 (공해, 환경오염) ➔ 과다 생산</text>

    <!-- Header badge -->
    <rect x="15" y="44" width="415" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="222" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">• SMC = PMC + 외부비용 &gt; PMC | Q_시장 &gt; Q_최적 (과다생산) | 피구세(t)</text>

    <!-- Axes -->
    <line x1="55" y1="250" x2="410" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="55" y1="250" x2="55" y2="68" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="415" y="254" font-size="11" font-weight="bold" fill="#475569">수량(Q)</text>
    <text x="50" y="62" font-size="11" font-weight="bold" fill="#475569">가격(P)</text>
    <text x="44" y="262" font-size="10" fill="#94a3b8">0</text>

    <!-- Demand: D = PMB = SMB -->
    <line x1="80" y1="95" x2="360" y2="240" stroke="#2563eb" stroke-width="2.2" />
    <text x="365" y="244" font-size="11" font-weight="bold" fill="#2563eb">D = PMB = SMB</text>

    <!-- Supply: PMC -->
    <line x1="100" y1="230" x2="350" y2="105" stroke="#16a34a" stroke-width="2" />
    <text x="355" y="110" font-size="11" font-weight="bold" fill="#16a34a">S = PMC</text>

    <!-- Supply: SMC = PMC + EMC (shifted up/left) -->
    <line x1="70" y1="185" x2="320" y2="60" stroke="#dc2626" stroke-width="2.5" />
    <text x="315" y="55" font-size="11" font-weight="bold" fill="#dc2626">SMC (사회의 진정한 비용)</text>

    <!-- DWL Polygon: between Q* and Qm. Points: E*(195,155) -> (255,185) -> (255,122) -->
    <polygon points="195,155 255,185 255,93" fill="#fecaca" fill-opacity="0.85" stroke="#dc2626" stroke-width="1.2" />
    <text x="218" y="145" font-size="10" font-weight="bold" fill="#b91c1c">DWL</text>

    <!-- Optimum E* (195, 155) -->
    <circle cx="195" cy="155" r="4" fill="#dc2626" />
    <line x1="195" y1="155" x2="195" y2="250" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="188" y="265" font-size="11" font-weight="bold" fill="#dc2626">Q* (최적)</text>
    <text x="160" y="145" font-size="11" font-weight="bold" fill="#dc2626">E*</text>

    <!-- Market Em (255, 185) -->
    <circle cx="255" cy="185" r="4" fill="#16a34a" />
    <line x1="255" y1="185" x2="255" y2="250" stroke="#16a34a" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="245" y="265" font-size="11" font-weight="bold" fill="#16a34a">Qm (시장)</text>
    <text x="262" y="195" font-size="11" font-weight="bold" fill="#16a34a">Em</text>

    <!-- Tax arrow -->
    <line x1="330" y1="140" x2="330" y2="85" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-tax)" />
    <text x="338" y="115" font-size="10" font-weight="bold" fill="#dc2626">피구세(t)</text>
  </g>

  <!-- ==================== QUADRANT 2: [Case 2] 생산의 외부경제 ==================== -->
  <g transform="translate(505, 80)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#dcfce7" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#dcfce7" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#15803d">[Case 2] 생산의 외부경제 (R&amp;D 기술개발, 양봉업) ➔ 과소 생산</text>

    <!-- Header badge -->
    <rect x="15" y="44" width="415" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="222" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#166534">• SMC = PMC - 외부편익 &lt; PMC | Q_시장 &lt; Q_최적 (과소생산) | 피구보조금(s)</text>

    <!-- Axes -->
    <line x1="55" y1="250" x2="410" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="55" y1="250" x2="55" y2="68" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="415" y="254" font-size="11" font-weight="bold" fill="#475569">수량(Q)</text>
    <text x="50" y="62" font-size="11" font-weight="bold" fill="#475569">가격(P)</text>
    <text x="44" y="262" font-size="10" fill="#94a3b8">0</text>

    <!-- Demand: D = PMB = SMB -->
    <line x1="80" y1="95" x2="360" y2="240" stroke="#2563eb" stroke-width="2.2" />
    <text x="365" y="244" font-size="11" font-weight="bold" fill="#2563eb">D = PMB = SMB</text>

    <!-- Supply: PMC (Upper) -->
    <line x1="80" y1="195" x2="320" y2="70" stroke="#dc2626" stroke-width="2" />
    <text x="325" y="75" font-size="11" font-weight="bold" fill="#dc2626">S = PMC</text>

    <!-- Supply: SMC = PMC - EMB (shifted down/right) -->
    <line x1="110" y1="240" x2="350" y2="115" stroke="#16a34a" stroke-width="2.5" />
    <text x="355" y="120" font-size="11" font-weight="bold" fill="#16a34a">SMC (사회의 비용)</text>

    <!-- DWL Polygon: between Qm(195,155) and Q*(255,185). Points: Em(195,155) -> (195,215) -> E*(255,185) -->
    <polygon points="195,155 195,198 255,185" fill="#bbf7d0" fill-opacity="0.85" stroke="#16a34a" stroke-width="1.2" />
    <text x="210" y="180" font-size="10" font-weight="bold" fill="#15803d">DWL</text>

    <!-- Market Em (195, 155) -->
    <circle cx="195" cy="155" r="4" fill="#dc2626" />
    <line x1="195" y1="155" x2="195" y2="250" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="182" y="265" font-size="11" font-weight="bold" fill="#dc2626">Qm (시장)</text>
    <text x="165" y="150" font-size="11" font-weight="bold" fill="#dc2626">Em</text>

    <!-- Optimum E* (255, 185) -->
    <circle cx="255" cy="185" r="4" fill="#16a34a" />
    <line x1="255" y1="185" x2="255" y2="250" stroke="#16a34a" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="248" y="265" font-size="11" font-weight="bold" fill="#16a34a">Q* (최적)</text>
    <text x="265" y="190" font-size="11" font-weight="bold" fill="#16a34a">E*</text>

    <!-- Subsidy arrow -->
    <line x1="150" y1="135" x2="150" y2="190" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-sub)" />
    <text x="156" y="165" font-size="10" font-weight="bold" fill="#16a34a">보조금(s)</text>
  </g>

  <!-- ==================== QUADRANT 3: [Case 3] 소비의 외부불경제 ==================== -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#fee2e2" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#fee2e2" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#b91c1c">[Case 3] 소비의 외부불경제 (간접흡연, 음주소란) ➔ 과다 소비</text>

    <!-- Header badge -->
    <rect x="15" y="44" width="415" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="222" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">• SMB = PMB - 외부비용 &lt; PMB | Q_시장 &gt; Q_최적 (과다소비) | 세금/소비규제</text>

    <!-- Axes -->
    <line x1="55" y1="250" x2="410" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="55" y1="250" x2="55" y2="68" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="415" y="254" font-size="11" font-weight="bold" fill="#475569">수량(Q)</text>
    <text x="50" y="62" font-size="11" font-weight="bold" fill="#475569">가격(P)</text>
    <text x="44" y="262" font-size="10" fill="#94a3b8">0</text>

    <!-- Supply: S = PMC = SMC -->
    <line x1="80" y1="235" x2="350" y2="105" stroke="#16a34a" stroke-width="2.2" />
    <text x="355" y="110" font-size="11" font-weight="bold" fill="#16a34a">S = PMC = SMC</text>

    <!-- Demand: PMB (Upper) -->
    <line x1="100" y1="90" x2="370" y2="225" stroke="#2563eb" stroke-width="2" />
    <text x="375" y="230" font-size="11" font-weight="bold" fill="#2563eb">PMB (사적 편익)</text>

    <!-- Demand: SMB = PMB - EMC (Lower/Left) -->
    <line x1="70" y1="135" x2="330" y2="260" stroke="#dc2626" stroke-width="2.5" />
    <text x="325" y="270" font-size="11" font-weight="bold" fill="#dc2626">SMB (사회적 편익)</text>

    <!-- DWL Polygon: between Q*(190,180) and Qm(250,150). Points: E*(190,180) -> (250,150) -> (250,215) -->
    <polygon points="190,180 250,150 250,225" fill="#fecaca" fill-opacity="0.85" stroke="#dc2626" stroke-width="1.2" />
    <text x="220" y="185" font-size="10" font-weight="bold" fill="#b91c1c">DWL</text>

    <!-- Optimum E* (190, 180) -->
    <circle cx="190" cy="180" r="4" fill="#dc2626" />
    <line x1="190" y1="180" x2="190" y2="250" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="180" y="265" font-size="11" font-weight="bold" fill="#dc2626">Q* (최적)</text>
    <text x="160" y="185" font-size="11" font-weight="bold" fill="#dc2626">E*</text>

    <!-- Market Em (250, 150) -->
    <circle cx="250" cy="150" r="4" fill="#2563eb" />
    <line x1="250" y1="150" x2="250" y2="250" stroke="#2563eb" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="240" y="265" font-size="11" font-weight="bold" fill="#2563eb">Qm (시장)</text>
    <text x="260" y="145" font-size="11" font-weight="bold" fill="#2563eb">Em</text>

    <!-- Tax arrow -->
    <line x1="160" y1="125" x2="160" y2="175" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-tax)" />
    <text x="166" y="152" font-size="10" font-weight="bold" fill="#dc2626">세금/규제</text>
  </g>

  <!-- ==================== QUADRANT 4: [Case 4] 소비의 외부경제 ==================== -->
  <g transform="translate(505, 400)">
    <rect x="0" y="0" width="445" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="445" height="36" rx="10" fill="#dcfce7" />
    <path d="M 0 26 L 0 36 L 445 36 L 445 26 Z" fill="#dcfce7" />
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#15803d">[Case 4] 소비의 외부경제 (백신접종, 교육) ➔ 과소 소비</text>

    <!-- Header badge -->
    <rect x="15" y="44" width="415" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="222" y="58" font-size="11" font-weight="bold" text-anchor="middle" fill="#166534">• SMB = PMB + 외부편익 &gt; PMB | Q_시장 &lt; Q_최적 (과소소비) | 보조금/바우처</text>

    <!-- Axes -->
    <line x1="55" y1="250" x2="410" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="55" y1="250" x2="55" y2="68" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="415" y="254" font-size="11" font-weight="bold" fill="#475569">수량(Q)</text>
    <text x="50" y="62" font-size="11" font-weight="bold" fill="#475569">가격(P)</text>
    <text x="44" y="262" font-size="10" fill="#94a3b8">0</text>

    <!-- Supply: S = PMC = SMC -->
    <line x1="80" y1="235" x2="350" y2="105" stroke="#16a34a" stroke-width="2.2" />
    <text x="355" y="110" font-size="11" font-weight="bold" fill="#16a34a">S = PMC = SMC</text>

    <!-- Demand: PMB (Lower) -->
    <line x1="70" y1="145" x2="330" y2="270" stroke="#2563eb" stroke-width="2" />
    <text x="325" y="280" font-size="11" font-weight="bold" fill="#2563eb">PMB (사적 편익)</text>

    <!-- Demand: SMB = PMB + EMB (Upper/Right) -->
    <line x1="100" y1="85" x2="370" y2="220" stroke="#7c3aed" stroke-width="2.5" />
    <text x="375" y="225" font-size="11" font-weight="bold" fill="#7c3aed">SMB (사회적 편익)</text>

    <!-- DWL Polygon: between Qm(190,180) and Q*(250,150). Points: Em(190,180) -> (190,118) -> E*(250,150) -->
    <polygon points="190,180 190,123 250,150" fill="#bbf7d0" fill-opacity="0.85" stroke="#16a34a" stroke-width="1.2" />
    <text x="200" y="152" font-size="10" font-weight="bold" fill="#15803d">DWL</text>

    <!-- Market Em (190, 180) -->
    <circle cx="190" cy="180" r="4" fill="#2563eb" />
    <line x1="190" y1="180" x2="190" y2="250" stroke="#2563eb" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="180" y="265" font-size="11" font-weight="bold" fill="#2563eb">Qm (시장)</text>
    <text x="160" y="185" font-size="11" font-weight="bold" fill="#2563eb">Em</text>

    <!-- Optimum E* (250, 150) -->
    <circle cx="250" cy="150" r="4" fill="#7c3aed" />
    <line x1="250" y1="150" x2="250" y2="250" stroke="#7c3aed" stroke-dasharray="3,3" stroke-width="1.2" />
    <text x="242" y="265" font-size="11" font-weight="bold" fill="#7c3aed">Q* (최적)</text>
    <text x="260" y="145" font-size="11" font-weight="bold" fill="#7c3aed">E*</text>

    <!-- Subsidy arrow -->
    <line x1="140" y1="175" x2="140" y2="120" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-sub)" />
    <text x="146" y="145" font-size="10" font-weight="bold" fill="#16a34a">보조금(s)</text>
  </g>
</svg>
