<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2e8f0" fill-opacity="0.6" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.4" />
    </pattern>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1000" height="52" fill="#f8fafc" />
  <text x="500" y="33" font-size="18.5" font-weight="800" text-anchor="middle" fill="#0f172a">외부효과 4대 케이스 종합 도해 (생산·소비 측면 × 외부경제·불경제)</text>
  <line x1="0" y1="52" x2="1000" y2="52" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- ==================== QUADRANT 1: [Case 1] 생산의 외부불경제 ==================== -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="465" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 455 0 Q 465 0 465 10 L 465 36 L 0 36 Z" fill="#f8fafc" />
    <line x1="0" y1="36" x2="465" y2="36" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="23" font-size="13" font-weight="800" fill="#0f172a">[Case 1] 생산의 외부불경제 (공해, 환경오염) → 과다 생산</text>

    <rect x="15" y="44" width="435" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="232" y="59" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">SMC = PMC + 외부비용 &gt; PMC  |  과다생산(Qm &gt; Q*)  |  피구세(t = EMC)</text>

    <!-- DWL Polygon -->
    <polygon points="165,155 235,190 235,120" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.3" />
    <text x="210" y="156" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">DWL</text>

    <!-- Axes: Origin (65, 290) -->
    <line x1="65" y1="290" x2="395" y2="290" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="65" y1="290" x2="65" y2="88" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="402" y="294" font-size="11" font-weight="700" fill="#334155">수량(Q)</text>
    <text x="65" y="79" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">가격(P)</text>
    <text x="53" y="302" font-size="10" fill="#64748b">0</text>

    <!-- Curves -->
    <line x1="85" y1="115" x2="335" y2="240" stroke="#1e293b" stroke-width="2.3" />
    <text x="341" y="244" font-size="10.5" font-weight="700" fill="#1e293b">D = PMB = SMB</text>

    <line x1="85" y1="265" x2="335" y2="140" stroke="#64748b" stroke-width="2.1" stroke-dasharray="5,3" />
    <text x="341" y="143" font-size="10.5" font-weight="700" fill="#475569">S = PMC</text>

    <line x1="85" y1="195" x2="295" y2="90" stroke="#1d4ed8" stroke-width="2.6" />
    <text x="301" y="94" font-size="10.5" font-weight="800" fill="#1d4ed8">SMC (사회적비용)</text>

    <!-- Optimum E* (165, 155) & Market Em (235, 190) -->
    <line x1="165" y1="155" x2="165" y2="290" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="165" cy="155" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
    <text x="165" y="308" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (최적)</text>
    <text x="153" y="149" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="end">E*</text>

    <line x1="235" y1="190" x2="235" y2="290" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="235" cy="190" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <text x="235" y="308" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Qm (시장)</text>
    <text x="245" y="203" font-size="11" font-weight="700" fill="#334155">Em</text>

    <!-- Tax arrow at x=275 -->
    <line x1="275" y1="166" x2="275" y2="106" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <text x="282" y="138" font-size="10" font-weight="700" fill="#1d4ed8">피구세(t)</text>
  </g>

  <!-- ==================== QUADRANT 2: [Case 2] 생산의 외부경제 ==================== -->
  <g transform="translate(510, 68)">
    <rect x="0" y="0" width="465" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 455 0 Q 465 0 465 10 L 465 36 L 0 36 Z" fill="#f8fafc" />
    <line x1="0" y1="36" x2="465" y2="36" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="23" font-size="13" font-weight="800" fill="#0f172a">[Case 2] 생산의 외부경제 (R&amp;D 기술개발, 양봉업) → 과소 생산</text>

    <rect x="15" y="44" width="435" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="232" y="59" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">SMC = PMC - 외부편익 &lt; PMC  |  과소생산(Qm &lt; Q*)  |  피구보조금(s = EMB)</text>

    <!-- DWL Polygon -->
    <polygon points="165,155 165,225 235,190" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.3" />
    <text x="188" y="193" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">DWL</text>

    <!-- Axes: Origin (65, 290) -->
    <line x1="65" y1="290" x2="395" y2="290" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="65" y1="290" x2="65" y2="88" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="402" y="294" font-size="11" font-weight="700" fill="#334155">수량(Q)</text>
    <text x="65" y="79" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">가격(P)</text>
    <text x="53" y="302" font-size="10" fill="#64748b">0</text>

    <!-- Curves -->
    <line x1="85" y1="115" x2="335" y2="240" stroke="#1e293b" stroke-width="2.3" />
    <text x="341" y="244" font-size="10.5" font-weight="700" fill="#1e293b">D = PMB = SMB</text>

    <line x1="85" y1="195" x2="295" y2="90" stroke="#64748b" stroke-width="2.1" stroke-dasharray="5,3" />
    <text x="301" y="94" font-size="10.5" font-weight="700" fill="#475569">S = PMC</text>

    <line x1="85" y1="265" x2="335" y2="140" stroke="#1d4ed8" stroke-width="2.6" />
    <text x="341" y="143" font-size="10.5" font-weight="800" fill="#1d4ed8">SMC (사회적비용)</text>

    <!-- Market Em (165, 155) & Optimum E* (235, 190) -->
    <line x1="165" y1="155" x2="165" y2="290" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="165" cy="155" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <text x="165" y="308" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Qm (시장)</text>
    <text x="153" y="149" font-size="11" font-weight="700" fill="#334155" text-anchor="end">Em</text>

    <line x1="235" y1="190" x2="235" y2="290" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="235" cy="190" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
    <text x="235" y="308" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (최적)</text>
    <text x="245" y="203" font-size="11" font-weight="800" fill="#1d4ed8">E*</text>

    <!-- Subsidy arrow at x=118 -->
    <line x1="118" y1="183" x2="118" y2="243" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <text x="125" y="218" font-size="10" font-weight="700" fill="#1d4ed8">보조금(s)</text>
  </g>

  <!-- ==================== QUADRANT 3: [Case 3] 소비의 외부불경제 ==================== -->
  <g transform="translate(25, 434)">
    <rect x="0" y="0" width="465" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 455 0 Q 465 0 465 10 L 465 36 L 0 36 Z" fill="#f8fafc" />
    <line x1="0" y1="36" x2="465" y2="36" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="23" font-size="13" font-weight="800" fill="#0f172a">[Case 3] 소비의 외부불경제 (간접흡연, 음주소란) → 과다 소비</text>

    <rect x="15" y="44" width="435" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="232" y="59" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">SMB = PMB - 외부비용 &lt; PMB  |  과다소비(Qm &gt; Q*)  |  조세 부과 · 소비 규제</text>

    <!-- DWL Polygon -->
    <polygon points="165,225 235,190 235,260" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.3" />
    <text x="210" y="228" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">DWL</text>

    <!-- Axes: Origin (65, 290) -->
    <line x1="65" y1="290" x2="395" y2="290" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="65" y1="290" x2="65" y2="88" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="402" y="294" font-size="11" font-weight="700" fill="#334155">수량(Q)</text>
    <text x="65" y="79" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">가격(P)</text>
    <text x="53" y="302" font-size="10" fill="#64748b">0</text>

    <!-- Curves -->
    <line x1="85" y1="265" x2="335" y2="140" stroke="#1e293b" stroke-width="2.3" />
    <text x="341" y="143" font-size="10.5" font-weight="700" fill="#1e293b">S = PMC = SMC</text>

    <line x1="85" y1="115" x2="335" y2="240" stroke="#64748b" stroke-width="2.1" stroke-dasharray="5,3" />
    <text x="341" y="244" font-size="10.5" font-weight="700" fill="#475569">PMB (사적편익)</text>

    <line x1="85" y1="185" x2="285" y2="285" stroke="#1d4ed8" stroke-width="2.6" />
    <text x="291" y="284" font-size="10.5" font-weight="800" fill="#1d4ed8">SMB (사회적편익)</text>

    <!-- Optimum E* (165, 225) & Market Em (235, 190) -->
    <line x1="165" y1="225" x2="165" y2="290" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="165" cy="225" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
    <text x="165" y="308" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (최적)</text>
    <text x="153" y="222" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="end">E*</text>

    <line x1="235" y1="190" x2="235" y2="290" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="235" cy="190" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <text x="235" y="308" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Qm (시장)</text>
    <text x="245" y="185" font-size="11" font-weight="700" fill="#334155">Em</text>

    <!-- Tax arrow at x=118 -->
    <line x1="118" y1="136" x2="118" y2="196" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <text x="125" y="170" font-size="10" font-weight="700" fill="#1d4ed8">세금/규제</text>
  </g>

  <!-- ==================== QUADRANT 4: [Case 4] 소비의 외부경제 ==================== -->
  <g transform="translate(510, 434)">
    <rect x="0" y="0" width="465" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 455 0 Q 465 0 465 10 L 465 36 L 0 36 Z" fill="#f8fafc" />
    <line x1="0" y1="36" x2="465" y2="36" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="23" font-size="13" font-weight="800" fill="#0f172a">[Case 4] 소비의 외부경제 (백신접종, 교육) → 과소 소비</text>

    <rect x="15" y="44" width="435" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="232" y="59" font-size="10.5" font-weight="700" text-anchor="middle" fill="#334155">SMB = PMB + 외부편익 &gt; PMB  |  과소소비(Qm &lt; Q*)  |  보조금 · 바우처</text>

    <!-- DWL Polygon -->
    <polygon points="165,225 165,155 235,190" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.3" />
    <text x="188" y="193" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">DWL</text>

    <!-- Axes: Origin (65, 290) -->
    <line x1="65" y1="290" x2="395" y2="290" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <line x1="65" y1="290" x2="65" y2="88" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
    <text x="402" y="294" font-size="11" font-weight="700" fill="#334155">수량(Q)</text>
    <text x="65" y="79" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">가격(P)</text>
    <text x="53" y="302" font-size="10" fill="#64748b">0</text>

    <!-- Curves -->
    <line x1="85" y1="265" x2="335" y2="140" stroke="#1e293b" stroke-width="2.3" />
    <text x="341" y="143" font-size="10.5" font-weight="700" fill="#1e293b">S = PMC = SMC</text>

    <line x1="85" y1="185" x2="285" y2="285" stroke="#64748b" stroke-width="2.1" stroke-dasharray="5,3" />
    <text x="291" y="284" font-size="10.5" font-weight="700" fill="#475569">PMB (사적편익)</text>

    <line x1="85" y1="115" x2="335" y2="240" stroke="#1d4ed8" stroke-width="2.6" />
    <text x="341" y="244" font-size="10.5" font-weight="800" fill="#1d4ed8">SMB (사회적편익)</text>

    <!-- Market Em (165, 225) & Optimum E* (235, 190) -->
    <line x1="165" y1="225" x2="165" y2="290" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="165" cy="225" r="4.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <text x="165" y="308" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Qm (시장)</text>
    <text x="153" y="222" font-size="11" font-weight="700" fill="#334155" text-anchor="end">Em</text>

    <line x1="235" y1="190" x2="235" y2="290" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="235" cy="190" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
    <text x="235" y="308" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (최적)</text>
    <text x="245" y="185" font-size="11" font-weight="800" fill="#1d4ed8">E*</text>

    <!-- Subsidy arrow at x=118 -->
    <line x1="118" y1="198" x2="118" y2="138" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)" />
    <text x="125" y="170" font-size="10" font-weight="700" fill="#1d4ed8">보조금(s)</text>
  </g>
</svg>
