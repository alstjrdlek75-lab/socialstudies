<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <text x="400" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">솔로 경제성장 모형과 정상상태 (Solow Growth Model)</text>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="100" y1="390" x2="100" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="730" y="395" font-size="14" font-weight="bold" fill="#334155">1인당 자본량 (k = K/L)</text>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#334155">1인당 생산·투자 (y, sf(k))</text>
  <text x="85" y="408" font-size="14" font-weight="bold" fill="#64748b">0</text>
  <!-- Output curve y = f(k) -->
  <path d="M 100 390 Q 250 160 680 110" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="690" y="115" font-size="14" font-weight="bold" fill="#2563eb">1인당 생산 y = f(k)</text>
  <!-- Investment curve sf(k) -->
  <path d="M 100 390 Q 250 250 680 220" fill="none" stroke="#059669" stroke-width="3" />
  <text x="690" y="225" font-size="14" font-weight="bold" fill="#059669">1인당 투자 sf(k)</text>
  <!-- Depreciation/Break-even line (n+δ)k -->
  <line x1="100" y1="390" x2="680" y2="160" stroke="#dc2626" stroke-width="2.5" />
  <text x="690" y="165" font-size="14" font-weight="bold" fill="#dc2626">필요자본선 (n + δ)k</text>
  <!-- Steady State k* intersection of sf(k) and (n+δ)k -->
  <circle cx="440" cy="246" r="6" fill="#0f172a" />
  <line x1="440" y1="390" x2="440" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="425" y="410" font-size="14" font-weight="bold" fill="#0f172a">k* (정상상태 자본량)</text>
  <text x="445" y="240" font-size="13" font-weight="bold" fill="#0f172a">sf(k*) = (n+δ)k*</text>
  <!-- Consumption = y - sf(k) -->
  <text x="350" y="195" font-size="13" font-weight="bold" fill="#2563eb">1인당 소비 c*</text>
</svg>