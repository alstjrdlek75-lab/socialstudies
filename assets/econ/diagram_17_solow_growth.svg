<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Axes: Origin (100, 360) -->
  <line x1="100" y1="360" x2="590" y2="360" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="100" y1="360" x2="100" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="600" y="365" font-size="16" font-weight="800" fill="#0f172a">1인당 자본 k</text>
  <text x="100" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1인당 산출 y</text>
  <text x="84" y="377" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Capital Maintenance Line: (n + d)k from (100, 360) to (540, 118); at k*=340 (dx=240): y = 360 - 240*(242/440) = 228 -->
  <line x1="100" y1="360" x2="540" y2="118" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,5" />
  <text x="548" y="122" font-size="15.5" font-weight="700" fill="#475569">(n + d)k</text>

  <!-- Production Function: y = f(k): at x=340, y* = 148 (exact Q(260, 120) at t=0.58? Let's use exact cubic passing through (340, 148)!)
       Path from (100,360) through (340,148) to (540,86): -->
  <path d="M 100 360 C 150 230, 240 174, 340 148 C 415 128, 480 102, 540 86" fill="none" stroke="#0f172a" stroke-width="3.2" />
  <text x="548" y="90" font-size="16" font-weight="800" fill="#0f172a">y = f(k)</text>

  <!-- Investment Curve: i = s·f(k): passes cleanly through (340, 228)! -->
  <path d="M 100 360 C 150 282, 240 245, 340 228 C 415 215, 480 202, 540 194" fill="none" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="548" y="199" font-size="16" font-weight="800" fill="#1d4ed8">i = s·f(k)</text>

  <!-- Steady State Projections at k* = 340 -->
  <line x1="340" y1="148" x2="340" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="148" x2="340" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="228" x2="340" y2="228" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Consumption c* Segment between y*(148) and i*(228) -->
  <line x1="340" y1="148" x2="340" y2="228" stroke="#b91c1c" stroke-width="4.5" />
  <circle cx="340" cy="148" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <circle cx="340" cy="228" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />

  <text x="326" y="194" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="end" class="halo">1인당 소비 c*</text>
  <text x="354" y="250" font-size="15" font-weight="800" fill="#1d4ed8" class="halo">균제상태</text>

  <!-- Convergence Arrows along X-Axis -->
  <line x1="210" y1="360" x2="318" y2="360" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#blue-arr)" />
  <line x1="465" y1="360" x2="362" y2="360" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#blue-arr)" />

  <!-- Axis Labels -->
  <text x="88" y="153" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">y*</text>
  <text x="88" y="233" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">i*</text>
  <text x="340" y="390" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">k* (균제상태 자본)</text>
</svg>
