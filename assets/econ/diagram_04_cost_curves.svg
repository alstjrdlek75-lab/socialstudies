<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">단기 및 장기 비용곡선 체계 (MC, AC, AVC, LAC 포락선)</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="620" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">• 한계비용(MC) 곡선은 평균비용(AC)과 평균가변비용(AVC)의 최저점을 아래에서 위로 통과</text>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="820" y2="460" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="460" x2="100" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="830" y="465" font-size="12" font-weight="bold" fill="#475569">생산량 (Q)</text>
  <text x="100" y="92" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">비용, 가격 (C, P)</text>
  <text x="86" y="475" font-size="11" fill="#94a3b8">0</text>

  <!-- U-shaped Curves -->
  <!-- 1. AVC: Minimum at (320, 270) -->
  <path d="M 150 360 Q 320 270, 680 290" fill="none" stroke="#16a34a" stroke-width="2.5" />
  <text x="690" y="295" font-size="12" font-weight="bold" fill="#16a34a">AVC (평균가변비용)</text>

  <!-- 2. AC (SAC): Minimum at (420, 210) -->
  <path d="M 160 290 Q 420 210, 720 250" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="730" y="255" font-size="12" font-weight="bold" fill="#2563eb">AC (평균총비용)</text>

  <!-- 3. MC: Passes through AVC min(320, 270) and AC min(420, 210) -->
  <path d="M 180 410 Q 260 310, 320 270 T 420 210 T 640 110" fill="none" stroke="#dc2626" stroke-width="3.5" />
  <text x="650" y="115" font-size="13" font-weight="bold" fill="#dc2626">MC (한계비용)</text>

  <!-- Intersections -->
  <!-- AVC Min (320, 270) [Shutdown Point in Short Run] -->
  <circle cx="320" cy="270" r="5" fill="#16a34a" />
  <line x1="320" y1="270" x2="320" y2="460" stroke="#16a34a" stroke-dasharray="3,3" />
  <text x="320" y="478" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Q_sd (조업중단점)</text>
  <text x="230" y="260" font-size="11" font-weight="bold" fill="#16a34a">AVC 최저점 (P &lt; AVC 시 조업중단)</text>

  <!-- AC Min (420, 210) [Break-even Point] -->
  <circle cx="420" cy="210" r="5" fill="#2563eb" />
  <line x1="420" y1="210" x2="420" y2="460" stroke="#2563eb" stroke-dasharray="3,3" />
  <text x="420" y="478" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Q_be (손익분기점)</text>
  <text x="435" y="200" font-size="11" font-weight="bold" fill="#2563eb">AC 최저점 (손익분기점, 경제적 이윤 0)</text>
</svg>