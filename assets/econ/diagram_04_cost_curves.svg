<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="gap-arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Axes: Origin (100, 365) -->
  <line x1="100" y1="365" x2="605" y2="365" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="100" y1="365" x2="100" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="615" y="370" font-size="16" font-weight="800" fill="#0f172a">생산량 Q</text>
  <text x="100" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">비용 · 가격</text>
  <text x="84" y="382" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Coordinate Projections -->
  <!-- Shutdown point: (275, 255) -->
  <line x1="275" y1="255" x2="275" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="255" x2="275" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Breakeven point: (415, 175) -->
  <line x1="415" y1="175" x2="415" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="100" y1="175" x2="415" y2="175" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- AFC Gap Indicator at x = 215 (between AC y=144 and AVC y=236) -->
  <line x1="215" y1="150" x2="215" y2="230" stroke="#64748b" stroke-width="1.8" marker-start="url(#gap-arr)" marker-end="url(#gap-arr)" />
  <text x="206" y="194" font-size="13.5" font-weight="700" fill="#64748b" text-anchor="end" class="halo">AFC</text>

  <!-- 1. AVC Curve: Minimum at (275, 255) -->
  <path d="M 145 190 C 195 240, 232 255, 275 255 C 335 255, 455 228, 565 186" fill="none" stroke="#64748b" stroke-width="2.8" stroke-dasharray="7,5" stroke-linecap="round" />
  <text x="574" y="191" font-size="16" font-weight="800" fill="#475569">AVC</text>

  <!-- 2. AC Curve: Minimum at (415, 175) -->
  <path d="M 145 62 C 215 142, 325 175, 415 175 C 480 175, 528 158, 570 134" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <text x="579" y="138" font-size="16" font-weight="800" fill="#0f172a">AC</text>

  <!-- 3. MC Curve: Cuts through AVC min (275, 255) and AC min (415, 175) from below -->
  <path d="M 145 318 C 190 302, 235 278, 275 255 C 325 226, 370 201, 415 175 C 458 148, 492 102, 520 52" fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" />
  <text x="528" y="56" font-size="16.5" font-weight="800" fill="#1d4ed8">MC</text>

  <!-- Key Points -->
  <circle cx="275" cy="255" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.6" />
  <text x="275" y="284" font-size="14.5" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">조업중단점</text>
  <text x="275" y="390" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="middle">Q₁</text>
  <text x="88" y="260" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="end">P₁</text>

  <circle cx="415" cy="175" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="415" y="154" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">손익분기점</text>
  <text x="415" y="390" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q₂</text>
  <text x="88" y="180" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="end">P₂</text>
</svg>
