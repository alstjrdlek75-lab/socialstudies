<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="10" width="640" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="30" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">갑국과 을국의 생산가능곡선 (밀과 자동차)</text>

  <!-- ================= 갑국 (Country Gap) ================= -->
  <!-- Origin at (70, 240) -->
  <!-- Axes -->
  <line x1="70" y1="240" x2="300" y2="240" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="70" y1="240" x2="70" y2="55" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  
  <!-- Axis Labels -->
  <text x="210" y="278" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">자동차(만 대)</text>
  <text x="45" y="80" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">밀</text>
  <text x="45" y="96" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">(만 톤)</text>
  <text x="60" y="254" font-size="12" fill="#64748b">0</text>

  <!-- PPF Line: (70, 80) to (250, 240) -->
  <line x1="70" y1="80" x2="250" y2="240" stroke="#2563eb" stroke-width="2.5" />

  <!-- Ticks and Intercept Labels -->
  <text x="56" y="84" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">500</text>
  <text x="250" y="256" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">500</text>

  <!-- Pre-trade point: 250 wheat, 250 cars -> x = 160, y = 160 -->
  <line x1="70" y1="160" x2="160" y2="160" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="160" y1="240" x2="160" y2="160" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
  <circle cx="160" cy="160" r="4.5" fill="#2563eb" />
  <text x="56" y="164" font-size="12" fill="#475569" text-anchor="end">250</text>
  <text x="160" y="256" font-size="12" fill="#475569" text-anchor="middle">250</text>

  <!-- Country Label -->
  <text x="160" y="302" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">&lt;갑국&gt;</text>


  <!-- ================= 을국 (Country Eul) ================= -->
  <!-- Origin at (410, 240) -->
  <!-- Axes -->
  <line x1="410" y1="240" x2="640" y2="240" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="410" y1="240" x2="410" y2="55" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Axis Labels -->
  <text x="550" y="278" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">자동차(만 대)</text>
  <text x="385" y="80" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">밀</text>
  <text x="385" y="96" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">(만 톤)</text>
  <text x="400" y="254" font-size="12" fill="#64748b">0</text>

  <!-- Reference 500 tick on Y-axis for scale comparison -->
  <line x1="406" y1="80" x2="410" y2="80" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="398" y="84" font-size="12" fill="#94a3b8" text-anchor="end">500</text>

  <!-- PPF Line: (410, 144) to (570, 240) -->
  <line x1="410" y1="144" x2="570" y2="240" stroke="#ea580c" stroke-width="2.5" />

  <!-- Ticks and Intercept Labels -->
  <text x="398" y="148" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">300</text>
  <text x="570" y="256" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">400</text>

  <!-- Pre-trade point: 150 wheat, 200 cars -> x = 490, y = 192 -->
  <line x1="410" y1="192" x2="490" y2="192" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="490" y1="240" x2="490" y2="192" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
  <circle cx="490" cy="192" r="4.5" fill="#ea580c" />
  <text x="398" y="196" font-size="12" fill="#475569" text-anchor="end">150</text>
  <text x="490" y="256" font-size="12" fill="#475569" text-anchor="middle">200</text>

  <!-- Country Label -->
  <text x="490" y="302" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">&lt;을국&gt;</text>
</svg>
