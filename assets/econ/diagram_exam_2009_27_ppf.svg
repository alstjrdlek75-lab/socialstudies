<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1020" height="510" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- ================= 갑국 (Country Gap) ================= -->
  <line x1="80" y1="245" x2="310" y2="245" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <line x1="80" y1="245" x2="80" y2="38" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />

  <text x="235" y="292" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">자동차(만 대)</text>
  <text x="80" y="24" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">밀(만 톤)</text>
  <text x="66" y="262" font-size="14" font-weight="700" fill="#475569">0</text>

  <!-- PPF Line: (80, 65) to (260, 245) -->
  <line x1="80" y1="65" x2="260" y2="245" stroke="#1d4ed8" stroke-width="3" />
  <text x="68" y="70" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">500</text>
  <text x="260" y="268" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">500</text>

  <!-- Pre-trade point: (250, 250) -> (170, 155) -->
  <line x1="80" y1="155" x2="170" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="170" y1="155" x2="170" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="170" cy="155" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="68" y="160" font-size="14.5" font-weight="700" fill="#475569" text-anchor="end">250</text>
  <text x="170" y="268" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">250</text>

  <text x="175" y="322" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">&lt;갑국&gt;</text>

  <!-- ================= 을국 (Country Eul) ================= -->
  <line x1="420" y1="245" x2="650" y2="245" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <line x1="420" y1="245" x2="420" y2="38" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />

  <text x="575" y="292" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">자동차(만 대)</text>
  <text x="420" y="24" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">밀(만 톤)</text>
  <text x="406" y="262" font-size="14" font-weight="700" fill="#475569">0</text>

  <!-- Reference 500 tick on Y-axis -->
  <line x1="415" y1="65" x2="420" y2="65" stroke="#94a3b8" stroke-width="1.8" />
  <text x="408" y="70" font-size="14.5" font-weight="600" fill="#94a3b8" text-anchor="end">500</text>

  <!-- PPF Line: (420, 137) [300] to (564, 245) [400] -->
  <line x1="420" y1="137" x2="564" y2="245" stroke="#0f172a" stroke-width="3" />
  <text x="408" y="142" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">300</text>
  <text x="564" y="268" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">400</text>

  <!-- Pre-trade point: (200, 150) -> (492, 191) -->
  <line x1="420" y1="191" x2="492" y2="191" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="492" y1="191" x2="492" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="492" cy="191" r="5.5" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  <text x="408" y="196" font-size="14.5" font-weight="700" fill="#475569" text-anchor="end">150</text>
  <text x="492" y="268" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">200</text>

  <text x="515" y="322" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">&lt;을국&gt;</text>
</svg>
