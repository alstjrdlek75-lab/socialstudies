<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="1050" height="675" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Axes: Origin (90, 335) -->
  <line x1="90" y1="335" x2="635" y2="335" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="90" y1="335" x2="90" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="645" y="340" font-size="16" font-weight="800" fill="#0f172a">X재</text>
  <text x="90" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Y재</text>
  <text x="74" y="352" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- 1. Initial Budget Line BL0: (90, 65) to (330, 335); slope = 270/240 = 1.125; A at x=190 -> y=177.5 -->
  <line x1="90" y1="65" x2="330" y2="335" stroke="#0f172a" stroke-width="2.4" />
  <text x="292" y="318" font-size="13.5" font-weight="700" fill="#334155" text-anchor="end" class="halo">초기 예산선</text>

  <!-- 2. New Budget Line BL1 (Px drop): (90, 65) to (590, 335); slope = 270/500 = 0.54; C at x=410 -> y=237.8 -->
  <line x1="90" y1="65" x2="590" y2="335" stroke="#1d4ed8" stroke-width="2.8" />
  <text x="588" y="320" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">가격 하락 후 예산선</text>

  <!-- 3. Compensated Budget Line BLc (parallel to BL1, slope 0.54): (90, 152) to (428.9, 335); B at x=300 -> y=265.4 -->
  <line x1="90" y1="152" x2="429" y2="335" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" />
  <text x="382" y="322" font-size="13.5" font-weight="700" fill="#64748b" text-anchor="middle" class="halo">보상예산선</text>

  <!-- Indifference Curve U0: tangent to BL0 at A(190, 177.5, slope 1.125) and BLc at B(300, 265.4, slope 0.54) -->
  <path d="M 138 72 C 158 134, 170 155, 190 177.5 C 220 211.2, 260 243.8, 300 265.4 C 338 285.9, 382 295, 422 298" fill="none" stroke="#334155" stroke-width="2.8" />
  <text x="430" y="302" font-size="15.5" font-weight="800" fill="#334155">U₀</text>

  <!-- Indifference Curve U1: tangent to BL1 at C(410, 237.8, slope 0.54) -->
  <path d="M 245 78 C 295 156, 350 205.4, 410 237.8 C 470 270.2, 535 280, 595 284" fill="none" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="604" y="288" font-size="15.5" font-weight="800" fill="#1d4ed8">U₁</text>

  <!-- Projections & Points A, B, C -->
  <line x1="190" y1="177.5" x2="190" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="300" y1="265.4" x2="300" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="410" y1="237.8" x2="410" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <circle cx="190" cy="177.5" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="176" y="172" font-size="16" font-weight="800" fill="#0f172a" text-anchor="end" class="halo">A</text>

  <circle cx="300" cy="265.4" r="5.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.4" />
  <text x="306" y="252" font-size="16" font-weight="800" fill="#334155" class="halo">B</text>

  <circle cx="410" cy="237.8" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="420" y="226" font-size="16" font-weight="800" fill="#1d4ed8" class="halo">C</text>

  <!-- X-Axis Quantities -->
  <text x="190" y="358" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">X₀</text>
  <text x="300" y="358" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">X₁</text>
  <text x="410" y="358" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">X₂</text>

  <!-- Clean Decomposition Arrows Below X-Axis -->
  <line x1="194" y1="382" x2="292" y2="382" stroke="#334155" stroke-width="2.4" marker-end="url(#arr-dark)" />
  <text x="245" y="401" font-size="13.5" font-weight="800" fill="#334155" text-anchor="middle">대체효과 (+)</text>

  <line x1="304" y1="382" x2="402" y2="382" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="355" y="401" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">소득효과 (+)</text>

  <line x1="194" y1="422" x2="402" y2="422" stroke="#0f172a" stroke-width="2.8" marker-end="url(#axis-arr)" />
  <text x="300" y="441" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle">총 가격효과 (정상재: 대체 + 소득)</text>
</svg>
