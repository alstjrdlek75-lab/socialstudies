<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="50" fill="#f8fafc" />
  <text x="490" y="33" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">가격효과의 분해: 대체효과, 소득효과 및 재화 분류 (힉스 분해)</text>
  <line x1="0" y1="50" x2="980" y2="50" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="150" y="62" width="680" height="24" rx="5" fill="#fef3c7" stroke="#fde047" stroke-width="1" />
  <text x="490" y="78" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#854d0e">• 가격효과(A ➔ C) = 대체효과(A ➔ B, 동일효용 상대가격변화) + 소득효과(B ➔ C, 실질소득증가)</text>

  <!-- Axes: Origin (100, 480) -->
  <line x1="100" y1="480" x2="880" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="480" x2="100" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />
  <text x="890" y="485" font-size="12" font-weight="bold" fill="#475569">X재 소비량</text>
  <text x="100" y="92" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Y재 소비량</text>
  <text x="86" y="495" font-size="11" fill="#94a3b8">0</text>

  <!-- Budget Lines: X price falls -->
  <!-- BL0: from (100, 180) to (420, 480) [Initial, steep] -->
  <line x1="100" y1="180" x2="420" y2="480" stroke="#dc2626" stroke-width="2.5" />
  <text x="390" y="500" font-size="11" font-weight="bold" fill="#dc2626">BL0 (원초 예산선)</text>

  <!-- BL1: from (100, 180) to (760, 480) [After Px drops, flat] -->
  <line x1="100" y1="180" x2="760" y2="480" stroke="#2563eb" stroke-width="2.5" />
  <text x="740" y="500" font-size="11" font-weight="bold" fill="#2563eb">BL1 (가격하락 후)</text>

  <!-- Compensated Budget Line (Hicks): parallel to BL1, tangent to U0 -->
  <!-- from (100, 245) to (635, 480) -->
  <line x1="100" y1="245" x2="635" y2="480" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,4" />
  <text x="610" y="465" font-size="11" font-weight="bold" fill="#9333ea">보상예산선 (실질소득 불변)</text>

  <!-- Indifference Curves -->
  <!-- U0 (Initial Utility): tangent to BL0 at A(230, 302), tangent to comp line at B(320, 355) -->
  <path d="M 140 220 Q 230 330, 520 380" fill="none" stroke="#64748b" stroke-width="3" />
  <text x="530" y="385" font-size="12" font-weight="bold" fill="#64748b">U0</text>

  <!-- U1 (New Higher Utility): tangent to BL1 at C(480, 284) [Normal Good Case] -->
  <path d="M 220 170 Q 400 290, 780 330" fill="none" stroke="#16a34a" stroke-width="3" />
  <text x="790" y="335" font-size="12" font-weight="bold" fill="#16a34a">U1 (정상재 균형)</text>

  <!-- Points A, B, C -->
  <!-- Point A (230, 302) -->
  <circle cx="230" cy="302" r="5" fill="#dc2626" />
  <line x1="230" y1="302" x2="230" y2="480" stroke="#dc2626" stroke-dasharray="3,3" />
  <text x="210" y="295" font-size="12" font-weight="bold" fill="#dc2626">A (최초점)</text>
  <text x="230" y="498" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">X0</text>

  <!-- Point B (320, 355) -->
  <circle cx="320" cy="355" r="5" fill="#9333ea" />
  <line x1="320" y1="355" x2="320" y2="480" stroke="#9333ea" stroke-dasharray="3,3" />
  <text x="330" y="355" font-size="12" font-weight="bold" fill="#9333ea">B (보상점)</text>
  <text x="320" y="498" font-size="11" font-weight="bold" fill="#9333ea" text-anchor="middle">X_comp</text>

  <!-- Point C (480, 284) -->
  <circle cx="480" cy="284" r="5" fill="#16a34a" />
  <line x1="480" y1="284" x2="480" y2="480" stroke="#16a34a" stroke-dasharray="3,3" />
  <text x="490" y="280" font-size="12" font-weight="bold" fill="#16a34a">C (최종점: 정상재)</text>
  <text x="480" y="498" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">X1</text>

  <!-- Effect Arrows on bottom axis -->
  <!-- Substitution Effect: 230 to 320 -->
  <line x1="235" y1="520" x2="315" y2="520" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr)" />
  <text x="275" y="535" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#9333ea">대체효과 (+)</text>

  <!-- Income Effect: 320 to 480 -->
  <line x1="325" y1="520" x2="475" y2="520" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)" />
  <text x="400" y="535" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#16a34a">소득효과 (정상재 +)</text>

  <!-- Total Price Effect: 230 to 480 -->
  <line x1="230" y1="550" x2="480" y2="550" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />
  <text x="355" y="546" font-size="11" font-weight="bold" text-anchor="middle" fill="#2563eb">총 가격효과 (소비 대폭 증가)</text>
</svg>