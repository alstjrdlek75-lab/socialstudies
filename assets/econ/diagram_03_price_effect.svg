<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="48" fill="#f8fafc" />
  <text x="490" y="31" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">가격효과의 분해: 대체효과, 소득효과 및 재화 분류 (힉스 분해)</text>
  <line x1="0" y1="48" x2="980" y2="48" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="130" y="58" width="720" height="26" rx="13" fill="#fef3c7" stroke="#fde047" stroke-width="1" />
  <text x="490" y="75" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#854d0e">
    • 가격효과(A ➔ C) = 대체효과(A ➔ B, 동일효용 상대가격변화) + 소득효과(B ➔ C, 실질소득증가)
  </text>

  <!-- Summary Card (Top-Right) -->
  <g transform="translate(710, 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="250" height="26" rx="8" fill="#f1f5f9" />
    <path d="M 0 16 L 0 26 L 250 26 L 250 16 z" fill="#f1f5f9" />
    <text x="12" y="18" font-size="11.5" font-weight="bold" fill="#1e293b">📊 힉스 가격효과 분해 정리</text>

    <text x="12" y="44" font-size="10.5" font-weight="bold" fill="#9333ea">① 대체효과 (A ➔ B)</text>
    <text x="20" y="59" font-size="9.5" fill="#475569">동일 효용(U0) 상 이동: 상대가격 하락한 X재 소비 ↑</text>

    <text x="12" y="78" font-size="10.5" font-weight="bold" fill="#16a34a">② 소득효과 (B ➔ C)</text>
    <text x="20" y="93" font-size="9.5" fill="#475569">실질소득 증가로 예산선 평행이동: 정상재 소비 ↑</text>

    <line x1="10" y1="105" x2="240" y2="105" stroke="#e2e8f0" stroke-width="1" />

    <text x="12" y="122" font-size="10.5" font-weight="bold" fill="#2563eb">③ 총 가격효과 (A ➔ C)</text>
    <text x="20" y="137" font-size="9.5" fill="#475569">대체효과(+) + 소득효과(+) = 수요 대폭 증가</text>
    <text x="12" y="156" font-size="9.5" font-weight="bold" fill="#1e293b">※ 정상재는 항상 수요법칙 성립 (우하향)</text>
  </g>

  <!-- Axes: Origin (100, 460) -->
  <line x1="100" y1="460" x2="800" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <line x1="100" y1="460" x2="100" y2="92" stroke="#334155" stroke-width="2" marker-end="url(#axis-arr)" />
  <text x="810" y="465" font-size="12" font-weight="bold" fill="#334155">X재 소비량</text>
  <text x="100" y="84" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Y재 소비량</text>
  <text x="86" y="474" font-size="11" fill="#94a3b8">0</text>

  <!-- Budget Lines: X price falls -->
  <!-- BL0: from (100, 160) to (380, 460) [Initial, steep] -->
  <line x1="100" y1="160" x2="380" y2="460" stroke="#dc2626" stroke-width="2.5" />
  <rect x="290" y="432" width="85" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="332" y="446" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">BL0 (원초 예산선)</text>

  <!-- BL1: from (100, 160) to (760, 460) [After Px drops, flat] -->
  <line x1="100" y1="160" x2="760" y2="460" stroke="#2563eb" stroke-width="2.5" />
  <rect x="670" y="432" width="85" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="712" y="446" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">BL1 (가격하락 후)</text>

  <!-- Compensated Budget Line (Hicks): parallel to BL1, tangent to U0 at B(340, 373) -->
  <!-- from (100, 267) to (537, 460) -->
  <line x1="100" y1="267" x2="537" y2="460" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,4" />
  <rect x="440" y="432" width="90" height="20" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
  <text x="485" y="446" font-size="10" font-weight="bold" fill="#9333ea" text-anchor="middle">BLcomp (보상예산선)</text>

  <!-- Indifference Curves -->
  <!-- U0 (Initial Utility: Tangent to BL0 at A(210, 278), Tangent to BLcomp at B(340, 373)) -->
  <path d="M 140 170 C 180 230, 195 260, 210 278 C 235 310, 290 360, 340 373 C 390 385, 450 395, 520 402" fill="none" stroke="#64748b" stroke-width="3" />
  <rect x="525" y="392" width="40" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="545" y="406" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">U0</text>

  <!-- U1 (New Higher Utility: Tangent to BL1 at C(480, 328)) -->
  <path d="M 240 170 C 330 250, 410 310, 480 328 C 550 345, 650 365, 760 375" fill="none" stroke="#16a34a" stroke-width="3" />
  <rect x="765" y="365" width="95" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="812" y="379" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">U1 (정상재 균형)</text>

  <!-- Points A, B, C -->
  <!-- Point A (210, 278): Tangency of BL0 and U0 -->
  <circle cx="210" cy="278" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <line x1="210" y1="278" x2="210" y2="460" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="1.2" />
  <g transform="translate(130, 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="76" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="38" y="16" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">A (최초점)</text>
  </g>
  <line x1="170" y1="254" x2="204" y2="274" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Point B (340, 373): Tangency of BLcomp and U0 -->
  <circle cx="340" cy="373" r="5.5" fill="#9333ea" stroke="#ffffff" stroke-width="2" />
  <line x1="340" y1="373" x2="340" y2="460" stroke="#9333ea" stroke-dasharray="3,3" stroke-width="1.2" />
  <g transform="translate(345, 335)" filter="url(#shadow)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
    <text x="40" y="16" font-size="11" font-weight="bold" fill="#9333ea" text-anchor="middle">B (보상점)</text>
  </g>

  <!-- Point C (480, 328): Tangency of BL1 and U1 -->
  <circle cx="480" cy="328" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
  <line x1="480" y1="328" x2="480" y2="460" stroke="#16a34a" stroke-dasharray="3,3" stroke-width="1.2" />
  <g transform="translate(490, 290)" filter="url(#shadow)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="45" y="16" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">C (최종 소비점)</text>
  </g>
  <line x1="510" y1="314" x2="488" y2="325" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2" />

  <!-- X-Axis Point Projection Badges -->
  <rect x="192" y="468" width="36" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="210" y="482" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">X0</text>

  <rect x="317" y="468" width="46" height="20" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
  <text x="340" y="482" font-size="10" font-weight="bold" fill="#9333ea" text-anchor="middle">Xcomp</text>

  <rect x="462" y="468" width="36" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="480" y="482" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">X1</text>

  <!-- Effect Arrows on Bottom -->
  <!-- 1. Substitution Effect: 215 to 335 -->
  <line x1="215" y1="504" x2="335" y2="504" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr-purple)" />
  <rect x="235" y="494" width="80" height="20" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1" />
  <text x="275" y="508" font-size="10" font-weight="bold" fill="#9333ea" text-anchor="middle">대체효과 (+)</text>

  <!-- 2. Income Effect: 345 to 475 -->
  <line x1="345" y1="504" x2="475" y2="504" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)" />
  <rect x="370" y="494" width="80" height="20" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="410" y="508" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">소득효과 (+)</text>

  <!-- 3. Total Price Effect: 215 to 475 -->
  <line x1="215" y1="534" x2="475" y2="534" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />
  <rect x="275" y="524" width="140" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" />
  <text x="345" y="538" font-size="10.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">총 가격효과 (소비 대폭 증가)</text>
</svg>