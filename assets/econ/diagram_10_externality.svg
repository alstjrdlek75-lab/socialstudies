<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1020" height="630" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1d4ed8" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fee2e2" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="1.6" />
    </pattern>
  </defs>

  <!-- Overproduction DWL Triangle: E*(300, 185) -> Em(390, 230) -> SMC(390, 140) -->
  <polygon points="300,185 390,230 390,140" fill="url(#dwl-hatch)" stroke="#b91c1c" stroke-width="1.8" />
  <text x="404" y="190" font-size="14.5" font-weight="800" fill="#b91c1c" class="halo">과다생산 손실 (DWL)</text>

  <!-- Projections -->
  <line x1="300" y1="185" x2="300" y2="365" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="390" y1="140" x2="390" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Axes: Origin (105, 365) -->
  <line x1="105" y1="365" x2="600" y2="365" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <line x1="105" y1="365" x2="105" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#axis-arr)" />
  <text x="610" y="370" font-size="16" font-weight="800" fill="#0f172a">생산량 Q</text>
  <text x="105" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">가격 · 비용</text>
  <text x="89" y="382" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- Demand D = PMB = SMB: y = 0.5*(x-105) + 87.5 -> (135, 102.5) to (555, 312.5) -->
  <line x1="135" y1="102.5" x2="555" y2="312.5" stroke="#0f172a" stroke-width="3" />
  <text x="564" y="317" font-size="15" font-weight="800" fill="#0f172a">D = PMB = SMB</text>

  <!-- Private Marginal Cost PMC: y = -0.5*(x-105) + 372.5 -> (145, 352.5) to (555, 147.5) -->
  <line x1="145" y1="352.5" x2="555" y2="147.5" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,5" />
  <text x="564" y="152" font-size="15" font-weight="700" fill="#475569">PMC (사적비용)</text>

  <!-- Social Marginal Cost SMC = PMC + 외부비용: shifted up by 90px -> (145, 262.5) to (515, 77.5) -->
  <line x1="145" y1="262.5" x2="515" y2="77.5" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="524" y="82" font-size="15.5" font-weight="800" fill="#1d4ed8">SMC (사회적비용)</text>

  <!-- Pigouvian Tax Arrow at x = 205: from PMC(322.5) up to SMC(232.5) -->
  <line x1="205" y1="318" x2="205" y2="240" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#blue-arr)" />
  <text x="195" y="284" font-size="14.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">피구세 (t)</text>

  <!-- Equilibrium Points -->
  <circle cx="300" cy="185" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="292" y="168" font-size="15.5" font-weight="800" fill="#1d4ed8" text-anchor="end" class="halo">E* (최적)</text>
  <text x="300" y="392" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q*</text>

  <circle cx="390" cy="230" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="402" y="246" font-size="15" font-weight="800" fill="#0f172a" class="halo">Em (시장)</text>
  <text x="390" y="392" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Qm (과다)</text>
</svg>
