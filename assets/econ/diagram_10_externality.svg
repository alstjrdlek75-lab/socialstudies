<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <pattern id="dwl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2e8f0" fill-opacity="0.6" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.4" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="860" height="48" fill="#f8fafc" />
  <text x="430" y="31" font-size="17.5" font-weight="800" text-anchor="middle" fill="#0f172a">부정적 외부효과와 피구세 (Negative Externality &amp; Pigouvian Tax)</text>
  <line x1="0" y1="48" x2="860" y2="48" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Axes: Origin (100, 410) -->
  <line x1="100" y1="410" x2="730" y2="410" stroke="#334155" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="410" x2="100" y2="82" stroke="#334155" stroke-width="2" marker-end="url(#arr)" />
  <text x="740" y="415" font-size="13" font-weight="700" fill="#1e293b">생산량 (Q)</text>
  <text x="100" y="70" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">가격, 비용 (P)</text>
  <text x="86" y="425" font-size="12" fill="#64748b">0</text>

  <!-- Deadweight loss of overproduction: E*(350, 222.5) -> Em(450, 272.5) -> (450, 172.5) -->
  <polygon points="350,222.5 450,272.5 450,172.5" fill="url(#dwl-hatch)" stroke="#475569" stroke-width="1.5" />
  <text x="462" y="222" font-size="11.5" font-weight="700" fill="#334155">과다생산 후생손실 (DWL)</text>

  <!-- Demand D = PMB = SMB: y = 0.5*x + 47.5 => (130, 112.5) to (630, 362.5) -->
  <line x1="130" y1="112.5" x2="630" y2="362.5" stroke="#1d4ed8" stroke-width="2.8" />
  <text x="640" y="367" font-size="12.5" font-weight="800" fill="#1d4ed8">D = PMB = SMB</text>

  <!-- Supply PMC: y = -0.5*x + 497.5 => (150, 422.5 -> start 180, 407.5) to (630, 182.5) -->
  <line x1="180" y1="407.5" x2="630" y2="182.5" stroke="#64748b" stroke-width="2.3" stroke-dasharray="6,4" />
  <text x="640" y="186" font-size="12.5" font-weight="700" fill="#475569">사적한계비용 (PMC = S₀)</text>

  <!-- Supply SMC = PMC + 외부비용: y = -0.5*x + 397.5 => (150, 322.5) to (580, 107.5) -->
  <line x1="150" y1="322.5" x2="580" y2="107.5" stroke="#1e293b" stroke-width="2.8" />
  <text x="590" y="111" font-size="12.5" font-weight="800" fill="#0f172a">사회적한계비용 (SMC = S₁)</text>

  <!-- Pigouvian Tax arrow at x=240: from PMC(377.5) to SMC(277.5) -->
  <line x1="240" y1="373" x2="240" y2="283" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" />
  <text x="228" y="332" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="end">피구세(t)</text>

  <!-- Social Optimum Q* (350, 222.5) -->
  <line x1="350" y1="410" x2="350" y2="222.5" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3,3" />
  <circle cx="350" cy="222.5" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="350" y="434" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">Q* (사회적 최적)</text>

  <!-- Market Equilibrium Qm (450, 272.5) -->
  <line x1="450" y1="410" x2="450" y2="272.5" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3" />
  <circle cx="450" cy="272.5" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="450" y="434" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Qm (시장 과다생산)</text>
</svg>
