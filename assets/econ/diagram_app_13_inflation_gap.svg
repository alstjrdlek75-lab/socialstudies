<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="960" height="570" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="red-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- Inflationary Gap Shaded Band between Yp=245 and Y0=365 -->
  <rect x="245" y="160" width="120" height="155" fill="#fee2e2" fill-opacity="0.6" />

  <!-- Projections -->
  <line x1="95" y1="160" x2="365" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="365" y1="160" x2="365" y2="315" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Axes: Origin (95, 315) -->
  <line x1="95" y1="315" x2="555" y2="315" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr)" />
  <line x1="95" y1="315" x2="95" y2="34" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr)" />
  <text x="565" y="320" font-size="16" font-weight="800" fill="#0f172a">국민소득 Y</text>
  <text x="95" y="24" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">물가 P</text>
  <text x="79" y="332" font-size="15" font-weight="700" fill="#475569">0</text>

  <!-- LRAS at Yp = 245 -->
  <line x1="245" y1="315" x2="245" y2="48" stroke="#0f172a" stroke-width="2.8" stroke-dasharray="7,5" />
  <text x="245" y="36" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">LRAS (잠재 GDP)</text>

  <!-- SRAS through E0(365, 160): (145, 270) to (485, 100) -->
  <line x1="145" y1="270" x2="485" y2="100" stroke="#0f172a" stroke-width="3" />
  <text x="494" y="104" font-size="15.5" font-weight="800" fill="#0f172a">AS (단기)</text>

  <!-- AD through E0(365, 160): (185, 70) to (505, 230) -->
  <line x1="185" y1="70" x2="505" y2="230" stroke="#1d4ed8" stroke-width="3.2" />
  <text x="514" y="235" font-size="15.5" font-weight="800" fill="#1d4ed8">AD (총수요)</text>

  <!-- Equilibrium Dot E0 -->
  <circle cx="365" cy="160" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
  <text x="365" y="138" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle" class="halo">E₀ (단기균형)</text>
  <text x="83" y="165" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">P₀</text>

  <!-- Yp and Y0 + Inflationary Gap Arrow -->
  <text x="245" y="342" font-size="15.5" font-weight="800" fill="#0f172a" text-anchor="middle">Yp</text>
  <text x="365" y="342" font-size="15.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Y₀</text>

  <line x1="251" y1="286" x2="359" y2="286" stroke="#b91c1c" stroke-width="2.2" marker-start="url(#red-arr)" marker-end="url(#red-arr)" />
  <text x="305" y="272" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle" class="halo">인플레이션 갭</text>
  <text x="305" y="366" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">경기 과열 (Y₀ &gt; Yp)</text>
</svg>
