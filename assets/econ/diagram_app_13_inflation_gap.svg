<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, sans-serif;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arr-blue-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-blue-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Title / Legend bar -->
  <rect x="20" y="10" width="610" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="325" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">총수요-총공급(AD-AS) 모형: 인플레이션 갭 (Y₀ &gt; Yₚ 경기 과열)</text>

  <!-- Axes: Origin (75, 280) -->
  <line x1="75" y1="280" x2="540" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#arr2)" />
  <line x1="75" y1="280" x2="75" y2="62" stroke="#334155" stroke-width="1.8" marker-end="url(#arr2)" />
  <text x="548" y="284" font-size="12.5" font-weight="700" fill="#334155">국민소득 (Y)</text>
  <text x="75" y="53" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">물가수준 (P)</text>
  <text x="61" y="294" font-size="11" fill="#64748b">0</text>

  <!-- Inflationary Gap Shaded Zone (between Yp=230 and Y0=350) -->
  <rect x="230" y="155" width="120" height="125" fill="#eff6ff" fill-opacity="0.7" />

  <!-- Long-Run AS (LRAS): Vertical line at Yp (x = 230) -->
  <line x1="230" y1="280" x2="230" y2="72" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" />
  <text x="230" y="63" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">LRAS (잠재 GDP)</text>
  <text x="230" y="301" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Yₚ</text>

  <!-- Short-Run AS: Upward sloping line passing through E0 (350, 155) -->
  <line x1="120" y1="270" x2="470" y2="95" stroke="#1e293b" stroke-width="2.4" />
  <text x="478" y="99" font-size="12" font-weight="700" fill="#1e293b">AS (단기 총공급)</text>

  <!-- Aggregate Demand AD: Downward sloping line passing through E0 (350, 155) -->
  <line x1="170" y1="65" x2="490" y2="225" stroke="#1d4ed8" stroke-width="2.4" />
  <text x="498" y="229" font-size="12" font-weight="700" fill="#1d4ed8">AD (단기 총수요)</text>

  <!-- Projection lines to axes -->
  <line x1="75" y1="155" x2="350" y2="155" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="350" y1="280" x2="350" y2="155" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Intersection Dot E0 -->
  <circle cx="350" cy="155" r="5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
  <text x="360" y="148" font-size="13" font-weight="700" fill="#0f172a">E₀ (단기균형)</text>
  <text x="64" y="159" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">P₀</text>
  <text x="350" y="301" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Y₀</text>

  <!-- Inflationary Gap Dimension Indicator -->
  <line x1="234" y1="250" x2="346" y2="250" stroke="#1d4ed8" stroke-width="1.3" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue-right)" />
  <rect x="235" y="223" width="110" height="22" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="290" y="238" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">인플레이션 갭 (Y₀ &gt; Yₚ)</text>
</svg>
