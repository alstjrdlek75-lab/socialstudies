<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="1140" height="660" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="arr-money" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-real" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Minimal Inline Legend in Open Top Corners -->
  <line x1="34" y1="22" x2="68" y2="22" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arr-money)" />
  <text x="78" y="27" font-size="13" font-weight="700" fill="#1d4ed8">화폐 흐름 (시계)</text>

  <line x1="564" y1="22" x2="598" y2="22" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-real)" />
  <text x="608" y="27" font-size="13" font-weight="700" fill="#475569">실물 흐름 (반시계)</text>

  <!-- 1. OUTER LOOP: 화폐 흐름 (시계 방향) -->
  <path d="M 96 176 C 104 102, 168 68, 242 66" fill="none" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arr-money)" />
  <text x="122" y="74" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">소비지출</text>

  <path d="M 514 66 C 592 68, 656 102, 664 166" fill="none" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arr-money)" />
  <text x="638" y="74" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">판매수입</text>

  <path d="M 664 282 C 656 348, 592 380, 518 382" fill="none" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arr-money)" />
  <text x="638" y="382" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">요소비용</text>

  <path d="M 246 382 C 168 380, 104 348, 96 274" fill="none" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arr-money)" />
  <text x="122" y="382" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle" class="halo">요소소득</text>

  <!-- 2. INNER LOOP: 실물 흐름 (반시계 방향) -->
  <path d="M 584 198 C 548 156, 512 132, 478 118" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-real)" />
  <text x="502" y="172" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle" class="halo">생산물 공급</text>

  <path d="M 282 118 C 248 132, 212 156, 178 196" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-real)" />
  <text x="258" y="172" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle" class="halo">생산물 구입</text>

  <path d="M 176 252 C 212 292, 248 314, 280 328" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-real)" />
  <text x="262" y="280" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle" class="halo">노동·자본·토지</text>

  <path d="M 480 328 C 512 314, 548 292, 582 254" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-real)" />
  <text x="500" y="280" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle" class="halo">생산요소 투입</text>

  <!-- 3. FOUR STRUCTURAL NODES -->
  <!-- Top: 생산물 시장 -->
  <rect x="250" y="34" width="260" height="78" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="380" y="66" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">생산물 시장</text>
  <text x="380" y="94" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">지출 GDP (C + I + G + NX)</text>

  <!-- Bottom: 생산요소 시장 -->
  <rect x="250" y="334" width="260" height="78" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.4" />
  <text x="380" y="366" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">생산요소 시장</text>
  <text x="380" y="394" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">분배 GDP (임금·지대·이자·이윤)</text>

  <!-- Left: 가계 -->
  <rect x="28" y="180" width="144" height="88" rx="12" fill="#0f172a" />
  <text x="100" y="218" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">가계</text>
  <text x="100" y="244" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">소비 · 요소공급</text>

  <!-- Right: 기업 -->
  <rect x="588" y="172" width="144" height="104" rx="12" fill="#0f172a" />
  <text x="660" y="205" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">기업</text>
  <text x="660" y="228" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">생산 · 요소수요</text>
  <rect x="598" y="240" width="124" height="26" rx="6" fill="#1d4ed8" />
  <text x="660" y="258" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">생산 GDP (부가가치)</text>

  <!-- 4. CENTER IDENTITY -->
  <rect x="266" y="194" width="228" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="380" y="216" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">삼면등가의 법칙 (사후적 항등)</text>
  <text x="380" y="240" font-size="16.5" font-weight="800" fill="#0f172a" text-anchor="middle">생산(Y) ≡ 지출(Y) ≡ 분배(Y)</text>
</svg>
