<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%" style="background:#ffffff; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#2563eb" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#475569" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="920" height="50" fill="#f8fafc" />
  <text x="460" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">국민경제의 순환과 GDP 삼면등가의 법칙</text>
  <line x1="0" y1="50" x2="920" y2="50" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtitle Badge -->
  <rect x="130" y="62" width="660" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="460" y="79" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1d4ed8">• 삼면등가의 법칙: 생산국민소득(GDP) ≡ 지출국민소득(C+I+G+NX) ≡ 분배국민소득(임금+지대+이자+이윤)</text>

  <!-- TOP CENTER: 생산물 시장 (Goods Market) -->
  <g transform="translate(340, 102)">
    <rect x="0" y="0" width="240" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="240" height="26" rx="8" fill="#f8fafc" />
    <rect x="0" y="20" width="240" height="6" fill="#f8fafc" />
    <line x1="0" y1="26" x2="240" y2="26" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="18" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">생산물 시장 (Goods Market)</text>
    <text x="120" y="49" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">지출국민소득: C + I + G + NX</text>
  </g>

  <!-- LEFT: 가계 (Households) -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="210" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#f8fafc" />
    <rect x="0" y="24" width="210" height="10" fill="#f8fafc" />
    <line x1="0" y1="34" x2="210" y2="34" stroke="#e2e8f0" stroke-width="1" />
    <text x="105" y="23" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">가계 (Households)</text>
    
    <text x="20" y="60" font-size="11.5" fill="#334155">• 생산요소(L, K, T) 공급자</text>
    <text x="20" y="83" font-size="11.5" fill="#334155">• 생산물 최종 소비자</text>
    <text x="20" y="106" font-size="11.5" fill="#334155">• 소득의 원천: 요소소득</text>
    <rect x="15" y="118" width="180" height="22" rx="4" fill="#eff6ff" stroke="#dbeafe" stroke-width="1" />
    <text x="105" y="133" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">처분: Y = C + S + T</text>
  </g>

  <!-- RIGHT: 기업 (Firms) -->
  <g transform="translate(650, 155)">
    <rect x="0" y="0" width="210" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#f8fafc" />
    <rect x="0" y="24" width="210" height="10" fill="#f8fafc" />
    <line x1="0" y1="34" x2="210" y2="34" stroke="#e2e8f0" stroke-width="1" />
    <text x="105" y="23" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">기업 (Firms)</text>
    
    <text x="20" y="60" font-size="11.5" fill="#334155">• 생산요소(L, K, T) 수요자</text>
    <text x="20" y="83" font-size="11.5" fill="#334155">• 재화·서비스 생산·공급자</text>
    <text x="20" y="106" font-size="11.5" fill="#334155">• 부가가치 창출 주체</text>
    <rect x="15" y="118" width="180" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="105" y="133" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">최종재 가치 = 부가가치 합</text>
  </g>

  <!-- BOTTOM CENTER: 생산요소 시장 (Factor Market) -->
  <g transform="translate(340, 290)">
    <rect x="0" y="0" width="240" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="240" height="26" rx="8" fill="#f8fafc" />
    <rect x="0" y="20" width="240" height="6" fill="#f8fafc" />
    <line x1="0" y1="26" x2="240" y2="26" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="18" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">생산요소 시장 (Factor Market)</text>
    <text x="120" y="49" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">분배국민소득: 요소소득의 총합</text>
  </g>

  <!-- CENTER BADGE: 삼면등가의 법칙 -->
  <g transform="translate(460, 227)">
    <circle cx="0" cy="0" r="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#card-shadow)" />
    <text x="0" y="-8" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">GDP</text>
    <text x="0" y="10" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">삼면등가</text>
    <text x="0" y="24" font-size="9" font-weight="600" fill="#60a5fa" text-anchor="middle">생산 ≡ 지출 ≡ 분배</text>
  </g>

  <!-- ARROWS & FLOWS -->
  <!-- Top Flows: 소비지출 & 재화공급 -->
  <path d="M 210 155 C 240 120, 290 120, 335 125" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="200" y="106" width="100" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="250" y="120" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">소비 지출 (C)</text>

  <path d="M 710 155 C 680 120, 630 120, 585 125" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)" />
  <rect x="618" y="106" width="108" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="672" y="120" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">재화·서비스 공급</text>

  <!-- Bottom Flows: 생산요소공급 & 요소소득 -->
  <path d="M 210 305 C 240 335, 290 335, 335 328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-slate)" />
  <rect x="180" y="328" width="135" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="247" y="342" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">생산요소 공급 (L, K, T)</text>

  <path d="M 710 305 C 680 335, 630 335, 585 328" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="585" y="328" width="155" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="662" y="342" font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">요소소득 (임금·이자·지대·이윤)</text>

  <!-- FLOW TYPE LEGEND -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="800" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="18" y="24" font-size="12" font-weight="700" fill="#0f172a">💡 삼면등가의 법칙 핵심 요약</text>
    <line x1="18" y1="34" x2="782" y2="34" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="54" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#1d4ed8">1. 생산국민소득</tspan> : 일정 기간 동안 국내의 모든 경제주체가 창출한 최종 생산물의 가치 (부가가치의 총합)</text>
    <text x="25" y="73" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#1d4ed8">2. 분배국민소득</tspan> : 생산 과정에 참여한 생산요소 공급자(가계)에게 분배된 요소소득(임금+지대+이자+이윤)의 총합</text>
    <text x="25" y="92" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#1d4ed8">3. 지출국민소득</tspan> : 가계, 기업, 정부, 외국이 생산물에 지출한 총액 (소비 C + 투자 I + 정부지출 G + 순수출 NX)</text>
  </g>
</svg>